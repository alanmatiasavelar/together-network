<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Chat — Together</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="config-banner" id="configBanner" hidden>
  <div class="wrap">
    <span><strong>Demo mode:</strong> <span data-i18n="banner.demo_projects">connect a free Supabase project to view real projects.</span></span>
    <button id="dismissBanner" aria-label="Dismiss">&times;</button>
  </div>
</div>

<header class="nav">
  <div class="nav-inner">
    <a class="brand" href="index.html"><img src="assets/logo.jpg" alt="Together"/></a>
    <nav class="nav-links"><a href="feed.html" data-i18n="nav.feed">Feed</a></nav>
    <div class="nav-auth" id="navAuth">
      <a class="btn btn-ghost" href="login.html" data-i18n="nav.login">Log in</a>
      <a class="btn btn-primary" href="signup.html" data-i18n="nav.signup">Sign up</a>
    </div>
    <span id="langSlot"></span>
  </div>
</header>

<main>
  <div class="wrap" style="padding-top:40px;padding-bottom:60px;max-width:760px;">
    <a class="auth-back" id="backLink" href="feed.html" data-i18n="task.back_to_project">← Back to project</a>
    <div id="pageContent"><div class="loading-state"><span class="spinner" aria-hidden="true"></span><span data-i18n="common.loading">Loading…</span></div></div>
  </div>
</main>

<footer>
  <div class="wrap footer-inner">
    <div class="footer-brand"><img src="assets/logo.jpg" alt="Together"/></div>
    <p class="fine">© <span id="year"></span> Together. <span data-i18n="footer.tagline">Join efforts, not feeds.</span></p>
    <a class="contact" href="mailto:aolbr_mail@yahoo.com.br" data-i18n="footer.contact">Contact →</a>
  </div>
</footer>

<script src="config.js"></script>
<script src="i18n.js"></script>
<script>
document.getElementById('year').textContent = new Date().getFullYear();
showConfigBannerIfNeeded();
document.getElementById('langSlot').innerHTML = langSwitcherHTML();
wireLangSwitcher();
applyStaticTranslations();

function onLangChange(){
  renderNav();
  if (project) render();
}

const params = new URLSearchParams(window.location.search);
const projectId = params.get('id');
const navAuth = document.getElementById('navAuth');
const content = document.getElementById('pageContent');

let currentUser = null;
let project = null;
let isTeamMember = false;
let messages = [];
let chatChannel = null;

function renderNav(){
  if (currentUser){
    const name = currentUser.user_metadata?.display_name || currentUser.email.split('@')[0];
    navAuth.innerHTML = `
      <a class="btn btn-ghost btn-small" href="dashboard.html">${t('nav.dashboard')}</a>
      <span class="user-chip"><span class="avatar">${initials(name)}</span>${escapeHTML(name)}</span>
      <a class="btn btn-ghost btn-small" href="feed.html">${t('nav.feed')}</a>
    `;
  } else {
    navAuth.innerHTML = `
      <a class="btn btn-ghost" href="login.html">${t('nav.login')}</a>
      <a class="btn btn-primary" href="signup.html">${t('nav.signup')}</a>
    `;
  }
}

async function loadChat(){
  if (!projectId){
    content.innerHTML = `<p class="form-msg error">${t('task.not_found')}</p>`;
    return;
  }
  if (!supabaseClient){
    content.innerHTML = `<p class="form-msg error">${t('project.not_connected')}</p>`;
    return;
  }
  if (!currentUser){
    content.innerHTML = `<p class="form-msg error">${t('chat.not_a_member')}</p>`;
    return;
  }

  const { data: proj, error: projError } = await supabaseClient
    .from('projects')
    .select('id, title')
    .eq('id', projectId)
    .single();
  if (projError || !proj){
    content.innerHTML = `<p class="form-msg error">${t('task.not_found')}</p>`;
    return;
  }
  project = proj;
  document.getElementById('backLink').href = `project.html?id=${projectId}`;

  const { data: memberCheck } = await supabaseClient.rpc('is_project_team_member', { p_project_id: projectId });
  isTeamMember = !!memberCheck;
  if (!isTeamMember){
    content.innerHTML = `<p class="form-msg error">${t('chat.not_a_member')}</p>`;
    return;
  }

  const { data: msgData, error: msgError } = await supabaseClient
    .from('project_chat_messages')
    .select('*')
    .eq('project_id', projectId)
    .order('created_at', { ascending: true })
    .limit(200);
  if (msgError){
    content.innerHTML = `<p class="form-msg error">${escapeHTML(msgError.message)}</p>`;
    return;
  }
  messages = msgData || [];

  render();
  subscribeToChat();
}

function renderMessages(){
  const log = document.getElementById('chatLog');
  if (!log) return;
  log.innerHTML = messages.length === 0
    ? `<p class="credits-note">${t('chat.empty_state')}</p>`
    : messages.map(m => {
        const own = currentUser && m.user_id === currentUser.id;
        const when = new Date(m.created_at).toLocaleString(currentLang, { dateStyle: 'medium', timeStyle: 'short' });
        return `
          <div class="chat-msg ${own ? 'own' : 'other'}">
            <div class="chat-msg-name">${escapeHTML(m.user_name)}</div>
            <div class="chat-msg-bubble">${escapeHTML(m.body)}</div>
            <div class="chat-msg-time">${escapeHTML(when)}</div>
          </div>
        `;
      }).join('');
  log.scrollTop = log.scrollHeight;
}

function render(){
  const html = `
    <p class="eyebrow">${escapeHTML(project.title || '')}</p>
    <h1 style="margin-top:8px;">${t('chat.heading')}</h1>
    <div class="section-block" style="margin-top:20px;">
      <div class="chat-log" id="chatLog"></div>
      <form id="chatForm" class="chat-form">
        <textarea name="body" id="chatInput" rows="1" placeholder="${t('chat.placeholder')}" required maxlength="4000"></textarea>
        <button class="btn btn-primary btn-small" type="submit" id="chatSendBtn" disabled>${t('chat.send')}</button>
      </form>
      <p class="form-msg" id="chatMsg"></p>
    </div>
  `;
  content.innerHTML = html;
  renderMessages();
  wireEvents();
}

function autoGrowTextarea(el){
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 140) + 'px';
}

function wireEvents(){
  const form = document.getElementById('chatForm');
  if (!form) return;
  const textarea = document.getElementById('chatInput');
  const sendBtn = document.getElementById('chatSendBtn');

  textarea.addEventListener('input', () => {
    sendBtn.disabled = textarea.value.trim().length === 0;
    autoGrowTextarea(textarea);
  });

  textarea.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey){
      e.preventDefault();
      if (!sendBtn.disabled) form.requestSubmit();
    }
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const msg = document.getElementById('chatMsg');
    const body = (textarea.value || '').trim();
    if (!body) return;
    const userName = currentUser.user_metadata?.display_name || currentUser.email.split('@')[0];
    textarea.disabled = true;
    sendBtn.disabled = true;
    const { error } = await supabaseClient.from('project_chat_messages').insert({
      project_id: projectId, user_id: currentUser.id, user_name: userName, body
    });
    textarea.disabled = false;
    if (error){
      msg.textContent = t('chat.err_generic');
      msg.className = 'form-msg error';
      sendBtn.disabled = false;
      textarea.focus();
      return;
    }
    msg.textContent = '';
    e.target.reset();
    autoGrowTextarea(textarea);
    textarea.focus();
  });
}

function subscribeToChat(){
  if (chatChannel) supabaseClient.removeChannel(chatChannel);
  chatChannel = supabaseClient
    .channel(`project-chat-${projectId}`)
    .on('postgres_changes', {
      event: 'INSERT', schema: 'public', table: 'project_chat_messages', filter: `project_id=eq.${projectId}`
    }, (payload) => {
      if (messages.some(m => m.id === payload.new.id)) return;
      messages.push(payload.new);
      renderMessages();
    })
    .subscribe();
}

async function init(){
  if (!supabaseClient){
    content.innerHTML = `<p class="form-msg error">${t('project.not_connected')}</p>`;
    return;
  }
  const { data: { session } } = await supabaseClient.auth.getSession();
  currentUser = session?.user || null;
  renderNav();
  await loadChat();
  supabaseClient.auth.onAuthStateChange(async (_event, session) => {
    currentUser = session?.user || null;
    renderNav();
    await loadChat();
  });
}

window.addEventListener('beforeunload', () => {
  if (chatChannel) supabaseClient.removeChannel(chatChannel);
});

init();
</script>

</body>
</html>
