<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Set a new password — Together</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="config-banner" id="configBanner" hidden>
  <div class="wrap">
    <span><strong>Demo mode:</strong> <span data-i18n="banner.demo_login">connect a free Supabase project to turn on real log in.</span></span>
    <button id="dismissBanner" aria-label="Dismiss">&times;</button>
  </div>
</div>

<header class="nav">
  <div class="nav-inner">
    <a class="brand" href="index.html"><img src="assets/logo.jpg" alt="Together"/></a>
    <div class="nav-auth">
      <a class="btn btn-ghost" href="login.html" data-i18n="nav.login">Log in</a>
    </div>
    <span id="langSlot"></span>
  </div>
</header>

<main class="auth-page">
  <div class="auth-card" id="resetCard">
    <h1 data-i18n="resetpw.heading">Set a new password</h1>
    <p class="auth-sub" id="resetSub" data-i18n="common.loading">Loading…</p>

    <form id="resetForm" class="auth-form" hidden>
      <label><span data-i18n="resetpw.new_password">New password</span><input type="password" required name="password" minlength="6" autocomplete="new-password"></label>
      <label><span data-i18n="resetpw.confirm_password">Confirm new password</span><input type="password" required name="confirm" minlength="6" autocomplete="new-password"></label>
      <button class="btn btn-primary" type="submit" data-i18n="resetpw.cta">Set new password</button>
      <p class="form-msg" id="resetMsg"></p>
    </form>

    <p class="auth-switch" id="requestNewLinkRow" hidden><a href="forgot-password.html" data-i18n="resetpw.request_new">Request a new reset link →</a></p>
  </div>
</main>

<footer>
  <div class="wrap footer-inner">
    <div class="footer-brand"><img src="assets/logo.jpg" alt="Together"/></div>
    <p class="fine">© <span id="year"></span> Together. <span data-i18n="footer.tagline">Join efforts, not feeds.</span></p>
    <a class="contact" href="mailto:aolbr_mail@yahoo.com.br" data-i18n="footer.contact">Contact →</a>
  </div>
</footer>

<script src="config.js"></script>
<script src="i18n.js"></script>
<script>
  document.getElementById('year').textContent = new Date().getFullYear();
  showConfigBannerIfNeeded();
  document.getElementById('langSlot').innerHTML = langSwitcherHTML();
  wireLangSwitcher();
  applyStaticTranslations();
  function onLangChange(){}

  const sub = document.getElementById('resetSub');
  const form = document.getElementById('resetForm');
  const requestNewLinkRow = document.getElementById('requestNewLinkRow');

  async function init(){
    if (!supabaseClient){
      sub.textContent = t('login.err_not_connected');
      sub.className = 'auth-sub form-msg error';
      return;
    }
    // Clicking the emailed link lands here with a recovery token in the URL;
    // supabase-js reads it automatically (detectSessionInUrl) and turns it
    // into a session — that's what authorizes updateUser() below, not a
    // normal signed-in session.
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session){
      sub.textContent = t('resetpw.invalid_link');
      sub.className = 'auth-sub form-msg error';
      requestNewLinkRow.hidden = false;
      return;
    }
    sub.textContent = t('resetpw.sub');
    form.hidden = false;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const msg = document.getElementById('resetMsg');
    msg.textContent = ''; msg.className = 'form-msg';
    const fd = new FormData(e.target);
    const password = fd.get('password');
    const confirm = fd.get('confirm');
    if (password !== confirm){
      msg.textContent = t('resetpw.err_mismatch');
      msg.className = 'form-msg error';
      return;
    }
    const submitBtn = e.target.querySelector('button[type="submit"]');
    submitBtn.disabled = true;
    const { error } = await supabaseClient.auth.updateUser({ password });
    submitBtn.disabled = false;
    if (error){
      msg.textContent = error.message;
      msg.className = 'form-msg error';
      return;
    }
    form.hidden = true;
    sub.textContent = t('resetpw.success');
    sub.className = 'auth-sub form-msg ok';
    setTimeout(() => { window.location.href = 'feed.html'; }, 1800);
  });

  init();
</script>

</body>
</html>
