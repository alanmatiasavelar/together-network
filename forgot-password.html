<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Forgot password — Together</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="config-banner" id="configBanner" hidden>
  <div class="wrap">
    <span><strong>Demo mode:</strong> <span data-i18n="banner.demo_login">connect a free Supabase project to turn on real log in.</span></span>
    <button id="dismissBanner" aria-label="Dismiss">&times;</button>
  </div>
</div>

<header class="nav">
  <div class="nav-inner">
    <a class="brand" href="index.html"><img src="assets/logo.jpg" alt="Together"/></a>
    <div class="nav-auth">
      <a class="btn btn-ghost" href="login.html" data-i18n="nav.login">Log in</a>
    </div>
    <span id="langSlot"></span>
  </div>
</header>

<main class="auth-page">
  <div class="auth-card">
    <a class="auth-back" href="login.html" data-i18n="forgotpw.back_to_login">← Back to log in</a>
    <h1 data-i18n="forgotpw.heading">Forgot your password?</h1>
    <p class="auth-sub" data-i18n="forgotpw.sub">Enter your email and we'll send you a link to set a new one.</p>

    <form id="forgotForm" class="auth-form">
      <label><span data-i18n="login.email">Email</span><input type="email" required name="email" autocomplete="email"></label>
      <button class="btn btn-primary" type="submit" data-i18n="forgotpw.cta">Send reset link</button>
      <p class="form-msg" id="forgotMsg"></p>
    </form>

    <p class="auth-switch"><a href="login.html" data-i18n="forgotpw.back_to_login">← Back to log in</a></p>
  </div>
</main>

<footer>
  <div class="wrap footer-inner">
    <div class="footer-brand"><img src="assets/logo.jpg" alt="Together"/></div>
    <p class="fine">© <span id="year"></span> Together. <span data-i18n="footer.tagline">Join efforts, not feeds.</span></p>
    <a class="contact" href="mailto:aolbr_mail@yahoo.com.br" data-i18n="footer.contact">Contact →</a>
  </div>
</footer>

<script src="config.js"></script>
<script src="i18n.js"></script>
<script>
  document.getElementById('year').textContent = new Date().getFullYear();
  showConfigBannerIfNeeded();
  document.getElementById('langSlot').innerHTML = langSwitcherHTML();
  wireLangSwitcher();
  applyStaticTranslations();
  function onLangChange(){}

  if (supabaseClient) {
    supabaseClient.auth.getSession().then(({ data: { session } }) => {
      if (session && session.user) window.location.href = 'feed.html';
    }).catch(() => {});
  }

  document.getElementById('forgotForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const msg = document.getElementById('forgotMsg');
    msg.textContent = ''; msg.className = 'form-msg';
    if (!supabaseClient){
      msg.textContent = t('login.err_not_connected');
      msg.className = 'form-msg error';
      return;
    }
    const submitBtn = e.target.querySelector('button[type="submit"]');
    submitBtn.disabled = true;
    const fd = new FormData(e.target);
    const email = fd.get('email');
    const redirectTo = new URL('reset-password.html', window.location.href).href;
    const { error } = await supabaseClient.auth.resetPasswordForEmail(email, { redirectTo });
    submitBtn.disabled = false;
    if (error){
      msg.textContent = error.message;
      msg.className = 'form-msg error';
      return;
    }
    msg.textContent = t('forgotpw.sent');
    msg.className = 'form-msg ok';
    e.target.reset();
  });
</script>

</body>
</html>
