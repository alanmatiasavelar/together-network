<script>

document.getElementById('langSlot').innerHTML = langSwitcherHTML();

applyStaticTranslations();

function onLangChange(){
  renderNav();
  if (project) render();
}

const params = new URLSearchParams(window.location.search);
const projectId = params.get('id');
const navAuth = document.getElementById('navAuth');
const content = document.getElementById('pageContent');

const VALID_TABS = ['feed', 'goals', 'requirements', 'tasks', 'polls', 'events', 'costs', 'schedule', 'wbs'];

let currentUser = null;
let project = null;
let activeTab = VALID_TABS.includes(params.get('tab')) ? params.get('tab') : 'feed';
let editingGoalId = null;
let editingReqId = null;
let editingTaskId = null;
let editingEventId = null;
let editingFeedPostId = null;
let editingCostId = null;
let editingActivityId = null;
let editingWbsId = null;
let ganttZoom = 1;
let wbsZoom = 1;

const ZOOM_MIN = 0.5, ZOOM_MAX = 2.5, ZOOM_STEP = 0.25;

function clampZoom(z){
  return Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, z));
}

function renderChartToolbar(prefix, zoom){
  return `
    <div class="chart-toolbar">
      <div class="zoom-group">
        <button type="button" class="zoom-btn" data-zoom-out="${prefix}" aria-label="${t('chart.zoom_out')}">−</button>
        <span class="zoom-level">${Math.round(zoom * 100)}%</span>
        <button type="button" class="zoom-btn" data-zoom-in="${prefix}" aria-label="${t('chart.zoom_in')}">+</button>
      </div>
      <button type="button" class="btn btn-ghost btn-small" data-zoom-reset="${prefix}">${t('chart.zoom_reset')}</button>
      <span class="spacer"></span>
      <button type="button" class="btn btn-ghost btn-small" data-export-png="${prefix}">⤓ ${t('chart.export_png')}</button>
    </div>
  `;
}

async function exportChartToPng(scrollElId, filename){
  const el = document.getElementById(scrollElId);
  if (!el || typeof html2canvas !== 'function') return;
  const canvas = await html2canvas(el, { backgroundColor: '#ffffff', scale: 2 });
  canvas.toBlob(blob => {
    if (!blob) return;
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  });
}

function renderNav(){
  if (currentUser){
    const name = currentUser.user_metadata?.display_name || currentUser.email.split('@')[0];
    navAuth.innerHTML = `
      <a class="btn btn-ghost btn-small" href="dashboard.html">${t('nav.dashboard')}</a>
      <span class="user-chip"><span class="avatar">${initials(name)}</span>${escapeHTML(name)}</span>
      <a class="btn btn-ghost btn-small" href="feed.html">${t('nav.feed')}</a>
    `;
    initNotifications(currentUser);
  } else {
    navAuth.innerHTML = `
      <a class="btn btn-ghost" href="login.html">${t('nav.login')}</a>
      <a class="btn btn-primary" href="signup.html">${t('nav.signup')}</a>
    `;
    teardownNotifications();
  }
}

const YOUTUBE_LINK_PATTERN = /^https:\/\/(www\.)?(youtube\.com|youtu\.be)\//;
const MAX_IMAGE_BYTES = 8 * 1024 * 1024; // 8MB

async function uploadFeedImage(file){
  file = await compressImage(file);
  const extMatch = /\.([a-zA-Z0-9]+)$/.exec(file.name || '');
  const ext = (extMatch ? extMatch[1] : 'jpg').toLowerCase().replace(/[^a-z0-9]/g, '') || 'jpg';
  const path = `${projectId}/feed-${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${ext}`;
  const { error } = await supabaseClient.storage.from('project-post-images').upload(path, file, { contentType: file.type });
  if (error) throw error;
  const { data } = supabaseClient.storage.from('project-post-images').getPublicUrl(path);
  return data.publicUrl;
}

async function uploadCoverImage(file){
  file = await compressImage(file);
  const extMatch = /\.([a-zA-Z0-9]+)$/.exec(file.name || '');
  const ext = (extMatch ? extMatch[1] : 'jpg').toLowerCase().replace(/[^a-z0-9]/g, '') || 'jpg';
  const path = `${projectId}/cover-${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${ext}`;
  const { error } = await supabaseClient.storage.from('project-post-images').upload(path, file, { contentType: file.type });
  if (error) throw error;
  const { data } = supabaseClient.storage.from('project-post-images').getPublicUrl(path);
  return data.publicUrl;
}

async function loadProject(){
  if (!projectId){
    content.innerHTML = `<p class="form-msg error">${t('project.not_specified')}</p>`;
    return;
  }
  if (!supabaseClient){
    content.innerHTML = `<p class="form-msg error">${t('project.not_connected')}</p>`;
    return;
  }
  const { data, error } = await supabaseClient
    .from('projects')
    .select(`*,
      project_goals(*),
      project_requirements(*),
      project_collaborators(id, user_id, status, profiles(display_name)),
      project_supporters(user_id, amount),
      project_tasks(*, task_assignees(user_id, profiles(display_name))),
      project_polls(*, poll_votes(user_id, option_index)),
      project_events(*, event_rsvps(user_id, status)),
      project_costs(*),
      project_activities(*),
      project_activity_links(*),
      project_wbs_items(*)`)
    .eq('id', projectId)
    .single();
  if (error || !data){
    content.innerHTML = `<p class="form-msg error">${t('project.load_error')} ${escapeHTML(error?.message || 'not found')}</p>`;
    return;
  }
  project = data;
  await loadFeedPosts();
  render();
}

const FEED_PAGE_SIZE = 15;
let feedPosts = [];
let hasMoreFeedPosts = false;

async function loadFeedPosts(loadMore){
  let q = supabaseClient.from('project_feed_posts').select('*').eq('project_id', projectId)
    .order('created_at', { ascending: false }).limit(FEED_PAGE_SIZE);
  if (loadMore && feedPosts.length) q = q.lt('created_at', feedPosts[feedPosts.length - 1].created_at);
  const { data: page } = await q;
  hasMoreFeedPosts = (page || []).length === FEED_PAGE_SIZE;
  feedPosts = loadMore ? feedPosts.concat(page || []) : (page || []);
}

function render(){
  const isOwner = currentUser && currentUser.id === project.owner_id;
  const myCollab = (project.project_collaborators || []).find(c => c.user_id === currentUser?.id);
  const approvedCollabs = (project.project_collaborators || []).filter(c => c.status === 'approved');
  const pendingRequests = (project.project_collaborators || []).filter(c => c.status === 'pending');
  const hasAccess = isOwner || (myCollab && myCollab.status === 'approved');

  if (!hasAccess){
    renderLocked(myCollab);
    return;
  }

  let html = '';

  if (isOwner && pendingRequests.length > 0){
    html += `
      <div class="notify-banner">
        <h3>🔔 ${pendingRequests.length} ${pendingRequests.length === 1 ? t('project.notif_one') : t('project.notif_other')}</h3>
        ${pendingRequests.map(r => `
          <div class="notify-row">
            <span class="req-name">${escapeHTML(r.profiles?.display_name || 'Someone')}</span>
            <div class="notify-actions">
              <button class="btn btn-ghost btn-small" data-approve="${r.id}">${t('project.approve')}</button>
              <button class="btn btn-ghost btn-small" data-deny="${r.id}">${t('project.deny')}</button>
            </div>
          </div>
        `).join('')}
      </div>
    `;
  }

  html += `<div class="project-hero">`;
  if (project.image_url) html += `<img class="feed-card-image" style="aspect-ratio:21/9;" src="${escapeHTML(project.image_url)}" alt="${escapeHTML(project.title)}" onerror="this.remove()">`;
  if (project.youtube_link) html += youtubeEmbedHTML(project.youtube_link);
  html += `
    <div>
      <p class="eyebrow">${catLabel[project.category] || 'Other'} · ${project.goal_type === 'profit' ? t('feed.type.profit') : t('feed.type.nonprofit')}</p>
      <h1>${escapeHTML(project.title)}</h1>
      <p class="project-desc">${escapeHTML(project.description || project.pitch)}</p>
      <p style="margin-top:10px;font-size:13.5px;color:var(--ink-soft);">${t('project.manager')} ${escapeHTML(project.owner_name)}</p>
      <div class="project-meta">
        <span class="stage-badge stage-${project.stage}">${t('project.stage_' + project.stage)}</span>
        ${isOwner ? `
          <select id="stageSelect" class="stage-select">
            ${['create','recruit','work','track','finish'].map(s => `<option value="${s}" ${project.stage === s ? 'selected' : ''}>${t('project.stage_' + s)}</option>`).join('')}
          </select>
        ` : ''}
      </div>
    </div>
  `;
  html += `</div>`;

  if (isOwner){
    html += `
      <details class="add-inline section-block">
        <summary>${t('project.edit_media')}</summary>
        <form id="mediaForm" class="auth-form">
          <label>${t('project.image_upload')}
            ${project.image_url ? `
              <div style="margin:6px 0;">
                <span class="credits-note">${t('learnmore.current_photo')}</span><br>
                <img src="${escapeHTML(project.image_url)}" alt="" style="max-width:200px;border-radius:8px;margin-top:4px;">
              </div>
            ` : ''}
            <input type="file" name="image_file" accept="image/*">
            ${project.image_url ? `
              <label style="display:flex;align-items:center;gap:6px;font-weight:400;margin-top:8px;">
                <input type="checkbox" name="remove_image" style="width:auto;"> ${t('learnmore.remove_image')}
              </label>
            ` : ''}
          </label>
          <label>${t('project.youtube_link')}<input type="url" name="youtube_link" value="${escapeHTML(project.youtube_link || '')}" placeholder="https://youtube.com/watch?v=..."></label>
          <button class="btn btn-ghost btn-small" type="submit">${t('common.save')}</button>
          <p class="form-msg" id="mediaMsg"></p>
        </form>
      </details>
    `;
  }

  html += `<div class="section-block"><h2>${t('project.team_heading')}</h2>`;
  html += `<div class="collab-list">` + (approvedCollabs.length
    ? approvedCollabs.map(c => `<span class="chip">${escapeHTML(c.profiles?.display_name || 'Collaborator')}</span>`).join('')
    : `<span class="credits-note">${t('project.no_collaborators')}</span>`) + `</div>`;

  if (!currentUser){
    html += `<p style="margin-top:14px;font-size:14px;"><a href="login.html">${t('nav.login')}</a> ${t('project.login_to_join')}</p>`;
  } else if (isOwner){
    // owner doesn't request to join their own project
  } else if (!myCollab){
    html += `<button class="btn btn-primary btn-small" id="requestJoinBtn" style="margin-top:14px;">${t('project.request_to_join')}</button>`;
  } else if (myCollab.status === 'pending'){
    html += `<p style="margin-top:14px;font-size:14px;color:var(--ink-soft);">${t('project.pending_approval')}</p>`;
  } else if (myCollab.status === 'approved'){
    html += `<p style="margin-top:14px;font-size:14px;">${t('project.youre_collaborator')} <button class="btn btn-ghost btn-small" id="leaveBtn">${t('project.leave')}</button></p>`;
  } else if (myCollab.status === 'denied'){
    html += `<p style="margin-top:14px;font-size:14px;color:var(--ink-soft);">${t('project.declined')} <button class="btn btn-ghost btn-small" id="reRequestBtn">${t('project.request_again')}</button></p>`;
  }
  html += `<p class="form-msg" id="teamMsg"></p>`;
  html += `</div>`;

  // --- Tabs ---
  html += `
    <div class="tab-bar">
      <button data-tab="feed" class="${activeTab === 'feed' ? 'active' : ''}">${t('project.tab_feed')}</button>
      <button data-tab="goals" class="${activeTab === 'goals' ? 'active' : ''}">${t('project.tab_goals')}</button>
      <button data-tab="requirements" class="${activeTab === 'requirements' ? 'active' : ''}">${t('project.tab_requirements')}</button>
      <button data-tab="tasks" class="${activeTab === 'tasks' ? 'active' : ''}">${t('project.tab_tasks')}</button>
      <button data-tab="polls" class="${activeTab === 'polls' ? 'active' : ''}">${t('project.tab_polls')}</button>
      <button data-tab="events" class="${activeTab === 'events' ? 'active' : ''}">${t('project.tab_events')}</button>
      <button data-tab="costs" class="${activeTab === 'costs' ? 'active' : ''}">${t('project.tab_costs')}</button>
      <button data-tab="schedule" class="${activeTab === 'schedule' ? 'active' : ''}">${t('project.tab_schedule')}</button>
      <button data-tab="wbs" class="${activeTab === 'wbs' ? 'active' : ''}">${t('project.tab_wbs')}</button>
      <a href="chat.html?id=${projectId}">${t('project.tab_chat')}</a>
    </div>
    <div class="tab-panel" data-panel="feed" ${activeTab !== 'feed' ? 'hidden' : ''}>${renderFeedPanel()}</div>
    <div class="tab-panel" data-panel="goals" ${activeTab !== 'goals' ? 'hidden' : ''}>${renderGoalsPanel(isOwner)}</div>
    <div class="tab-panel" data-panel="requirements" ${activeTab !== 'requirements' ? 'hidden' : ''}>${renderRequirementsPanel(isOwner)}</div>
    <div class="tab-panel" data-panel="tasks" ${activeTab !== 'tasks' ? 'hidden' : ''}>${renderTasksPanel(isOwner, approvedCollabs)}</div>
    <div class="tab-panel" data-panel="polls" ${activeTab !== 'polls' ? 'hidden' : ''}>${renderPollsPanel(isOwner)}</div>
    <div class="tab-panel" data-panel="events" ${activeTab !== 'events' ? 'hidden' : ''}>${renderEventsPanel(isOwner)}</div>
    <div class="tab-panel" data-panel="costs" ${activeTab !== 'costs' ? 'hidden' : ''}>${renderCostsPanel()}</div>
    <div class="tab-panel" data-panel="schedule" ${activeTab !== 'schedule' ? 'hidden' : ''}>${renderSchedulePanel()}</div>
    <div class="tab-panel" data-panel="wbs" ${activeTab !== 'wbs' ? 'hidden' : ''}>${renderWbsPanel()}</div>
  `;

  // --- Coordination ---
  html += `<div class="section-block"><h2>${t('project.coordination')}</h2>`;
  html += `<div class="card-row">`;
  if (project.whatsapp_link){
    html += `<a class="chip wa-link" href="${escapeHTML(project.whatsapp_link)}" target="_blank" rel="noopener noreferrer">${t('project.join_whatsapp')}</a>`;
  }
  if (project.drive_link){
    html += `<a class="chip wa-link" href="${escapeHTML(project.drive_link)}" target="_blank" rel="noopener noreferrer">${t('project.join_drive')}</a>`;
  }
  html += `</div>`;
  if (!project.whatsapp_link && !project.drive_link && !isOwner){
    html += `<p class="credits-note">${t('project.no_whatsapp')}</p>`;
  }
  if (isOwner){
    if (!project.whatsapp_link){
      html += `
        <details class="wa-add">
          <summary>${t('project.add_whatsapp')}</summary>
          <form class="wa-form" data-field="whatsapp_link">
            <input type="url" name="whatsapp_link" placeholder="https://chat.whatsapp.com/..." required>
            <button class="btn btn-ghost btn-small" type="submit">${t('common.save')}</button>
            <p class="form-msg" data-wa-msg></p>
          </form>
        </details>
      `;
    }
    if (!project.drive_link){
      html += `
        <details class="wa-add">
          <summary>${t('project.add_drive')}</summary>
          <form class="wa-form" data-field="drive_link">
            <input type="url" name="drive_link" placeholder="https://drive.google.com/drive/folders/..." required>
            <button class="btn btn-ghost btn-small" type="submit">${t('common.save')}</button>
            <p class="form-msg" data-wa-msg></p>
          </form>
        </details>
      `;
    }
  }
  html += `</div>`;

  content.innerHTML = html;
  wireEvents();
}

function renderLocked(myCollab){
  let html = `
    <div class="locked-card">
      <h2>${t('project.locked_title')}</h2>
      <p>${t('project.locked_desc')}</p>
  `;
  if (!currentUser){
    html += `
      <div class="hero-ctas" style="justify-content:center;">
        <a class="btn btn-primary" href="login.html">${t('nav.login')}</a>
        <a class="btn btn-ghost" href="signup.html">${t('nav.signup')}</a>
      </div>
    `;
  } else if (!myCollab){
    html += `<button class="btn btn-primary btn-small" id="requestJoinBtn">${t('project.request_to_join')}</button>`;
  } else if (myCollab.status === 'pending'){
    html += `<p style="color:var(--ink-soft);font-size:14px;">${t('project.pending_approval')}</p>`;
  } else if (myCollab.status === 'denied'){
    html += `
      <p style="color:var(--ink-soft);font-size:14px;">${t('project.declined')}</p>
      <button class="btn btn-ghost btn-small" id="reRequestBtn">${t('project.request_again')}</button>
    `;
  }
  html += `<p class="form-msg" id="teamMsg"></p></div>`;
  html += `<div style="text-align:center;margin-top:10px;"><a class="view-project-link" href="learn-more.html?id=${projectId}">${t('feed.learn_more')}</a></div>`;
  content.innerHTML = html;
  wireEvents();
}

function renderFeedPanel(){
  const isOwner = currentUser && currentUser.id === project.owner_id;
  const posts = feedPosts;
  const editingPost = editingFeedPostId ? posts.find(p => p.id === editingFeedPostId) : null;

  let html = `
    <details class="add-inline" ${editingFeedPostId ? 'open' : ''}>
      <summary>${editingFeedPostId ? t('common.edit') : t('project.feed_add_post')}</summary>
      <form id="feedPostForm" class="auth-form" data-editing="${editingFeedPostId || ''}">
        <label>${t('learnmore.post_text')}<textarea name="text" rows="3" maxlength="500">${editingPost ? escapeHTML(editingPost.text || '') : ''}</textarea></label>
        <label>${t('learnmore.post_image')}
          ${editingPost && editingPost.image_url ? `
            <div style="margin:6px 0;">
              <span class="credits-note">${t('learnmore.current_photo')}</span><br>
              <img src="${escapeHTML(editingPost.image_url)}" alt="" style="max-width:140px;border-radius:8px;margin-top:4px;">
            </div>
          ` : ''}
          <input type="file" name="image_file" accept="image/*">
          ${editingPost && editingPost.image_url ? `
            <label style="display:flex;align-items:center;gap:6px;font-weight:400;margin-top:8px;">
              <input type="checkbox" name="remove_image" style="width:auto;"> ${t('learnmore.remove_image')}
            </label>
          ` : ''}
        </label>
        <label>${t('learnmore.post_video')}<input type="url" name="youtube_link" value="${editingPost ? escapeHTML(editingPost.youtube_link || '') : ''}" placeholder="https://youtube.com/watch?v=..."></label>
        <button class="btn btn-primary btn-small" type="submit">${editingFeedPostId ? t('common.save') : t('common.add')}</button>
        <p class="form-msg" id="feedPostMsg"></p>
      </form>
    </details>
  `;

  if (posts.length === 0){
    html += `<p class="credits-note">${t('project.feed_no_posts')}</p>`;
  } else {
    posts.forEach(post => {
      const canEdit = currentUser && currentUser.id === post.user_id;
      const canDelete = canEdit || isOwner;
      html += `
        <article class="team-post">
          <div class="team-post-meta">${t('project.feed_posted_by')} ${escapeHTML(post.user_name)} · ${escapeHTML((post.created_at || '').slice(0, 10))}</div>
          ${post.image_url ? `<img src="${escapeHTML(post.image_url)}" alt="" loading="lazy" onerror="this.remove()">` : ''}
          ${post.youtube_link ? youtubeEmbedHTML(post.youtube_link) : ''}
          ${post.text ? `<p class="post-text">${escapeHTML(post.text)}</p>` : ''}
          ${(canEdit || canDelete) ? `
            <div class="item-actions">
              ${canEdit ? `<button class="icon-btn" data-edit-feedpost="${post.id}">${t('common.edit')}</button>` : ''}
              ${canDelete ? `<button class="icon-btn" data-delete-feedpost="${post.id}">${t('common.delete')}</button>` : ''}
            </div>
          ` : ''}
        </article>
      `;
    });
    if (hasMoreFeedPosts){
      html += `<button class="btn btn-ghost btn-small" id="loadMoreFeedBtn" type="button" style="margin-top:10px;">${t('project.feed_load_more')}</button>`;
    }
  }
  return html;
}

function renderPollsPanel(isOwner){
  const polls = (project.project_polls || []).slice().sort((a,b) => new Date(b.created_at) - new Date(a.created_at));
  let html = '';
  if (polls.length === 0) html += `<p class="credits-note">${t('project.no_polls')}</p>`;
  polls.forEach(poll => {

function ganttParseDate(s){
  const [y, m, d] = s.split('-').map(Number);
  return Date.UTC(y, m - 1, d);
}
function ganttFmtDate(ms){
  return new Date(ms).toISOString().slice(0, 10);
}
const GANTT_DAY_MS = 86400000;

function renderGanttChart(activities, links, zoom){
  if (activities.length === 0) return `<p class="credits-note">${t('project.no_activities')}</p>`;

  let minDate = ganttParseDate(activities[0].start_date);
  let maxDate = ganttParseDate(activities[0].end_date);
  activities.forEach(a => {
    minDate = Math.min(minDate, ganttParseDate(a.start_date));
    maxDate = Math.max(maxDate, ganttParseDate(a.end_date));
  });
  minDate -= GANTT_DAY_MS;
  maxDate += GANTT_DAY_MS;
  const totalDays = Math.round((maxDate - minDate) / GANTT_DAY_MS) + 1;

  const dayWidth = (totalDays > 60 ? 18 : totalDays > 30 ? 24 : 32) * zoom;
  const rowHeight = 42;
  const chartWidth = totalDays * dayWidth;
  const chartHeight = activities.length * rowHeight;
  const labelStep = totalDays > 90 ? 30 : totalDays > 30 ? 7 : 1;

  let ticksHtml = '';
  for (let i = 0; i < totalDays; i += labelStep){
    const label = new Date(minDate + i * GANTT_DAY_MS).toLocaleDateString(currentLang, { month: 'short', day: 'numeric' });
    ticksHtml += `<div class="gantt-tick" style="left:${i * dayWidth}px;">${escapeHTML(label)}</div>`;
  }

  const rowCenterY = {};
  let barsHtml = '';
  activities.forEach((a, idx) => {
    const start = ganttParseDate(a.start_date), end = ganttParseDate(a.end_date);
    const left = Math.round((start - minDate) / GANTT_DAY_MS) * dayWidth;
    const width = (Math.round((end - start) / GANTT_DAY_MS) + 1) * dayWidth;
    const top = idx * rowHeight;
    rowCenterY[a.id] = top + rowHeight / 2;
    barsHtml += `<div class="gantt-row" style="top:${top}px;width:${chartWidth}px;"></div>`;
    barsHtml += `
      <div class="gantt-bar" style="left:${left}px;top:${top + 7}px;width:${Math.max(width - 4, 12)}px;height:${rowHeight - 14}px;" title="${escapeHTML(a.title)}: ${escapeHTML(a.start_date)} → ${escapeHTML(a.end_date)}">
        <span class="gantt-bar-label">${escapeHTML(a.title)}</span>
      </div>
    `;
  });

  let connectorsHtml = '';
  links.forEach(l => {
    const pred = activities.find(a => a.id === l.predecessor_id);
    const succ = activities.find(a => a.id === l.successor_id);
    if (!pred || !succ) return;
    const predStart = ganttParseDate(pred.start_date), predEnd = ganttParseDate(pred.end_date);
    const succStart = ganttParseDate(succ.start_date), succEnd = ganttParseDate(succ.end_date);
    let x1, x2;
    if (l.link_type === 'SS'){
      x1 = Math.round((predStart - minDate) / GANTT_DAY_MS) * dayWidth;
      x2 = Math.round((succStart - minDate) / GANTT_DAY_MS) * dayWidth;
    } else if (l.link_type === 'FF'){
      x1 = (Math.round((predEnd - minDate) / GANTT_DAY_MS) + 1) * dayWidth;
      x2 = (Math.round((succEnd - minDate) / GANTT_DAY_MS) + 1) * dayWidth;
    } else { // FS
      x1 = (Math.round((predEnd - minDate) / GANTT_DAY_MS) + 1) * dayWidth;
      x2 = Math.round((succStart - minDate) / GANTT_DAY_MS) * dayWidth;
    }
    const y1 = rowCenterY[pred.id], y2 = rowCenterY[succ.id];
    const midX = x2 >= x1 ? x1 + 14 : x1 - 14;
    connectorsHtml += `<path d="M${x1},${y1} L${midX},${y1} L${midX},${y2} L${x2},${y2}" class="gantt-link" marker-end="url(#ganttArrow)"/>`;
  });

  return `
    <div class="gantt-scroll" id="ganttScroll">
      <div class="gantt-header" style="width:${chartWidth}px;">${ticksHtml}</div>
      <div class="gantt-body" style="width:${chartWidth}px;height:${chartHeight}px;">
        ${barsHtml}
        <svg class="gantt-svg" width="${chartWidth}" height="${chartHeight}">
          <defs>
            <marker id="ganttArrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
              <path d="M0,0 L6,3 L0,6 Z" fill="#8a97a3"/>
            </marker>
          </defs>
          ${connectorsHtml}
        </svg>
      </div>
    </div>
  `;
}

function layoutWbsTree(items, zoom){
  const nodeW = 168 * zoom, nodeH = 56 * zoom, gapX = 26 * zoom, gapY = 64 * zoom;
  const byId = new Map(items.map(i => [i.id, { ...i, children: [] }]));
  const roots = [];
  byId.forEach(node => {
    if (node.parent_id && byId.has(node.parent_id)) byId.get(node.parent_id).children.push(node);
    else roots.push(node);
  });
  const byCreated = (a, b) => new Date(a.created_at) - new Date(b.created_at);
  byId.forEach(node => node.children.sort(byCreated));
  roots.sort(byCreated);

  let nextX = 0;
  function place(node, depth){
    node.depth = depth;
    if (node.children.length === 0){
      node.x = nextX * (nodeW + gapX);
      nextX++;
    } else {
      node.children.forEach(c => place(c, depth + 1));
      const xs = node.children.map(c => c.x);
      node.x = (Math.min(...xs) + Math.max(...xs)) / 2;
    }
    node.y = depth * (nodeH + gapY);
  }
  roots.forEach(r => place(r, 0));

  const nodes = [...byId.values()];
  const width = nodes.length ? Math.max(...nodes.map(n => n.x)) + nodeW + 20 : 0;
  const height = nodes.length ? Math.max(...nodes.map(n => n.y)) + nodeH + 20 : 0;
  return { nodes, width, height, nodeW, nodeH };
}

function renderWbsDiagram(items, zoom){
  if (items.length === 0) return `<p class="credits-note">${t('project.wbs_no_items')}</p>`;

  const { nodes, width, height, nodeW, nodeH } = layoutWbsTree(items, zoom);
  const byId = new Map(nodes.map(n => [n.id, n]));

  let boxesHtml = '';
  let linksHtml = '';
  nodes.forEach(n => {
    boxesHtml += `
      <div class="wbs-node ${n.parent_id ? '' : 'is-root'}" style="left:${n.x}px;top:${n.y}px;width:${nodeW}px;height:${nodeH}px;" title="${escapeHTML(n.title)}${n.description ? ' — ' + escapeHTML(n.description) : ''}">
        <div class="wbs-node-title" style="font-size:${Math.round(12.5 * zoom)}px;">${escapeHTML(n.title)}</div>
        ${n.description ? `<div class="wbs-node-desc" style="font-size:${Math.round(10.5 * zoom)}px;">${escapeHTML(n.description)}</div>` : ''}
      </div>
    `;
    if (n.parent_id && byId.has(n.parent_id)){
      const p = byId.get(n.parent_id);
      const x1 = p.x + nodeW / 2, y1 = p.y + nodeH;
      const x2 = n.x + nodeW / 2, y2 = n.y;
      const midY = (y1 + y2) / 2;
      linksHtml += `<path d="M${x1},${y1} L${x1},${midY} L${x2},${midY} L${x2},${y2}" class="wbs-link"/>`;
    }
  });

  return `
    <div class="wbs-scroll" id="wbsScroll">
      <div class="wbs-canvas" style="width:${width}px;height:${height}px;">
        ${boxesHtml}
        <svg class="wbs-svg" width="${width}" height="${height}">${linksHtml}</svg>
      </div>
    </div>
  `;
}

function renderWbsPanel(){
  const items = project.project_wbs_items || [];

    html += `<p class="credits-note">${t('project.wbs_no_items')}</p>`;
  } else {
    sorted.forEach(item => {
      const depth = (() => {
        let d = 0, cur = item;
        while (cur.parent_id && byId.has(cur.parent_id)){ d++; cur = byId.get(cur.parent_id); }
        return d;
      })();
      html += `
        <div class="wbs-list-row" style="padding-left:${depth * 20}px;">
          <div>
            <div class="wbs-list-title">${depth > 0 ? '↳ ' : ''}${escapeHTML(item.title)}</div>

          </div>
          <div class="item-actions">

            <button class="icon-btn" data-delete-wbs="${item.id}">${t('common.delete')}</button>
          </div>
        </div>
      `;
    });
  }

  if (currentUser){
    const editingItem = editingWbsId ? byId.get(editingWbsId) : null;
    // Exclude the item itself and its descendants from the parent dropdown
    // when editing — picking one would create a cycle in the tree.
    const excluded = new Set(editingWbsId ? [editingWbsId] : []);
    if (editingWbsId){
      let added = true;
      while (added){
        added = false;
        items.forEach(i => { if (i.parent_id && excluded.has(i.parent_id) && !excluded.has(i.id)){ excluded.add(i.id); added = true; } });
      }
    }
    const parentOptions = items
      .filter(i => !excluded.has(i.id))
      .map(i => `<option value="${i.id}" ${editingItem && editingItem.parent_id === i.id ? 'selected' : ''}>${escapeHTML(i.title)}</option>`)
      .join('');
    html += `
      <details class="add-inline" ${editingWbsId ? 'open' : ''} style="margin-top:14px;">
        <summary>${editingWbsId ? t('common.edit') : t('project.wbs_add')}</summary>

async function recalcAndSaveSchedule(){
  const [{ data: activities }, { data: links }] = await Promise.all([
    supabaseClient.from('project_activities').select('*').eq('project_id', projectId),
    supabaseClient.from('project_activity_links').select('*').eq('project_id', projectId)
  ]);
  if (!activities || !links || links.length === 0) return;

  const byId = new Map(activities.map(a => [a.id, { start: ganttParseDate(a.start_date), end: ganttParseDate(a.end_date) }]));
  let changed = true, iterations = 0;
  while (changed && iterations < 100){
    changed = false;
    iterations++;
    for (const link of links){
      const pred = byId.get(link.predecessor_id);
      const succ = byId.get(link.successor_id);
      if (!pred || !succ) continue;
      const duration = succ.end - succ.start;
      if (link.link_type === 'FS' && succ.start < pred.end){
        succ.start = pred.end; succ.end = succ.start + duration; changed = true;
      } else if (link.link_type === 'SS' && succ.start < pred.start){
        succ.start = pred.start; succ.end = succ.start + duration; changed = true;
      } else if (link.link_type === 'FF' && succ.end < pred.end){
        succ.end = pred.end; succ.start = succ.end - duration; changed = true;
      }
    }
  }

  const updates = activities
    .map(a => ({ id: a.id, computed: byId.get(a.id), original: a }))
    .filter(({ computed, original }) => ganttFmtDate(computed.start) !== original.start_date || ganttFmtDate(computed.end) !== original.end_date);

  for (const u of updates){
    await supabaseClient.from('project_activities').update({
      start_date: ganttFmtDate(u.computed.start),
      end_date: ganttFmtDate(u.computed.end)
    }).eq('id', u.id);
  }
}

    const question = (fd.get('question') || '').trim();
    const options = (fd.get('options') || '').split('\n').map(s => s.trim()).filter(Boolean);
    if (options.length < 2){
      msg.textContent = t('project.poll_min_options_err');
      msg.className = 'form-msg error';
      return;
    }
    const userName = currentUser.user_metadata?.display_name || currentUser.email.split('@')[0];
    const { error } = await supabaseClient.from('project_polls').insert({ project_id: projectId, question, options, created_by: currentUser.id, created_by_name: userName });
    if (error){ msg.textContent = error.message; msg.className = 'form-msg error'; return; }
    loadProject();
  });

  content.querySelectorAll('.poll-option-row input[type="radio"]').forEach(radio => radio.addEventListener('change', async (e) => {
    if (!currentUser) return;
    const pollId = e.target.dataset.pollId;
    const optionIndex = Number(e.target.value);
    const { data: existing } = await supabaseClient.from('poll_votes').select('id').eq('poll_id', pollId).eq('user_id', currentUser.id).maybeSingle();
    if (existing){
      await supabaseClient.from('poll_votes').update({ option_index: optionIndex }).eq('id', existing.id);
    } else {
      await supabaseClient.from('poll_votes').insert({ poll_id: pollId, user_id: currentUser.id, option_index: optionIndex });
    }
    loadProject();
  }));

  content.querySelectorAll('[data-delete-poll]').forEach(btn => btn.addEventListener('click', async () => {
    await supabaseClient.from('project_polls').delete().eq('id', btn.dataset.deletePoll);
    loadProject();
  }));

  // --- Events ---
  const eventForm = document.getElementById('eventForm');
  if (eventForm) eventForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const msg = document.getElementById('eventMsg');
    msg.textContent = ''; msg.className = 'form-msg';
    const fd = new FormData(e.target);
    const title = (fd.get('title') || '').trim();
    const eventAtLocal = fd.get('event_at');
    const description = (fd.get('description') || '').trim();
    const editingId = e.target.dataset.editing;
    const payload = { title, description: description || null, event_at: eventAtLocal ? new Date(eventAtLocal).toISOString() : null };
    let error;
    if (editingId){
      ({ error } = await supabaseClient.from('project_events').update(payload).eq('id', editingId));
    } else {
      const userName = currentUser.user_metadata?.display_name || currentUser.email.split('@')[0];
      ({ error } = await supabaseClient.from('project_events').insert({ project_id: projectId, ...payload, created_by: currentUser.id, created_by_name: userName }));
    }
    if (error){ msg.textContent = error.message; msg.className = 'form-msg error'; return; }
    editingEventId = null;
    loadProject();
  });

  content.querySelectorAll('[data-edit-event]').forEach(btn => btn.addEventListener('click', () => {
    editingEventId = btn.dataset.editEvent;
    render();
  }));
  content.querySelectorAll('[data-delete-event]').forEach(btn => btn.addEventListener('click', async () => {
    await supabaseClient.from('project_events').delete().eq('id', btn.dataset.deleteEvent);
    loadProject();
  }));
  content.querySelectorAll('[data-rsvp-event]').forEach(btn => btn.addEventListener('click', async () => {
    if (!currentUser){ window.location.href = 'login.html'; return; }
    const eventId = btn.dataset.rsvpEvent;
    const status = btn.dataset.rsvpStatus;
    const { data: existing } = await supabaseClient.from('event_rsvps').select('id').eq('event_id', eventId).eq('user_id', currentUser.id).maybeSingle();
    if (existing){
      await supabaseClient.from('event_rsvps').update({ status }).eq('id', existing.id);
    } else {
      await supabaseClient.from('event_rsvps').insert({ event_id: eventId, user_id: currentUser.id, status });
    }
    loadProject();
  }));

  // --- Costs ---
  const costForm = document.getElementById('costForm');
  if (costForm) costForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const msg = document.getElementById('costMsg');
    msg.textContent = ''; msg.className = 'form-msg';
    const fd = new FormData(e.target);
    const description = (fd.get('description') || '').trim();
    const amount = Number(fd.get('amount'));
    const costDate = fd.get('cost_date') || null;
    const category = (fd.get('category') || '').trim() || null;
    const editingId = e.target.dataset.editing;
    let error;
    if (editingId){
      ({ error } = await supabaseClient.from('project_costs').update({ description, amount, cost_date: costDate, category }).eq('id', editingId));
    } else {
      const userName = currentUser.user_metadata?.display_name || currentUser.email.split('@')[0];
      ({ error } = await supabaseClient.from('project_costs').insert({
        project_id: projectId, description, amount, cost_date: costDate, category,
        added_by: currentUser.id, added_by_name: userName
      }));
    }
    if (error){ msg.textContent = error.message; msg.className = 'form-msg error'; return; }
    editingCostId = null;
    loadProject();
  });
  content.querySelectorAll('[data-edit-cost]').forEach(btn => btn.addEventListener('click', () => {
    editingCostId = btn.dataset.editCost;
    render();
  }));
  content.querySelectorAll('[data-delete-cost]').forEach(btn => btn.addEventListener('click', async () => {
    await supabaseClient.from('project_costs').delete().eq('id', btn.dataset.deleteCost);
    loadProject();
  }));

  const activityForm = document.getElementById('activityForm');
  if (activityForm) activityForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const msg = document.getElementById('activityMsg');
    msg.textContent = ''; msg.className = 'form-msg';
    const fd = new FormData(e.target);
    const title = (fd.get('title') || '').trim();
    const startDate = fd.get('start_date');
    const endDate = fd.get('end_date');
    if (endDate < startDate){ msg.textContent = t('project.activity_date_err'); msg.className = 'form-msg error'; return; }
    const editingId = e.target.dataset.editing;
    let error;
    if (editingId){
      ({ error } = await supabaseClient.from('project_activities').update({ title, start_date: startDate, end_date: endDate }).eq('id', editingId));
    } else {
      ({ error } = await supabaseClient.from('project_activities').insert({ project_id: projectId, title, start_date: startDate, end_date: endDate }));
    }
    if (error){ msg.textContent = error.message; msg.className = 'form-msg error'; return; }
    editingActivityId = null;
    await recalcAndSaveSchedule();
    loadProject();
  });
  content.querySelectorAll('[data-edit-activity]').forEach(btn => btn.addEventListener('click', () => {
    editingActivityId = btn.dataset.editActivity;
    render();
  }));
  content.querySelectorAll('[data-delete-activity]').forEach(btn => btn.addEventListener('click', async () => {
    await supabaseClient.from('project_activities').delete().eq('id', btn.dataset.deleteActivity);
    loadProject();
  }));

  const linkForm = document.getElementById('linkForm');
  if (linkForm) linkForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const msg = document.getElementById('linkMsg');
    msg.textContent = ''; msg.className = 'form-msg';
    const fd = new FormData(e.target);
    const predecessorId = fd.get('predecessor_id');
    const successorId = fd.get('successor_id');
    const linkType = fd.get('link_type');
    if (predecessorId === successorId){ msg.textContent = t('project.link_same_err'); msg.className = 'form-msg error'; return; }
    const { error } = await supabaseClient.from('project_activity_links').insert({
      project_id: projectId, predecessor_id: predecessorId, successor_id: successorId, link_type: linkType
    });
    if (error){ msg.textContent = error.message; msg.className = 'form-msg error'; return; }
    await recalcAndSaveSchedule();
    loadProject();
  });
  content.querySelectorAll('[data-delete-link]').forEach(btn => btn.addEventListener('click', async () => {
    await supabaseClient.from('project_activity_links').delete().eq('id', btn.dataset.deleteLink);
    loadProject();
  }));

  const wbsForm = document.getElementById('wbsForm');
  if (wbsForm) wbsForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const msg = document.getElementById('wbsMsg');
    msg.textContent = ''; msg.className = 'form-msg';
    const fd = new FormData(e.target);
    const title = (fd.get('title') || '').trim();
    const description = (fd.get('description') || '').trim();
    const parentId = fd.get('parent_id') || null;
    const editingId = e.target.dataset.editing;
    let error;
    if (editingId){
      ({ error } = await supabaseClient.from('project_wbs_items').update({ title, description: description || null, parent_id: parentId }).eq('id', editingId));
    } else {
      ({ error } = await supabaseClient.from('project_wbs_items').insert({ project_id: projectId, title, description: description || null, parent_id: parentId }));
    }
    if (error){ msg.textContent = error.message; msg.className = 'form-msg error'; return; }
    editingWbsId = null;
    loadProject();
  });
  content.querySelectorAll('[data-edit-wbs]').forEach(btn => btn.addEventListener('click', () => {
    editingWbsId = btn.dataset.editWbs;
    render();
  }));
  content.querySelectorAll('[data-delete-wbs]').forEach(btn => btn.addEventListener('click', async () => {
    if (!confirm(t('project.wbs_delete_confirm'))) return;
    await supabaseClient.from('project_wbs_items').delete().eq('id', btn.dataset.deleteWbs);
    loadProject();
  }));

  content.querySelectorAll('[data-zoom-in]').forEach(btn => btn.addEventListener('click', () => {
    if (btn.dataset.zoomIn === 'gantt') ganttZoom = clampZoom(ganttZoom + ZOOM_STEP);
    else wbsZoom = clampZoom(wbsZoom + ZOOM_STEP);
    render();
  }));
  content.querySelectorAll('[data-zoom-out]').forEach(btn => btn.addEventListener('click', () => {
    if (btn.dataset.zoomOut === 'gantt') ganttZoom = clampZoom(ganttZoom - ZOOM_STEP);
    else wbsZoom = clampZoom(wbsZoom - ZOOM_STEP);
    render();
  }));
  content.querySelectorAll('[data-zoom-reset]').forEach(btn => btn.addEventListener('click', () => {
    if (btn.dataset.zoomReset === 'gantt') ganttZoom = 1;
    else wbsZoom = 1;
    render();
  }));
  content.querySelectorAll('[data-export-png]').forEach(btn => btn.addEventListener('click', () => {
    const prefix = btn.dataset.exportPng;
    const projectTitle = (project.title || 'project').replace(/[^A-Za-z0-9_-]+/g, '_');
    if (prefix === 'gantt') exportChartToPng('ganttScroll', `${projectTitle}-gantt.png`);
    else exportChartToPng('wbsScroll', `${projectTitle}-wbs.png`);
  }));

}

async function init(){
  if (!supabaseClient){
    content.innerHTML = `<p class="form-msg error">${t('project.not_connected')}</p>`;
    return;
  }
  const { data: { session } } = await supabaseClient.auth.getSession();
  currentUser = session?.user || null;
  renderNav();
  await loadProject();
  supabaseClient.auth.onAuthStateChange(async (_event, session) => {
    currentUser = session?.user || null;
    renderNav();
    await loadProject();
  });
}
init();
</script>

</body>
</html>
