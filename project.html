<script>

function onLangChange(){

const params = new URLSearchParams(window.location.search);
const projectId = params.get('id');
const navAuth = document.getElementById('navAuth');
const content = document.getElementById('pageContent');

const TAB_GROUPS = {
  general: ['overview', 'feed', 'goals', 'tasks', 'polls', 'events', 'links', 'ai'],
  pm: ['schedule', 'wbs', 'team', 'costs', 'stakeholders', 'risks'],
  se: ['requirements', 'usecases', 'context', 'architecture', 'sequence', 'states', 'activity', 'traceability']
};
const VALID_TABS = Object.values(TAB_GROUPS).flat();
const ADMIN_EMAIL = 'aolbr_mail@yahoo.com.br';

function groupOfTab(tabId){
  return Object.keys(TAB_GROUPS).find(g => TAB_GROUPS[g].includes(tabId)) || 'general';
}

let currentUser = null;
let myCvUrl = null;
let project = null;
let activeTab = VALID_TABS.includes(params.get('tab')) ? params.get('tab') : 'overview';
let activeGroup = groupOfTab(activeTab);
// Remembers which sub-tab you were on last within each group, so switching
// groups and back doesn't always reset to the group's first tab.
let lastTabInGroup = { general: 'overview', pm: 'schedule', se: 'requirements', [activeGroup]: activeTab };
let editingGoalId = null;
let editingReqId = null;
let editingTaskId = null;
let editingEventId = null;
let editingFeedPostId = null;
let editingCostId = null;
let editingActivityId = null;
let editingWbsId = null;
let editingLinkId = null;
let editingStakeholderId = null;
let editingRiskId = null;
let ganttZoom = 1;
let wbsZoom = 1;
let ganttFitApplied = false;
let wbsFitApplied = false;

const ZOOM_MIN = 0.05, ZOOM_MAX = 2.5, ZOOM_FACTOR = 1.25;
const AUTO_FIT_MIN = 0.35;

function clampZoom(z){
  return Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, z));
}

function computeFitZoom(scrollElId, checkHeight){
  const el = document.getElementById(scrollElId);
  if (!el || !el.clientWidth || !el.scrollWidth) return null;
  let fit = el.clientWidth / el.scrollWidth;
  if (checkHeight && el.clientHeight && el.scrollHeight){
    fit = Math.min(fit, el.clientHeight / el.scrollHeight);
  }
  if (fit >= 1) return 1;
  return clampZoom(Math.max(AUTO_FIT_MIN, fit));
}

// Auto-shrink the Schedule/WBS charts to fit the very first time each is
// viewed, so they're readable without a manual zoom-out or horizontal
// scroll. Only fires once per tab per page load — later zoom changes are
// left entirely up to the user.
function maybeAutoFitActiveTab(){
  if (activeTab === 'schedule' && !ganttFitApplied){
    ganttFitApplied = true;
    const fit = computeFitZoom('ganttScroll', false);
    if (fit !== null && fit < ganttZoom){ ganttZoom = fit; render(); }
  } else if (activeTab === 'wbs' && !wbsFitApplied){
    wbsFitApplied = true;
    const fit = computeFitZoom('wbsScroll', true);
    if (fit !== null && fit < wbsZoom){ wbsZoom = fit; render(); }
  } else if (DIAGRAM_TYPES.includes(activeTab) && !diagramFitApplied[activeTab]){
    diagramFitApplied[activeTab] = true;
    const fit = computeFitZoom('diagramScroll-' + activeTab, true);
    if (fit !== null && fit < diagramZoom[activeTab]){ diagramZoom[activeTab] = fit; render(); }
  }
}

function renderChartToolbar(prefix, zoom, exportMode){
  const pngBtn = `<button type="button" class="btn btn-ghost btn-small" data-export-png="${prefix}">⤓ ${t('chart.export_png')}</button>`;
  const svgBtn = `<button type="button" class="btn btn-ghost btn-small" data-export-svg="${prefix}">⤓ ${t('chart.export_svg')}</button>`;
  const exportBtn = exportMode === 'svg' ? svgBtn : exportMode === 'both' ? pngBtn + svgBtn : pngBtn;
  return `
    <div class="chart-toolbar">
      <div class="zoom-group">
        <button type="button" class="zoom-btn" data-zoom-out="${prefix}" aria-label="${t('chart.zoom_out')}">−</button>
        <span class="zoom-level">${Math.round(zoom * 100)}%</span>
        <button type="button" class="zoom-btn" data-zoom-in="${prefix}" aria-label="${t('chart.zoom_in')}">+</button>
      </div>
      <button type="button" class="btn btn-ghost btn-small" data-zoom-reset="${prefix}">${t('chart.zoom_reset')}</button>
      <span class="spacer"></span>
      ${exportBtn}
    </div>
  `;
}

function renderNav(){
  if (currentUser){
    const name = currentUser.user_metadata?.display_name || currentUser.email.split('@')[0];
    navAuth.innerHTML = `
      <a class="btn btn-ghost btn-small" href="dashboard.html">${t('nav.dashboard')}</a>
      <span class="user-chip"><span class="avatar">${initials(name)}</span>${escapeHTML(name)}</span>
      <a class="btn btn-ghost btn-small" href="feed.html">${t('nav.feed')}</a>
    `;
    initNotifications(currentUser);
  } else {
    navAuth.innerHTML = `
      <a class="btn btn-ghost" href="login.html">${t('nav.login')}</a>
      <a class="btn btn-primary" href="signup.html">${t('nav.signup')}</a>
    `;
    teardownNotifications();
  }
}

const YOUTUBE_LINK_PATTERN = /^https:\/\/(www\.)?(youtube\.com|youtu\.be)\//;
const MAX_IMAGE_BYTES = 8 * 1024 * 1024; // 8MB

async function uploadFeedImage(file){
  file = await compressImage(file);
  const extMatch = /\.([a-zA-Z0-9]+)$/.exec(file.name || '');
  const ext = (extMatch ? extMatch[1] : 'jpg').toLowerCase().replace(/[^a-z0-9]/g, '') || 'jpg';
  const path = `${projectId}/feed-${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${ext}`;
  const { error } = await supabaseClient.storage.from('project-post-images').upload(path, file, { contentType: file.type });
  if (error) throw error;
  const { data } = supabaseClient.storage.from('project-post-images').getPublicUrl(path);
  return data.publicUrl;
}

async function uploadCoverImage(file){
  file = await compressImage(file);
  const extMatch = /\.([a-zA-Z0-9]+)$/.exec(file.name || '');
  const ext = (extMatch ? extMatch[1] : 'jpg').toLowerCase().replace(/[^a-z0-9]/g, '') || 'jpg';
  const path = `${projectId}/cover-${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${ext}`;
  const { error } = await supabaseClient.storage.from('project-post-images').upload(path, file, { contentType: file.type });
  if (error) throw error;
  const { data } = supabaseClient.storage.from('project-post-images').getPublicUrl(path);
  return data.publicUrl;
}

async function loadProject(){
  if (!projectId){
    content.innerHTML = `<p class="form-msg error">${t('project.not_specified')}</p>`;
    return;
  }
  if (!supabaseClient){
    content.innerHTML = `<p class="form-msg error">${t('project.not_connected')}</p>`;
    return;
  }
  const { data, error } = await supabaseClient
    .from('projects')
    .select(`*,
      project_goals(*),
      project_requirements(*),
      project_collaborators(id, user_id, status, cv_url, profiles(display_name, social_platform, social_url)),
      project_supporters(user_id, amount, confirmed),
      project_tasks(*, task_assignees(user_id, profiles(display_name))),
      project_polls(*, poll_votes(user_id, option_index)),
      project_events(*, event_rsvps(user_id, status)),
      project_costs(*),
      project_activities(*),
      project_activity_links(*),
      project_wbs_items(*),
      project_links(*),
      project_ai_messages(*),
      project_diagrams(type, data),
      project_stakeholders(*),
      project_risks(*, project_risk_mitigations(*))`)
    .eq('id', projectId)
    .single();
  if (error || !data){
    content.innerHTML = `<p class="form-msg error">${t('project.load_error')} ${escapeHTML(error?.message || 'not found')}</p>`;
    return;
  }
  project = data;
  const { data: verRows, error: verErr } = await supabaseClient.from('project_requirement_verifications')
    .select('*').eq('project_id', projectId)
    .order('performed_on', { ascending: false }).order('created_at', { ascending: false });
  // Newest first (also enforced here so the 'latest' record never depends on the query's ordering).
  project.verifications = verErr ? [] : (verRows || []).slice().sort((x, y) => String(y.performed_on).localeCompare(String(x.performed_on)) || String(y.created_at).localeCompare(String(x.created_at)));
  await loadFeedPosts();
  if (currentUser){
    const { data: profileRow } = await supabaseClient.from('profiles').select('cv_url').eq('id', currentUser.id).single();
    myCvUrl = profileRow?.cv_url || null;
  } else {
    myCvUrl = null;
  }
  render();
  maybeAutoFitActiveTab();
}

const FEED_PAGE_SIZE = 15;
let feedPosts = [];
let hasMoreFeedPosts = false;

async function loadFeedPosts(loadMore){
  let q = supabaseClient.from('project_feed_posts').select('*').eq('project_id', projectId)
    .order('created_at', { ascending: false }).limit(FEED_PAGE_SIZE);
  if (loadMore && feedPosts.length) q = q.lt('created_at', feedPosts[feedPosts.length - 1].created_at);
  const { data: page } = await q;
  hasMoreFeedPosts = (page || []).length === FEED_PAGE_SIZE;
  feedPosts = loadMore ? feedPosts.concat(page || []) : (page || []);
}

function render(){
  const isOwner = currentUser && currentUser.id === project.owner_id;
  const isSiteAdminViewer = currentUser && (currentUser.email || '').toLowerCase() === ADMIN_EMAIL.toLowerCase();
  const myCollab = (project.project_collaborators || []).find(c => c.user_id === currentUser?.id);
  const approvedCollabs = (project.project_collaborators || []).filter(c => c.status === 'approved');
  const pendingRequests = (project.project_collaborators || []).filter(c => c.status === 'pending');
  const isTeamMember = isOwner || (myCollab && myCollab.status === 'approved');
  const hasAccess = isTeamMember || isSiteAdminViewer;

  if (!hasAccess){
    renderLocked(myCollab);
    return;
  }

  let html = '';

  if (isSiteAdminViewer && !isTeamMember){
    html += `
      <div class="notify-banner" style="background:#FBEAEA;border-color:#F0C6C3;">

  if (isOwner && pendingRequests.length > 0){
    html += `

        ${pendingRequests.map(r => `

            <span class="req-name">${escapeHTML(r.profiles?.display_name || 'Someone')}${r.cv_url ? ` · <a href="${escapeHTML(r.cv_url)}" target="_blank" rel="noopener noreferrer">${t('project.applicant_cv')}</a>` : ''}</span>
            <div class="notify-actions">
              <button class="btn btn-ghost btn-small" data-approve="${r.id}">${t('project.approve')}</button>
              <button class="btn btn-ghost btn-small" data-deny="${r.id}">${t('project.deny')}</button>
            </div>
          </div>
        `).join('')}
      </div>
    `;
  }

  html += `<div class="project-hero">`;
  if (project.image_url) html += `<img class="feed-card-image" style="aspect-ratio:21/9;" src="${escapeHTML(project.image_url)}" alt="${escapeHTML(project.title)}" onerror="this.remove()">`;
  if (project.youtube_link) html += youtubeEmbedHTML(project.youtube_link);
  html += `
    <div>
      <p class="eyebrow">${catLabel[project.category] || 'Other'} · ${project.goal_type === 'profit' ? t('feed.type.profit') : t('feed.type.nonprofit')}</p>
      <h1>${escapeHTML(project.title)}</h1>
      <p class="project-desc">${escapeHTML(project.description || project.pitch)}</p>
      <p style="margin-top:10px;font-size:13.5px;color:var(--ink-soft);">${t('project.manager')} ${escapeHTML(project.owner_name)}</p>
      ${(project.skills || []).length > 0 ? `<div class="card-row" style="margin-top:10px;">${project.skills.map(s => `<span class="chip skill-chip">${t('feed.skill.' + s)}</span>`).join('')}</div>` : ''}
      <div class="project-meta">
        <span class="stage-badge stage-${project.stage}">${t('project.stage_' + project.stage)}</span>
        ${isOwner ? `
          <select id="stageSelect" class="stage-select">
            ${['create','recruit','work','track','finish'].map(s => `<option value="${s}" ${project.stage === s ? 'selected' : ''}>${t('project.stage_' + s)}</option>`).join('')}
          </select>
        ` : ''}
        ${project.visibility === 'private' ? `<span class="chip">${t('project.visibility_private')}</span>` : ''}
        ${isSiteAdminViewer ? `<button class="icon-btn" id="adminDeleteProjectBtn" style="margin-left:auto;">🗑 ${t('project.admin_delete_project')}</button>` : ''}
      </div>
    </div>
  `;
  html += `</div>`;

  if (isOwner){
    html += `
      <details class="add-inline section-block">
        <summary>${t('project.edit_media')}</summary>
        <form id="mediaForm" class="auth-form">
          <label>${t('project.image_upload')}
            ${project.image_url ? `
              <div style="margin:6px 0;">
                <span class="credits-note">${t('learnmore.current_photo')}</span><br>
                <img src="${escapeHTML(project.image_url)}" alt="" style="max-width:200px;border-radius:8px;margin-top:4px;">
              </div>
            ` : ''}
            <input type="file" name="image_file" accept="image/*">
            ${project.image_url ? `
              <label style="display:flex;align-items:center;gap:6px;font-weight:400;margin-top:8px;">
                <input type="checkbox" name="remove_image" style="width:auto;"> ${t('learnmore.remove_image')}
              </label>
            ` : ''}
          </label>
          <label>${t('project.youtube_link')}<input type="url" name="youtube_link" value="${escapeHTML(project.youtube_link || '')}" placeholder="https://youtube.com/watch?v=..."></label>
          <label>${t('feed.skills_label')}
            <span class="skills-check-grid">
              ${SKILL_OPTIONS.map(s => `<label class="skill-check"><input type="checkbox" name="skills" value="${s}" ${(project.skills || []).includes(s) ? 'checked' : ''}> ${t('feed.skill.' + s)}</label>`).join('')}
            </span>
          </label>
          <label>${t('project.visibility_label')}
            <select name="visibility">
              <option value="public" ${project.visibility !== 'private' ? 'selected' : ''}>${t('project.visibility_public')}</option>
              <option value="private" ${project.visibility === 'private' ? 'selected' : ''}>${t('project.visibility_private')}</option>
            </select>
          </label>
          <p class="credits-note">${t('project.visibility_note')}</p>
          <button class="btn btn-ghost btn-small" type="submit">${t('common.save')}</button>
          <p class="form-msg" id="mediaMsg"></p>
        </form>
      </details>
    `;
  }

  // --- Tabs: 3 top-level groups, each with its own row of sub-tabs ---
  html += `
    <div class="tab-group-bar">
      <button data-group="general" class="${activeGroup === 'general' ? 'active' : ''}">${t('project.group_general')}</button>
      <button data-group="pm" class="${activeGroup === 'pm' ? 'active' : ''}">${t('project.group_pm')}</button>
      <button data-group="se" class="${activeGroup === 'se' ? 'active' : ''}">${t('project.group_se')}</button>
      <a href="chat.html?id=${projectId}">${t('project.tab_chat')}</a>
    </div>
    <div class="tab-bar">
      ${TAB_GROUPS[activeGroup].map(tabId => `<button data-tab="${tabId}" class="${activeTab === tabId ? 'active' : ''}">${t('project.tab_' + tabId)}</button>`).join('')}
    </div>
    <div class="tab-panel" data-panel="overview" ${activeTab !== 'overview' ? 'hidden' : ''}>${renderOverviewPanel(isOwner)}</div>
    <div class="tab-panel" data-panel="feed" ${activeTab !== 'feed' ? 'hidden' : ''}>${renderFeedPanel()}</div>
    <div class="tab-panel" data-panel="goals" ${activeTab !== 'goals' ? 'hidden' : ''}>${renderGoalsPanel(isOwner)}</div>
    <div class="tab-panel" data-panel="requirements" ${activeTab !== 'requirements' ? 'hidden' : ''}>${renderRequirementsPanel(isOwner)}</div>
    <div class="tab-panel" data-panel="tasks" ${activeTab !== 'tasks' ? 'hidden' : ''}>${renderTasksPanel(isOwner, approvedCollabs)}</div>
    <div class="tab-panel" data-panel="polls" ${activeTab !== 'polls' ? 'hidden' : ''}>${renderPollsPanel(isOwner)}</div>
    <div class="tab-panel" data-panel="events" ${activeTab !== 'events' ? 'hidden' : ''}>${renderEventsPanel(isOwner)}</div>
    <div class="tab-panel" data-panel="costs" ${activeTab !== 'costs' ? 'hidden' : ''}>${renderCostsPanel()}</div>
    <div class="tab-panel" data-panel="schedule" ${activeTab !== 'schedule' ? 'hidden' : ''}>${renderSchedulePanel()}</div>
    <div class="tab-panel" data-panel="wbs" ${activeTab !== 'wbs' ? 'hidden' : ''}>${renderWbsPanel()}</div>
    <div class="tab-panel" data-panel="team" ${activeTab !== 'team' ? 'hidden' : ''}>${renderTeamPanel(isOwner, approvedCollabs, pendingRequests, myCollab)}</div>
    <div class="tab-panel" data-panel="stakeholders" ${activeTab !== 'stakeholders' ? 'hidden' : ''}>${renderStakeholdersPanel()}</div>
    <div class="tab-panel" data-panel="risks" ${activeTab !== 'risks' ? 'hidden' : ''}>${renderRisksPanel()}</div>
    <div class="tab-panel" data-panel="links" ${activeTab !== 'links' ? 'hidden' : ''}>${renderLinksPanel()}</div>
    <div class="tab-panel" data-panel="ai" ${activeTab !== 'ai' ? 'hidden' : ''}>${renderAiPanel()}</div>
    ${DIAGRAM_TYPES.map(ty => `<div class="tab-panel" data-panel="${ty}" ${activeTab !== ty ? 'hidden' : ''}>${renderDiagramPanel(ty)}</div>`).join('')}
    <div class="tab-panel" data-panel="traceability" ${activeTab !== 'traceability' ? 'hidden' : ''}>${renderTraceabilityPanel(isOwner)}</div>
  `;

  content.innerHTML = html;
  wireEvents();
}

function renderLocked(myCollab){
  let html = `
    <div class="locked-card">
      <h2>${t('project.locked_title')}</h2>
      <p>${t('project.locked_desc')}</p>
  `;
  if (!currentUser){
    html += `
      <div class="hero-ctas" style="justify-content:center;">
        <a class="btn btn-primary" href="login.html">${t('nav.login')}</a>
        <a class="btn btn-ghost" href="signup.html">${t('nav.signup')}</a>
      </div>
    `;
  } else if (!myCollab){
    html += `<button class="btn btn-primary btn-small" id="requestJoinBtn">${t('project.request_to_join')}</button>`;
    html += `<p class="credits-note" style="margin-top:8px;">${myCvUrl ? t('project.cv_included_note') : `<a href="dashboard.html">${t('project.cv_missing_note')}</a>`}</p>`;
  } else if (myCollab.status === 'pending'){
    html += `<p style="color:var(--ink-soft);font-size:14px;">${t('project.pending_approval')}</p>`;
  } else if (myCollab.status === 'denied'){
    html += `
      <p style="color:var(--ink-soft);font-size:14px;">${t('project.declined')}</p>
      <button class="btn btn-ghost btn-small" id="reRequestBtn">${t('project.request_again')}</button>
    `;
  }
  html += `<p class="form-msg" id="teamMsg"></p></div>`;
  html += `<div style="text-align:center;margin-top:10px;"><a class="view-project-link" href="learn-more.html?id=${projectId}">${t('feed.learn_more')}</a></div>`;
  content.innerHTML = html;
  wireEvents();
}

// Landing tab for the team-only project page: a compact dashboard so the
// team doesn't have to click into Goals/Costs/Feed just to see where
// things stand. Pulls entirely from data loadProject() already fetched —
// no extra queries.
function renderOverviewPanel(isOwner){
  const goals = project.project_goals || [];
  const totalGoals = goals.length;
  const completedGoals = goals.filter(g => g.progress >= 100).length;
  const avgProgress = totalGoals ? Math.round(goals.reduce((sum, g) => sum + (g.progress || 0), 0) / totalGoals) : 0;

  const supporters = project.project_supporters || [];
  const totalRaised = supporters.filter(s => s.confirmed && s.amount != null).reduce((sum, s) => sum + (Number(s.amount) || 0), 0);
  const totalSpent = (project.project_costs || []).reduce((sum, c) => sum + (Number(c.amount) || 0), 0);
  const fundingTarget = Number(project.funding_target) || 0;
  const fundingPct = fundingTarget > 0 ? Math.min(100, Math.round((totalRaised / fundingTarget) * 100)) : null;

  const latestPosts = feedPosts.slice(0, 3);

  let html = `
    <div class="section-block">
      <h2>${t('project.overview_goals_heading')}</h2>
      <div class="stat-grid" style="margin-bottom:14px;">
        <div class="stat-card"><div class="stat-value">${completedGoals}/${totalGoals}</div><div class="stat-label">${t('project.overview_goals_completed')}</div></div>

// ---------------------------------------------------------------------------
// Shared 1-5 x 1-5 scatter chart used by both the stakeholder power/interest
// matrix and the risk likelihood/severity matrix. Purely derived from
// whatever rows are passed in — there's no chart state to keep in sync, so
// it "updates automatically" simply by being rebuilt on every render().
// ---------------------------------------------------------------------------
function renderScatterMatrix(points, opts){
  const axisMax = opts.axisMax || 5;
  const size = 320;
  const pad = 30;
  const plotSize = size - pad;
  const cell = plotSize / axisMax;

  let cellsHtml = '';
  for (let xi = 1; xi <= axisMax; xi++){
    for (let yi = 1; yi <= axisMax; yi++){
      const x0 = pad + (xi - 1) * cell;
      const y0 = plotSize - yi * cell;
      cellsHtml += `<rect x="${x0}" y="${y0}" width="${cell}" height="${cell}" fill="${opts.cellColor(xi, yi)}"></rect>`;
    }
  }

  let ticksHtml = '';
  for (let i = 1; i <= axisMax; i++){
    const tx = pad + (i - 0.5) * cell;
    const ty = plotSize - (i - 0.5) * cell;
    ticksHtml += `<text x="${tx}" y="${plotSize + 14}" text-anchor="middle" class="matrix-tick">${i}</text>`;
    ticksHtml += `<text x="${pad - 8}" y="${ty + 3}" text-anchor="end" class="matrix-tick">${i}</text>`;
  }

  // Points sharing the same (x,y) cell are spread in a small ring instead
  // of stacking exactly on top of each other, so no data point is hidden.
  const groups = new Map();
  points.forEach(p => {
    const key = p.x + ',' + p.y;
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(p);
  });
  let dotsHtml = '';
  groups.forEach(group => {
    const gx = group[0].x, gy = group[0].y;
    const cx0 = pad + (gx - 0.5) * cell;
    const cy0 = plotSize - (gy - 0.5) * cell;
    const n = group.length;
    group.forEach((p, i) => {
      let dx = 0, dy = 0;
      if (n > 1){
        const angle = (2 * Math.PI * i) / n - Math.PI / 2;
        const r = Math.min(cell * 0.26, 13);
        dx = Math.cos(angle) * r; dy = Math.sin(angle) * r;
      }
      const cx = (cx0 + dx).toFixed(1), cy = (cy0 + dy).toFixed(1);
      const label = p.label.length > 14 ? p.label.slice(0, 13) + '…' : p.label;
      dotsHtml += `
        <circle cx="${cx}" cy="${cy}" r="7" class="matrix-dot"></circle>
        <text x="${cx}" y="${(cy - 11)}" text-anchor="middle" class="matrix-dot-label">${escapeHTML(label)}</text>
      `;
    });
  });

  let midLinesHtml = '';
  if (opts.midLines){
    const mid = plotSize / 2;
    midLinesHtml = `
      <line x1="${pad + mid}" y1="0" x2="${pad + mid}" y2="${plotSize}" class="matrix-mid-line"></line>
      <line x1="${pad}" y1="${mid}" x2="${size}" y2="${mid}" class="matrix-mid-line"></line>
    `;
  }

  let quadrantHtml = '';
  (opts.quadrantLabels || []).forEach(q => {
    const qx = pad + q.xFrac * plotSize;
    const qy = plotSize - q.yFrac * plotSize;
    quadrantHtml += `<text x="${qx}" y="${qy}" text-anchor="middle" class="matrix-quadrant-label">${escapeHTML(q.text)}</text>`;
  });

  return `
    <div class="matrix-wrap">
      <div class="matrix-caption">↑ ${escapeHTML(opts.yAxisLabel)} &nbsp;·&nbsp; ${escapeHTML(opts.xAxisLabel)} →</div>
      <svg viewBox="0 0 ${size} ${plotSize + 26}" class="matrix-svg">
        ${cellsHtml}
        ${midLinesHtml}
        ${quadrantHtml}
        ${dotsHtml}
        ${ticksHtml}
      </svg>
    </div>
  `;
}

const STAKEHOLDER_QUADRANTS = [
  { textKey: 'project.matrix_manage_closely', xFrac: 0.75, yFrac: 0.88 },
  { textKey: 'project.matrix_keep_satisfied', xFrac: 0.25, yFrac: 0.88 },
  { textKey: 'project.matrix_keep_informed', xFrac: 0.75, yFrac: 0.12 },
  { textKey: 'project.matrix_monitor', xFrac: 0.25, yFrac: 0.12 }
];
function stakeholderCellColor(interest, power){
  const hiPower = power >= 3, hiInterest = interest >= 3;
  if (hiPower && hiInterest) return '#FFF1E7';
  if (hiPower && !hiInterest) return '#EAF3FB';
  if (!hiPower && hiInterest) return '#EAF7EE';
  return '#EEF4F8';
}

function riskEvBefore(r){ return (Number(r.probability_pct) / 100) * Number(r.impact_cost); }
function riskEvAfter(r){
  const prob = r.residual_probability_pct != null ? Number(r.residual_probability_pct) : Number(r.probability_pct);
  const impact = r.residual_impact_cost != null ? Number(r.residual_impact_cost) : Number(r.impact_cost);
  return (prob / 100) * impact;
}
function riskWorstBefore(r){ return Number(r.impact_cost); }
function riskWorstAfter(r){ return r.residual_impact_cost != null ? Number(r.residual_impact_cost) : Number(r.impact_cost); }
function riskBand(score){ return score >= 15 ? 'high' : score >= 7 ? 'medium' : 'low'; }
function riskCellColor(likelihood, severity){
  const band = riskBand(likelihood * severity);
  return band === 'high' ? '#FBEAEA' : band === 'medium' ? '#FFF1E7' : '#EAF7EE';
}
// impact_cost holds either a dollar amount or a day count depending on
// impact_unit — dollars and days can never be summed together, so every
// place that totals risk exposure has to group by unit first.
function formatRiskImpact(value, unit){
  return unit === 'time' ? `${Number(value).toFixed(1)} ${t('project.risk_days_suffix')}` : `$${Number(value).toFixed(2)}`;
}
function riskQuantStatsHTML(risks, showAfter){
  const totalEvBefore = risks.reduce((sum, r) => sum + riskEvBefore(r), 0);
  const totalWorstBefore = risks.reduce((sum, r) => sum + riskWorstBefore(r), 0);
  const unit = risks[0].impact_unit;
  let html = `
    <div class="stat-card"><div class="stat-value">${formatRiskImpact(totalEvBefore, unit)}</div><div class="stat-label">${t(showAfter ? 'project.risk_ev_before' : 'project.risk_ev_heading_simple')}</div></div>
  `;
  if (showAfter){
    const totalEvAfter = risks.reduce((sum, r) => sum + riskEvAfter(r), 0);
    html += `<div class="stat-card"><div class="stat-value">${formatRiskImpact(totalEvAfter, unit)}</div><div class="stat-label">${t('project.risk_ev_after')}</div></div>`;
  }
  html += `<div class="stat-card"><div class="stat-value">${formatRiskImpact(totalWorstBefore, unit)}</div><div class="stat-label">${t(showAfter ? 'project.risk_worst_before' : 'project.risk_worst_heading_simple')}</div></div>`;
  if (showAfter){
    const totalWorstAfter = risks.reduce((sum, r) => sum + riskWorstAfter(r), 0);
    html += `<div class="stat-card"><div class="stat-value">${formatRiskImpact(totalWorstAfter, unit)}</div><div class="stat-label">${t('project.risk_worst_after')}</div></div>`;
  }
  return html;
}

function ganttParseDate(s){
  const [y, m, d] = s.split('-').map(Number);
  return Date.UTC(y, m - 1, d);
}
function ganttFmtDate(ms){
  return new Date(ms).toISOString().slice(0, 10);
}
const GANTT_DAY_MS = 86400000;

// Dates are stored as UTC midnights, so every label must be formatted with
// timeZone:'UTC' — otherwise users west of Greenwich (e.g. Brazil) see
// every date shifted back by one day.
function ganttFmt(ms, opts){
  return new Date(ms).toLocaleDateString(currentLang, Object.assign({ timeZone: 'UTC' }, opts));
}

// Two-tier date header shared by the on-screen chart and the export:
// a month band on top and day numbers underneath. The day step widens
// (1, 2, 7, 14, 30 days) until labels are at least minTickPx apart, so
// ticks never overlap no matter the zoom or project length.
function ganttTickPlan(minDate, totalDays, dayWidth, minTickPx){
  const months = [];
  let i = 0;
  while (i < totalDays){
    const startMs = minDate + i * GANTT_DAY_MS;
    const d = new Date(startMs);
    const nextMonthMs = Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 1, 1);
    const days = Math.min(totalDays - i, Math.round((nextMonthMs - startMs) / GANTT_DAY_MS));
    const w = days * dayWidth;
    const showYear = d.getUTCMonth() === 0 || months.length === 0;
    let label = '';
    if (w >= 62) label = ganttFmt(startMs, showYear ? { month: 'short', year: 'numeric' } : { month: 'short' });
    else if (w >= 34) label = ganttFmt(startMs, { month: 'short' });
    else if (w >= 14) label = ganttFmt(startMs, { month: 'short' }).charAt(0).toUpperCase();
    months.push({ x: i * dayWidth, w, label });
    i += days;
  }

  const step = [1, 2, 7, 14, 30].find(s => s * dayWidth >= minTickPx) || 30;
  const ticks = [];
  for (let idx = 0; idx < totalDays; idx++){
    const ms = minDate + idx * GANTT_DAY_MS;
    const dt = new Date(ms);
    let on;
    if (step <= 2) on = idx % step === 0;
    else if (step === 30) on = dt.getUTCDate() === 1;
    else on = dt.getUTCDay() === 1 && Math.floor((ms - Date.UTC(1970, 0, 5)) / (7 * GANTT_DAY_MS)) % (step / 7) === 0;
    if (on) ticks.push({ x: idx * dayWidth, label: String(dt.getUTCDate()) });
  }
  return { months, ticks };
}

function ganttConnectorPath(l, byId, minDate, dayWidth, rowCenterY, elbow){
  const pred = byId.get(l.predecessor_id), succ = byId.get(l.successor_id);
  if (!pred || !succ) return null;
  const col = (ms) => Math.round((ms - minDate) / GANTT_DAY_MS);
  let x1, x2;
  if (l.link_type === 'SS'){
    x1 = col(ganttParseDate(pred.start_date)) * dayWidth;
    x2 = col(ganttParseDate(succ.start_date)) * dayWidth;
  } else if (l.link_type === 'FF'){
    x1 = (col(ganttParseDate(pred.end_date)) + 1) * dayWidth;
    x2 = (col(ganttParseDate(succ.end_date)) + 1) * dayWidth;
  } else { // FS
    x1 = (col(ganttParseDate(pred.end_date)) + 1) * dayWidth;
    x2 = col(ganttParseDate(succ.start_date)) * dayWidth;
  }
  const y1 = rowCenterY[pred.id], y2 = rowCenterY[succ.id];
  const midX = x2 >= x1 ? x1 + elbow : x1 - elbow;
  return `M${x1},${y1} L${midX},${y1} L${midX},${y2} L${x2},${y2}`;
}

function renderGanttChart(activities, links, zoom, wbsById){
  if (activities.length === 0) return `<p class="credits-note">${t('project.no_activities')}</p>`;
  const wbsLabels = wbsLabelMap(project.project_wbs_items || []);

  let minDate = ganttParseDate(activities[0].start_date);
  let maxDate = ganttParseDate(activities[0].end_date);
  activities.forEach(a => {
    minDate = Math.min(minDate, ganttParseDate(a.start_date));
    maxDate = Math.max(maxDate, ganttParseDate(a.end_date));
  });
  minDate -= GANTT_DAY_MS;
  maxDate += GANTT_DAY_MS;
  const totalDays = Math.round((maxDate - minDate) / GANTT_DAY_MS) + 1;

  const dayWidth = (totalDays > 60 ? 18 : totalDays > 30 ? 24 : 32) * zoom;
  const rowHeight = 42;
  const chartWidth = totalDays * dayWidth;
  const chartHeight = activities.length * rowHeight;

  const plan = ganttTickPlan(minDate, totalDays, dayWidth, 30);
  const monthsHtml = plan.months.map(m => `<div class="gantt-month" style="left:${m.x}px;width:${m.w}px;">${escapeHTML(m.label)}</div>`).join('');
  const ticksHtml = plan.ticks.map(tk => `<div class="gantt-tick" style="left:${tk.x}px;">${escapeHTML(tk.label)}</div>`).join('');

  const rowCenterY = {};
  let barsHtml = '';
  activities.forEach((a, idx) => {
    const start = ganttParseDate(a.start_date), end = ganttParseDate(a.end_date);
    const left = Math.round((start - minDate) / GANTT_DAY_MS) * dayWidth;
    const width = (Math.round((end - start) / GANTT_DAY_MS) + 1) * dayWidth;
    const top = idx * rowHeight;
    rowCenterY[a.id] = top + rowHeight / 2;
    barsHtml += `<div class="gantt-row" style="top:${top}px;width:${chartWidth}px;"></div>`;
    const wbsItem = a.wbs_item_id && wbsById ? wbsById.get(a.wbs_item_id) : null;
    const tooltip = `${a.title}: ${a.start_date} → ${a.end_date}${wbsItem ? ` (${wbsLabels.get(wbsItem.id) || wbsItem.title})` : ''}`;
    barsHtml += `
      <div class="gantt-bar" style="left:${left}px;top:${top + 7}px;width:${Math.max(width - 4, 12)}px;height:${rowHeight - 14}px;" title="${escapeHTML(tooltip)}">
        <span class="gantt-bar-label">${escapeHTML(a.title)}</span>
      </div>
    `;
  });

  const byId = new Map(activities.map(a => [a.id, a]));
  let connectorsHtml = '';
  links.forEach(l => {
    const d = ganttConnectorPath(l, byId, minDate, dayWidth, rowCenterY, 14);
    if (d) connectorsHtml += `<path d="${d}" class="gantt-link" marker-end="url(#ganttArrow)"/>`;
  });

  return `
    <div class="gantt-scroll" id="ganttScroll">
      <div class="gantt-header" style="width:${chartWidth}px;"><div class="gantt-months">${monthsHtml}</div><div class="gantt-days">${ticksHtml}</div></div>
      <div class="gantt-body" style="width:${chartWidth}px;height:${chartHeight}px;">
        ${barsHtml}
        <svg class="gantt-svg" width="${chartWidth}" height="${chartHeight}">
          <defs>
            <marker id="ganttArrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
              <path d="M0,0 L6,3 L0,6 Z" fill="#8a97a3"/>
            </marker>
          </defs>
          ${connectorsHtml}
        </svg>
      </div>
    </div>
  `;
}

function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

function wrapLabel(text, maxChars, maxLines){
  const words = String(text).split(/\s+/).filter(Boolean);
  const lines = [];
  let cur = '';
  words.forEach(w => {
    while (w.length > maxChars){
      if (cur){ lines.push(cur); cur = ''; }
      lines.push(w.slice(0, maxChars));
      w = w.slice(maxChars);
    }
    if (!cur) cur = w;
    else if ((cur + ' ' + w).length <= maxChars) cur += ' ' + w;
    else { lines.push(cur); cur = w; }
  });
  if (cur) lines.push(cur);
  if (lines.length > maxLines){
    const kept = lines.slice(0, maxLines);
    kept[maxLines - 1] = kept[maxLines - 1].slice(0, Math.max(maxChars - 1, 1)).trimEnd() + '…';
    return kept;
  }
  return lines.length ? lines : [''];
}

// The export is drawn from the data, not captured from the screen: fixed
// ~920px time axis and fixed font sizes regardless of the current on-screen
// zoom, activity names in their own column (never squeezed inside a short
// bar), and plain SVG attributes with no external CSS or web fonts so the
// file opens identically in a browser, Inkscape, PowerPoint or Word.
function buildGanttExportSvg(){
  const activities = (project.project_activities || []).slice().sort((a, b) => new Date(a.start_date) - new Date(b.start_date));
  if (activities.length === 0) return null;
  const links = project.project_activity_links || [];

  let first = ganttParseDate(activities[0].start_date), last = ganttParseDate(activities[0].end_date);
  activities.forEach(a => {
    first = Math.min(first, ganttParseDate(a.start_date));
    last = Math.max(last, ganttParseDate(a.end_date));
  });
  const minDate = first - GANTT_DAY_MS;
  const totalDays = Math.round((last + GANTT_DAY_MS - minDate) / GANTT_DAY_MS) + 1;

  const FONT = 'Arial, Helvetica, sans-serif';
  const pad = 20, labelColW = 290, titleH = 58, headerH = 46;
  const dayWidth = Math.max(920 / totalDays, 3);
  const plotW = totalDays * dayWidth;

  const rows = activities.map(a => ({ a, lines: wrapLabel(a.title, 40, 3) }));
  const maxLines = Math.max(...rows.map(r => r.lines.length));
  const rowH = maxLines >= 3 ? 68 : maxLines === 2 ? 54 : 40;
  const bodyH = rows.length * rowH;
  const width = Math.round(pad * 2 + labelColW + plotW);
  const height = Math.round(pad * 2 + titleH + headerH + bodyH);
  const plotX = pad + labelColW;
  const headerY = pad + titleH;
  const bodyY = headerY + headerH;

  const plan = ganttTickPlan(minDate, totalDays, dayWidth, 30);
  let s = '';
  s += `<rect width="${width}" height="${height}" fill="#ffffff"/>`;
  s += `<text x="${pad}" y="${pad + 18}" font-family="${FONT}" font-size="18" font-weight="700" fill="#2C3742">${escapeHTML(project.title)} — ${escapeHTML(t('project.tab_schedule'))}</text>`;
  const fullFmt = { month: 'short', day: 'numeric', year: 'numeric' };
  s += `<text x="${pad}" y="${pad + 38}" font-family="${FONT}" font-size="12" fill="#5A6672">${escapeHTML(ganttFmt(first, fullFmt))} – ${escapeHTML(ganttFmt(last, fullFmt))}</text>`;

  s += `<rect x="${plotX}" y="${headerY}" width="${plotW}" height="${headerH}" fill="#EEF4F8"/>`;
  plan.months.forEach(m => {
    s += `<line x1="${plotX + m.x}" y1="${headerY}" x2="${plotX + m.x}" y2="${headerY + 22}" stroke="#C9D3DA" stroke-width="1"/>`;
    if (m.label) s += `<text x="${plotX + m.x + 5}" y="${headerY + 15}" font-family="${FONT}" font-size="12" font-weight="700" fill="#2C3742">${escapeHTML(m.label)}</text>`;
  });
  s += `<line x1="${plotX}" y1="${headerY + 22}" x2="${plotX + plotW}" y2="${headerY + 22}" stroke="#C9D3DA" stroke-width="1"/>`;

  rows.forEach((r, idx) => {
    const y = bodyY + idx * rowH;
    s += `<rect x="${pad}" y="${y}" width="${labelColW + plotW}" height="${rowH}" fill="${idx % 2 ? '#F7FAFC' : '#ffffff'}"/>`;
  });
  plan.ticks.forEach(tk => {
    const x = plotX + tk.x;
    s += `<line x1="${x}" y1="${headerY + 22}" x2="${x}" y2="${bodyY + bodyH}" stroke="#E3E8EC" stroke-width="1"/>`;
    s += `<text x="${x + 4}" y="${headerY + 38}" font-family="${FONT}" font-size="12" fill="#2C3742">${escapeHTML(tk.label)}</text>`;
  });

  const rowCenterY = {};
  rows.forEach((r, idx) => {
    const a = r.a;
    const y = bodyY + idx * rowH;
    rowCenterY[a.id] = idx * rowH + rowH / 2;
    const n = r.lines.length;
    const blockH = n * 15 + 14;
    const top = y + (rowH - blockH) / 2;
    r.lines.forEach((ln, k) => {
      s += `<text x="${pad + 8}" y="${top + 12 + k * 15}" font-family="${FONT}" font-size="13" font-weight="700" fill="#2C3742">${escapeHTML(ln)}</text>`;
    });
    const sameYear = new Date(ganttParseDate(a.start_date)).getUTCFullYear() === new Date(ganttParseDate(a.end_date)).getUTCFullYear();
    const dFmt = sameYear ? { month: 'short', day: 'numeric' } : fullFmt;
    s += `<text x="${pad + 8}" y="${top + n * 15 + 11}" font-family="${FONT}" font-size="11" fill="#5A6672">${escapeHTML(ganttFmt(ganttParseDate(a.start_date), dFmt))} – ${escapeHTML(ganttFmt(ganttParseDate(a.end_date), dFmt))}</text>`;

    const start = ganttParseDate(a.start_date), end = ganttParseDate(a.end_date);
    const bx = plotX + Math.round((start - minDate) / GANTT_DAY_MS) * dayWidth;
    const bw = Math.max((Math.round((end - start) / GANTT_DAY_MS) + 1) * dayWidth - 2, 4);
    s += `<rect x="${bx}" y="${y + 10}" width="${bw}" height="${rowH - 20}" rx="4" fill="#3E8FD0" stroke="#1F5C93" stroke-width="1"/>`;
  });

  s += `<line x1="${plotX}" y1="${headerY}" x2="${plotX}" y2="${bodyY + bodyH}" stroke="#C9D3DA" stroke-width="1"/>`;
  s += `<rect x="${pad}" y="${headerY}" width="${labelColW + plotW}" height="${headerH + bodyH}" fill="none" stroke="#C9D3DA" stroke-width="1"/>`;

  const byId = new Map(activities.map(a => [a.id, a]));
  let connectors = '';
  links.forEach(l => {
    const d = ganttConnectorPath(l, byId, minDate, dayWidth, rowCenterY, 8);
    if (d) connectors += `<path d="${d}" fill="none" stroke="#8a97a3" stroke-width="1.5" marker-end="url(#ganttExportArrow)"/>`;
  });
  if (connectors){
    s += `<g transform="translate(${plotX},${bodyY})">${connectors}</g>`;
  }

  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}"><defs><marker id="ganttExportArrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#8a97a3"/></marker></defs>${s}</svg>`;
  return { svg, width, height };
}

// Rasterizes an export SVG ({svg,width,height}) to a PNG at up to 3x.
async function exportSvgAsPng(built, filename){
  const scale = Math.min(3, 8000 / built.width);
  const img = new Image();
  const loaded = new Promise((resolve, reject) => { img.onload = resolve; img.onerror = reject; });
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(built.svg);
  await loaded;
  const canvas = document.createElement('canvas');
  canvas.width = Math.round(built.width * scale);
  canvas.height = Math.round(built.height * scale);
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
  canvas.toBlob(blob => { if (blob) downloadBlob(blob, filename); });
}

function exportSvgFile(built, filename){
  const src = '<?xml version="1.0" encoding="UTF-8" standalone="no"?>\r\n' + built.svg;
  downloadBlob(new Blob([src], { type: 'image/svg+xml;charset=utf-8' }), filename);
}

  if (!built){ alert(t('project.no_activities')); return; }
  await exportSvgAsPng(built, ganttExportBaseName() + '.png');
}

function layoutWbsTree(items, zoom, dims){
  const nodeW = dims ? dims.nodeW : 168 * zoom, nodeH = dims ? dims.nodeH : 80 * zoom;
  const gapX = dims ? dims.gapX : 26 * zoom, gapY = dims ? dims.gapY : 56 * zoom;
  const byId = new Map(items.map(i => [i.id, { ...i, children: [] }]));
  const roots = [];
  byId.forEach(node => {
    if (node.parent_id && byId.has(node.parent_id)) byId.get(node.parent_id).children.push(node);
    else roots.push(node);
  });
  const bySortOrder = (a, b) => (a.sort_order - b.sort_order) || (new Date(a.created_at) - new Date(b.created_at));
  byId.forEach(node => node.children.sort(bySortOrder));
  roots.sort(bySortOrder);

  let nextX = 0;
  function place(node, depth){
    node.depth = depth;
    if (node.children.length === 0){
      node.x = nextX * (nodeW + gapX);
      nextX++;
    } else {
      node.children.forEach(c => place(c, depth + 1));
      const xs = node.children.map(c => c.x);
      node.x = (Math.min(...xs) + Math.max(...xs)) / 2;
    }
    node.y = depth * (nodeH + gapY);
  }
  roots.forEach(r => place(r, 0));

  const nodes = [...byId.values()];
  const width = nodes.length ? Math.max(...nodes.map(n => n.x)) + nodeW + 20 : 0;
  const height = nodes.length ? Math.max(...nodes.map(n => n.y)) + nodeH + 20 : 0;
  return { nodes, width, height, nodeW, nodeH };
}

function renderWbsDiagram(items, zoom){
  if (items.length === 0) return `<p class="credits-note">${t('project.wbs_no_items')}</p>`;

  const { nodes, width, height, nodeW, nodeH } = layoutWbsTree(items, zoom);
  const byId = new Map(nodes.map(n => [n.id, n]));
  const labels = wbsLabelMap(items);

  let boxesHtml = '';
  let linksHtml = '';
  nodes.forEach(n => {
    const label = labels.get(n.id) || n.title;
    boxesHtml += `
      <div class="wbs-node ${n.parent_id ? '' : 'is-root'}" style="left:${n.x}px;top:${n.y}px;width:${nodeW}px;height:${nodeH}px;" title="${escapeHTML(label)}${n.description ? ' — ' + escapeHTML(n.description) : ''}">
        <div class="wbs-node-title" style="font-size:${Math.round(12.5 * zoom)}px;">${escapeHTML(label)}</div>
        ${n.description ? `<div class="wbs-node-desc" style="font-size:${Math.round(10.5 * zoom)}px;">${escapeHTML(n.description)}</div>` : ''}
      </div>
    `;
    if (n.parent_id && byId.has(n.parent_id)){
      const p = byId.get(n.parent_id);
      const x1 = p.x + nodeW / 2, y1 = p.y + nodeH;
      const x2 = n.x + nodeW / 2, y2 = n.y;
      const midY = (y1 + y2) / 2;
      linksHtml += `<path d="M${x1},${y1} L${x1},${midY} L${x2},${midY} L${x2},${y2}" class="wbs-link"/>`;
    }
  });

  return `
    <div class="wbs-scroll" id="wbsScroll">
      <div class="wbs-canvas" style="width:${width}px;height:${height}px;">
        ${boxesHtml}
        <svg class="wbs-svg" width="${width}" height="${height}">${linksHtml}</svg>
      </div>
    </div>
  `;
}

// Like the Gantt export, the WBS export is drawn from the data at fixed
// font sizes (not captured from the screen at whatever zoom is active).
// Titles and descriptions wrap onto up to 3 lines instead of being cut off
// with an ellipsis, and each tree level is only as tall as its tallest box.
function buildWbsExportSvg(){
  const items = project.project_wbs_items || [];
  if (items.length === 0) return null;

  const FONT = 'Arial, Helvetica, sans-serif';
  const nodeW = 190, gapX = 24, gapY = 52, padX = 10, padY = 10;
  const titleLH = 16, descLH = 14;
  const pad = 20, titleH = 58;

  const { nodes } = layoutWbsTree(items, 1, { nodeW, nodeH: 1, gapX, gapY: 0 });
  const labels = wbsLabelMap(items);
  nodes.forEach(n => {
    n.titleLines = wrapLabel(labels.get(n.id) || n.title, 22, 3);
    n.descLines = n.description ? wrapLabel(n.description, 28, 3) : [];
    n.boxH = padY * 2 + n.titleLines.length * titleLH + (n.descLines.length ? 4 + n.descLines.length * descLH : 0);
  });

  const maxDepth = Math.max(...nodes.map(n => n.depth));
  const depthH = [];
  for (let d = 0; d <= maxDepth; d++) depthH[d] = Math.max(...nodes.filter(n => n.depth === d).map(n => n.boxH));
  const depthTop = [];
  let acc = 0;
  for (let d = 0; d <= maxDepth; d++){ depthTop[d] = acc; acc += depthH[d] + gapY; }
  const treeW = Math.max(...nodes.map(n => n.x)) + nodeW;
  const treeH = acc - gapY;

  const width = Math.max(Math.round(pad * 2 + treeW), 480);
  const height = Math.round(pad * 2 + titleH + treeH);
  const offX = Math.round((width - treeW) / 2);
  const offY = pad + titleH;
  const byId = new Map(nodes.map(n => [n.id, n]));

  let s = `<rect width="${width}" height="${height}" fill="#ffffff"/>`;
  s += `<text x="${pad}" y="${pad + 18}" font-family="${FONT}" font-size="18" font-weight="700" fill="#2C3742">${escapeHTML(project.title)} — ${escapeHTML(t('project.tab_wbs'))}</text>`;
  s += `<text x="${pad}" y="${pad + 38}" font-family="${FONT}" font-size="12" fill="#5A6672">${nodes.length} ${escapeHTML(t('project.wbs_list_heading').toLowerCase())}</text>`;

  let links = '';
  nodes.forEach(n => {
    if (!n.parent_id || !byId.has(n.parent_id)) return;
    const p = byId.get(n.parent_id);
    const x1 = offX + p.x + nodeW / 2, y1 = offY + depthTop[p.depth] + depthH[p.depth];
    const x2 = offX + n.x + nodeW / 2, y2 = offY + depthTop[n.depth];
    const midY = (y1 + y2) / 2;
    links += `<path d="M${x1},${y1} L${x1},${midY} L${x2},${midY} L${x2},${y2}" fill="none" stroke="#8a97a3" stroke-width="1.5"/>`;
  });
  s += links;

  nodes.forEach(n => {
    const x = offX + n.x, y = offY + depthTop[n.depth], h = depthH[n.depth];
    s += `<rect x="${x}" y="${y}" width="${nodeW}" height="${h}" rx="8" fill="#ffffff" stroke="${n.parent_id ? '#3E8FD0' : '#E8834F'}" stroke-width="1.5"/>`;
    const blockH = n.titleLines.length * titleLH + (n.descLines.length ? 4 + n.descLines.length * descLH : 0);
    let ty = y + (h - blockH) / 2;
    n.titleLines.forEach(ln => {
      s += `<text x="${x + nodeW / 2}" y="${ty + 12}" text-anchor="middle" font-family="${FONT}" font-size="13" font-weight="700" fill="#2C3742">${escapeHTML(ln)}</text>`;
      ty += titleLH;
    });
    if (n.descLines.length){
      ty += 4;
      n.descLines.forEach(ln => {
        s += `<text x="${x + nodeW / 2}" y="${ty + 10}" text-anchor="middle" font-family="${FONT}" font-size="11" fill="#5A6672">${escapeHTML(ln)}</text>`;
        ty += descLH;
      });
    }
  });

  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}">${s}</svg>`;
  return { svg, width, height };
}

function nextWbsSortOrder(parentId, excludeId){
  const siblings = (project.project_wbs_items || []).filter(i => (i.parent_id || null) === (parentId || null) && i.id !== excludeId);
  return siblings.length ? Math.max(...siblings.map(s => s.sort_order || 0)) + 1 : 0;
}

async function moveWbsItem(id, direction){
  const items = project.project_wbs_items || [];
  const item = items.find(i => i.id === id);
  if (!item) return;
  const siblings = items
    .filter(i => (i.parent_id || null) === (item.parent_id || null))
    .sort((a, b) => (a.sort_order - b.sort_order) || (new Date(a.created_at) - new Date(b.created_at)));
  const idx = siblings.findIndex(i => i.id === id);
  const swapWith = direction === 'up' ? siblings[idx - 1] : siblings[idx + 1];
  if (!swapWith) return;
  await Promise.all([
    supabaseClient.from('project_wbs_items').update({ sort_order: swapWith.sort_order }).eq('id', item.id),
    supabaseClient.from('project_wbs_items').update({ sort_order: item.sort_order }).eq('id', swapWith.id)
  ]);
  loadProject();
}

// ---------------------------------------------------------------------------
// SYSTEMS ENGINEERING DIAGRAMS: a small shared SVG editor that powers both
// the "Use Cases" tab (actors + use-case ovals) and the "Architecture" tab
// (SysML-style block definition diagram). One saved diagram per type per
// project (project_diagrams table). Each type keeps its own independent
// working state so switching tabs never loses unsaved edits, and nothing
// is written to the database until the user clicks Save.
// ---------------------------------------------------------------------------
const DIAGRAM_CANVAS_W = 1200;
const diagramCanvasH = (type) => type === 'sequence' ? 1000 : 700; // sequence diagrams grow downward with each message
const DIAGRAM_TYPES = ['usecases', 'architecture', 'context', 'sequence', 'states', 'activity'];
const diagramPerType = (make) => Object.fromEntries(DIAGRAM_TYPES.map(ty => [ty, make(ty)]));
const DIAGRAM_SHAPE_SIZE = {
  actor: { w: 70, h: 96 },
  usecase: { w: 170, h: 74 },
  block: { w: 190, h: 96 },
  system: { w: 230, h: 110 },
  external: { w: 160, h: 64 },
  state: { w: 160, h: 76 },
  initial: { w: 30, h: 30 },
  final: { w: 34, h: 34 },
  action: { w: 160, h: 56 },
  decision: { w: 76, h: 76 },
  lifeline: { w: 140, h: 44 }
};
// Shapes whose rename dialog also asks for a short description (shown inside the shape).
const DIAGRAM_DESC_KINDS = new Set(['block', 'system', 'state']);
const diagramPaletteItem = (kind) => ({ kind, label: () => t('project.diagram_add_' + kind), defaultLabel: () => t('project.diagram_default_' + kind) });
const DIAGRAM_PALETTES = {
  usecases: ['actor', 'usecase'].map(diagramPaletteItem),
  architecture: ['block'].map(diagramPaletteItem),
  context: ['system', 'external', 'actor'].map(diagramPaletteItem),
  sequence: ['lifeline'].map(diagramPaletteItem),
  states: ['state', 'initial', 'final'].map(diagramPaletteItem),
  activity: ['action', 'decision', 'initial', 'final'].map(diagramPaletteItem)
};
// What a shape is called when it has no label of its own (start/end markers, unlabeled decisions).
const diagramNodeName = (node) => node ? (node.label || t('project.diagram_add_' + node.kind)) : '?';

let diagramState = diagramPerType(() => null);
let diagramDirty = diagramPerType(() => false);
let diagramMode = diagramPerType(() => 'idle');
let diagramConnectFrom = diagramPerType(() => null);
let diagramSelected = diagramPerType(() => null);
let diagramZoom = diagramPerType(() => 1);
let diagramFitApplied = diagramPerType(() => false);
let diagramLinkKind = diagramPerType(() => null); // filled in below once the connection kinds are known
let diagramHistory = diagramPerType(() => ({ undo: [], redo: [] }));

// Connection types. `end`/`start` name the marker drawn at the target/source end;
// `auto` is the stereotype shown when the connection has no custom label.
const DIAGRAM_EDGE_KINDS = {
  association:    { end: null,        start: null },
  include:        { end: 'arrowOpen', start: null, dash: true, auto: '«include»' },
  extend:         { end: 'arrowOpen', start: null, dash: true, auto: '«extend»' },
  generalization: { end: 'triangle',  start: null },
  flow:           { end: 'arrow',     start: null },
  dependency:     { end: 'arrowOpen', start: null, dash: true },
  composition:    { end: null,        start: 'diamond' },
  transition:     { end: 'arrow',     start: null },
  sync:           { end: 'arrow',     start: null },
  async:          { end: 'arrowOpen', start: null },
  return:         { end: 'arrowOpen', start: null, dash: true }
};
const DIAGRAM_EDGE_KINDS_BY_TYPE = {
  usecases: ['association', 'include', 'extend', 'generalization'],
  architecture: ['association', 'flow', 'dependency', 'composition', 'generalization'],
  context: ['flow', 'association', 'dependency'],
  sequence: ['sync', 'async', 'return'],
  states: ['transition'],
  activity: ['flow']
};
DIAGRAM_TYPES.forEach(ty => { diagramLinkKind[ty] = DIAGRAM_EDGE_KINDS_BY_TYPE[ty][0]; });
const diagramEdgeKind = (edge) => DIAGRAM_EDGE_KINDS[edge.kind] ? edge.kind : 'association';

// Undo/redo: whole-diagram snapshots taken just before each change. A snapshot
// identical to the previous one is skipped, so focusing a field without
// changing anything doesn't leave a no-op step behind.
const DIAGRAM_HISTORY_MAX = 60;
function diagramCheckpoint(type){
  const snap = JSON.stringify(diagramState[type]);
  const h = diagramHistory[type];
  if (h.undo.length && h.undo[h.undo.length - 1] === snap) return;
  h.undo.push(snap);
  if (h.undo.length > DIAGRAM_HISTORY_MAX) h.undo.shift();
  h.redo = [];
}
function diagramRestore(type, snap){
  const parsed = JSON.parse(snap);
  diagramState[type].nodes = parsed.nodes || [];
  diagramState[type].edges = parsed.edges || [];
  // Keep the selection when that shape/line still exists, so undoing a text edit doesn't dismiss its editor.
  const sel = diagramSelected[type];
  const stillThere = sel && (sel.kind === 'node' ? diagramState[type].nodes.some(n => n.id === sel.id) : diagramState[type].edges.some(e => e.id === sel.id));
  diagramSelected[type] = stillThere ? sel : null;
  diagramMode[type] = 'idle';
  diagramConnectFrom[type] = null;
  diagramDirty[type] = true;
  updateDiagramDirtyNote(type);
  refreshDiagramCanvas(type);
}
function diagramUndo(type){
  const h = diagramHistory[type];
  if (!h.undo.length) return;
  h.redo.push(JSON.stringify(diagramState[type]));
  diagramRestore(type, h.undo.pop());
}
function diagramRedo(type){
  const h = diagramHistory[type];
  if (!h.redo.length) return;
  h.undo.push(JSON.stringify(diagramState[type]));
  diagramRestore(type, h.redo.pop());
}

// Lets zoom in/out/reset buttons on the Gantt/WBS charts and the SysML
// diagrams all share one set of handlers instead of branching per prefix.
const ZOOM_STATE = {
  gantt: { get: () => ganttZoom, set: v => { ganttZoom = v; } },
  wbs: { get: () => wbsZoom, set: v => { wbsZoom = v; } },
  ...diagramPerType(ty => ({ get: () => diagramZoom[ty], set: v => { diagramZoom[ty] = v; } }))
};

function diagramNodeById(type, id){
  return diagramState[type].nodes.find(n => n.id === id);
}
function diagramNodeCenter(node){
  const size = DIAGRAM_SHAPE_SIZE[node.kind];
  return { cx: node.x + size.w / 2, cy: node.y + size.h / 2 };
}
// Clips a line from box A's center toward box B's center to box A's edge,
// so arrows meet the shape boundary instead of overlapping into its middle.
function diagramClipToBox(node, towardX, towardY){
  const size = DIAGRAM_SHAPE_SIZE[node.kind];
  const { cx, cy } = diagramNodeCenter(node);
  const dx = towardX - cx, dy = towardY - cy;
  if (dx === 0 && dy === 0) return { x: cx, y: cy };
  const halfW = size.w / 2, halfH = size.h / 2;
  const scale = 1 / Math.max(Math.abs(dx) / halfW, Math.abs(dy) / halfH);
  return { x: cx + dx * scale, y: cy + dy * scale };
}

// Where a connection is drawn. Several connections between the same two shapes
// (e.g. A to B and B to A) are fanned out sideways so they don't overlap.
function diagramEdgeGeometry(type, edge){
  const state = diagramState[type];
  const from = diagramNodeById(type, edge.from), to = diagramNodeById(type, edge.to);
  if (!from || !to) return null;
  const fc = diagramNodeCenter(from), tc = diagramNodeCenter(to);
  if (type === 'sequence'){
    const y = edge.y == null ? 110 : edge.y;
    return { p1: { x: fc.cx, y }, p2: { x: tc.cx, y }, mid: { x: (fc.cx + tc.cx) / 2, y } };
  }
  let p1 = diagramClipToBox(from, tc.cx, tc.cy);
  let p2 = diagramClipToBox(to, fc.cx, fc.cy);
  const siblings = state.edges.filter(e => (e.from === edge.from && e.to === edge.to) || (e.from === edge.to && e.to === edge.from));
  if (siblings.length > 1){
    const dx = tc.cx - fc.cx, dy = tc.cy - fc.cy, len = Math.hypot(dx, dy) || 1;
    // Offset is measured along a fixed normal (from the lower id to the higher), so A->B and B->A land on opposite sides.
    const sign = edge.from < edge.to ? 1 : -1;
    const idx = siblings.indexOf(edge);
    const off = (idx - (siblings.length - 1) / 2) * 22 * sign;
    const nx = (-dy / len) * off, ny = (dx / len) * off;
    p1 = { x: p1.x + nx, y: p1.y + ny }; p2 = { x: p2.x + nx, y: p2.y + ny };
  }
  return { p1, p2, mid: { x: (p1.x + p2.x) / 2, y: (p1.y + p2.y) / 2 } };
}

function diagramShapeSvg(node, isSelected){
  const size = DIAGRAM_SHAPE_SIZE[node.kind];
  const cls = 'diagram-shape' + (isSelected ? ' selected' : '');
  if (node.kind === 'actor'){
    return `
      <circle class="${cls}" cx="${size.w/2}" cy="16" r="12"></circle>
      <line class="${cls}" x1="${size.w/2}" y1="28" x2="${size.w/2}" y2="60"></line>
      <line class="${cls}" x1="14" y1="38" x2="${size.w-14}" y2="38"></line>
      <line class="${cls}" x1="${size.w/2}" y1="60" x2="14" y2="88"></line>
      <line class="${cls}" x1="${size.w/2}" y1="60" x2="${size.w-14}" y2="88"></line>
      <text class="diagram-label" x="${size.w/2}" y="${size.h-2}" text-anchor="middle">${escapeHTML(node.label)}</text>
    `;
  }
  if (node.kind === 'usecase'){
    return `
      <ellipse class="${cls}" cx="${size.w/2}" cy="${size.h/2}" rx="${size.w/2-2}" ry="${size.h/2-2}"></ellipse>
      <text class="diagram-label" x="${size.w/2}" y="${size.h/2+5}" text-anchor="middle">${escapeHTML(node.label)}</text>
      ${ucHasDetail(node) ? `<text class="diagram-detail-mark" x="${size.w-38}" y="21" text-anchor="middle">≡</text>` : ''}
    `;
  }
  if (node.kind === 'system'){
    return `
      <rect class="${cls}" x="1" y="1" width="${size.w-2}" height="${size.h-2}" rx="16"></rect>
      <text class="diagram-block-stereotype" x="${size.w/2}" y="22" text-anchor="middle">«system»</text>
      <text class="diagram-label" x="${size.w/2}" y="${node.sublabel ? 52 : 60}" text-anchor="middle">${escapeHTML(node.label)}</text>
      ${node.sublabel ? `<text class="diagram-block-desc" x="${size.w/2}" y="76" text-anchor="middle">${escapeHTML(node.sublabel)}</text>` : ''}
    `;
  }
  if (node.kind === 'external'){
    return `
      <rect class="${cls}" x="1" y="1" width="${size.w-2}" height="${size.h-2}" rx="2"></rect>
      <text class="diagram-block-stereotype" x="${size.w/2}" y="18" text-anchor="middle">«external»</text>
      <text class="diagram-label" x="${size.w/2}" y="42" text-anchor="middle">${escapeHTML(node.label)}</text>
    `;
  }
  if (node.kind === 'state'){
    return `
      <rect class="${cls}" x="1" y="1" width="${size.w-2}" height="${size.h-2}" rx="20"></rect>
      <text class="diagram-label" x="${size.w/2}" y="${node.sublabel ? 26 : size.h/2+5}" text-anchor="middle">${escapeHTML(node.label)}</text>
      ${node.sublabel ? `<line class="diagram-block-divider" x1="12" y1="36" x2="${size.w-12}" y2="36"></line><text class="diagram-block-desc" x="${size.w/2}" y="54" text-anchor="middle">${escapeHTML(node.sublabel)}</text>` : ''}
    `;
  }
  if (node.kind === 'initial'){
    return `<circle class="${cls} diagram-fill-dark" cx="${size.w/2}" cy="${size.h/2}" r="${size.h/2-2}"></circle>`;
  }
  if (node.kind === 'final'){
    return `
      <circle class="${cls}" cx="${size.w/2}" cy="${size.h/2}" r="${size.h/2-2}"></circle>
      <circle class="diagram-shape diagram-fill-dark" cx="${size.w/2}" cy="${size.h/2}" r="${size.h/2-8}"></circle>
    `;
  }
  if (node.kind === 'action'){
    return `
      <rect class="${cls}" x="1" y="1" width="${size.w-2}" height="${size.h-2}" rx="${size.h/2-2}"></rect>
      <text class="diagram-label" x="${size.w/2}" y="${size.h/2+5}" text-anchor="middle">${escapeHTML(node.label)}</text>
    `;
  }
  if (node.kind === 'decision'){
    return `
      <polygon class="${cls}" points="${size.w/2},2 ${size.w-2},${size.h/2} ${size.w/2},${size.h-2} 2,${size.h/2}"></polygon>
      <text class="diagram-label" x="${size.w/2}" y="${size.h+14}" text-anchor="middle">${escapeHTML(node.label)}</text>
    `;
  }
  if (node.kind === 'lifeline'){
    // The dashed line below the header is drawn in its own layer (see buildDiagramSvgHTML) so messages sit on top of it.
    return `
      <rect class="${cls}" x="1" y="1" width="${size.w-2}" height="${size.h-2}" rx="4"></rect>

  return `
    <rect class="${cls}" x="1" y="1" width="${size.w-2}" height="${size.h-2}" rx="4"></rect>

    <line class="diagram-block-divider" x1="1" y1="48" x2="${size.w-1}" y2="48"></line>
    <text class="diagram-block-desc" x="8" y="66">${escapeHTML(node.sublabel || '')}</text>
  `;
}

function buildDiagramSvgHTML(type, zoomOverride){
  const state = diagramState[type];
  const selected = diagramSelected[type];
  const zoom = zoomOverride || diagramZoom[type] || 1;
  let edgesHtml = '';
  let seqRank = null;
  if (type === 'sequence'){
    // Dashed lifelines go first so messages are drawn over them; messages are numbered top to bottom.
    state.nodes.forEach(node => {
      const c = diagramNodeCenter(node);
      edgesHtml += `<line class="diagram-lifeline" data-lifeline-for="${node.id}" x1="${c.cx}" y1="${node.y + DIAGRAM_SHAPE_SIZE.lifeline.h}" x2="${c.cx}" y2="${diagramCanvasH('sequence') - 12}"></line>`;
    });
    seqRank = new Map(state.edges.filter(e => diagramNodeById(type, e.from) && diagramNodeById(type, e.to))
      .sort((a, b) => (a.y == null ? 110 : a.y) - (b.y == null ? 110 : b.y)).map((e, i) => [e.id, i + 1]));
  }
  state.edges.forEach(edge => {
    const geo = diagramEdgeGeometry(type, edge);
    if (!geo) return;
    const kind = diagramEdgeKind(edge), def = DIAGRAM_EDGE_KINDS[kind];
    const isSel = selected && selected.kind === 'edge' && selected.id === edge.id;
    const text = (seqRank ? seqRank.get(edge.id) + '. ' : '') + (edge.label || def.auto || '');
    const coords = `x1="${geo.p1.x}" y1="${geo.p1.y}" x2="${geo.p2.x}" y2="${geo.p2.y}"`;
    edgesHtml += `<g class="diagram-edge-group">
      <line class="diagram-edge-hit" data-edge-id="${edge.id}" ${coords}></line>
      <line class="diagram-edge${isSel ? ' selected' : ''} diagram-edge-${kind}" data-edge-id="${edge.id}" ${coords}
        ${def.start ? `marker-start="url(#diagramMarker-${type}-${def.start})"` : ''} ${def.end ? `marker-end="url(#diagramMarker-${type}-${def.end})"` : ''}></line>
      <text class="diagram-edge-label" data-edge-label-for="${edge.id}" x="${geo.mid.x}" y="${geo.mid.y - 5}" text-anchor="middle">${escapeHTML(text)}</text>
    </g>`;
  });
  let nodesHtml = '';
  state.nodes.forEach(node => {
    const isSel = selected && selected.kind === 'node' && selected.id === node.id;
    nodesHtml += `<g class="diagram-node" data-node-id="${node.id}" transform="translate(${node.x},${node.y})">${diagramShapeSvg(node, isSel)}</g>`;
  });
  return `
    <svg id="diagramSvg-${type}" class="diagram-svg" viewBox="0 0 ${DIAGRAM_CANVAS_W} ${diagramCanvasH(type)}" width="${DIAGRAM_CANVAS_W * zoom}" height="${diagramCanvasH(type) * zoom}" data-diagram-type="${type}">
      <defs>
        <marker id="diagramMarker-${type}-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
          <path d="M0,0 L8,3.5 L0,7 Z" fill="#8a97a3"></path>
        </marker>
        <marker id="diagramMarker-${type}-arrowOpen" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
          <path d="M0,0 L8,3.5 L0,7" fill="none" stroke="#8a97a3" stroke-width="1.5"></path>
        </marker>
        <marker id="diagramMarker-${type}-triangle" markerWidth="14" markerHeight="14" refX="12" refY="6" orient="auto" markerUnits="userSpaceOnUse">
          <path d="M0.5,0.5 L12,6 L0.5,11.5 Z" fill="#ffffff" stroke="#8a97a3" stroke-width="1.5"></path>
        </marker>
        <marker id="diagramMarker-${type}-diamond" markerWidth="18" markerHeight="14" refX="0" refY="6" orient="auto" markerUnits="userSpaceOnUse">
          <path d="M0,6 L8,0.5 L16,6 L8,11.5 Z" fill="#8a97a3" stroke="#8a97a3" stroke-width="1"></path>
        </marker>
      </defs>
      <g class="diagram-edges">${edgesHtml}</g>
      <g class="diagram-nodes">${nodesHtml}</g>
    </svg>
  `;
}

// Standalone-document styles for exported diagrams: the live page's
// .diagram-* classes live in style.css and reference CSS custom properties
// defined on :root, neither of which travels with a plain .svg file opened
// outside the browser tab — so the exported figure re-states the same
// rules with literal color values instead of var(...) references.
const DIAGRAM_EXPORT_CSS = `
  .diagram-shape{fill:#FFFFFF;stroke:#3E8FD0;stroke-width:1.5;}
  .diagram-label{font-family:'Space Grotesk',Arial,sans-serif;font-size:12.5px;font-weight:600;fill:#2C3742;}
  .diagram-block-stereotype{font-family:'IBM Plex Mono',monospace;font-size:9.5px;fill:#5A6672;}
  .diagram-block-divider{stroke:#DFE5E9;stroke-width:1;}
  .diagram-block-desc{font-family:'Inter',Arial,sans-serif;font-size:10px;fill:#5A6672;}
  .diagram-edge{stroke:#8a97a3;stroke-width:1.5;}
  .diagram-edge-include,.diagram-edge-extend,.diagram-edge-dependency,.diagram-edge-return{stroke-dasharray:6 4;}
  .diagram-lifeline{stroke:#8a97a3;stroke-width:1.2;stroke-dasharray:5 4;}
  .diagram-detail-mark{font-family:Arial,sans-serif;font-size:14px;font-weight:700;fill:#3E8FD0;}
  .diagram-fill-dark{fill:#2C3742;}
  .diagram-edge-label{font-family:'Inter',Arial,sans-serif;font-size:11px;font-weight:500;fill:#2C3742;paint-order:stroke;stroke:#ffffff;stroke-width:4px;stroke-linejoin:round;}
`;

// The diagram is already plain SVG, so this just serializes it as a
// standalone, styled, full-resolution document, ignoring whatever zoom
// level or selection highlight is currently on screen.
function exportDiagramSvg(type){
  const state = diagramState[type];
  if (!state || (state.nodes.length === 0 && state.edges.length === 0)){
    alert(t('project.diagram_export_empty'));
    return;
  }
  const prevSelected = diagramSelected[type];
  diagramSelected[type] = null;
  const svgMarkup = buildDiagramSvgHTML(type, 1);
  diagramSelected[type] = prevSelected;

  const withStyle = svgMarkup
    .replace('<svg ', '<svg xmlns="http://www.w3.org/2000/svg" ')
    .replace('</defs>', `</defs><style>${DIAGRAM_EXPORT_CSS}</style><rect width="${DIAGRAM_CANVAS_W}" height="${diagramCanvasH(type)}" fill="#ffffff"></rect>`);
  const src = '<?xml version="1.0" standalone="no"?>\r\n' + withStyle;
  const blob = new Blob([src], { type: 'image/svg+xml;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const projectTitle = (project.title || 'project').replace(/[^A-Za-z0-9_-]+/g, '_');
  const a = document.createElement('a');
  a.href = url; a.download = `${projectTitle}-${type}.svg`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

// Loads a diagram's working copy from the saved row the first time it's needed.
// Shared with the requirements/traceability views so they see the same nodes
// (including not-yet-saved edits) that the diagram tabs show.
function ensureDiagramState(type){
  if (!diagramState[type]){
    const saved = (project.project_diagrams || []).find(d => d.type === type);
    diagramState[type] = saved && saved.data ? JSON.parse(JSON.stringify(saved.data)) : { nodes: [], edges: [] };
    diagramDirty[type] = false;
    // Diagrams saved before typed connections (no `v`) drew every line with an arrowhead.
    // Keep that look for architecture by treating those lines as flows; later saves carry v:2.
    if (!diagramState[type].v){
      if (type === 'architecture') diagramState[type].edges.forEach(e => { if (!e.kind || e.kind === 'association') e.kind = 'flow'; });
      diagramState[type].v = 2;
    }
  }
  return diagramState[type];
}

      <button class="btn btn-ghost btn-small" data-diagram-connect data-diagram-type="${type}" type="button">🔗 ${t('project.diagram_connect')}</button>
      ${DIAGRAM_EDGE_KINDS_BY_TYPE[type].length > 1 ? `<label class="diagram-linktype" title="${t('project.diagram_link_type')}">
