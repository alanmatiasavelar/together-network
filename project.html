          <button class="btn btn-ghost btn-small" type="submit">${editingReqId ? t('common.save') : t('common.add')}</button>
          <p class="form-msg" id="reqMsg"></p>
        </form>
      </details>
    `;
  }
  return html;
}

function renderTasksPanel(isOwner, approvedCollabs){
  const tasks = project.project_tasks || [];
  const wbsItems = project.project_wbs_items || [];
  const wbsById = new Map(wbsItems.map(w => [w.id, w]));
  const wbsLabels = wbsLabelMap(wbsItems);
  const columns = ['created','working','finished','approved'];
  let html = `<p class="poll-meta" style="margin-top:0;">${t('project.tab_kanban_note')}</p>`;
  html += `<div class="kanban">`;
  columns.forEach(col => {
    const colTasks = tasks.filter(tk => tk.status === col);
    html += `<div class="kanban-col"><h4>${t('project.col_' + col)}</h4>`;
    if (colTasks.length === 0) html += `<p class="kanban-empty">${t('project.no_tasks_in_column')}</p>`;
    colTasks.forEach(tk => {
      const assignees = (tk.task_assignees || []).map(a => a.profiles?.display_name || '?');
      const wbsItem = tk.wbs_item_id ? wbsById.get(tk.wbs_item_id) : null;
      html += `
        <div class="task-card">
          <h5>${escapeHTML(tk.title)}</h5>
          ${tk.description ? `<p>${escapeHTML(tk.description)}</p>` : ''}
          <div class="task-meta">
            ${wbsItem ? `<span class="chip">📦 ${escapeHTML(wbsLabels.get(wbsItem.id) || wbsItem.title)}</span>` : ''}
            ${assignees.length ? assignees.map(a => `<span class="chip">${escapeHTML(a)}</span>`).join('') : `<span class="chip">${t('project.task_none_assigned')}</span>`}
            ${tk.due_date ? `<span class="chip">${t('project.due')} ${escapeHTML(tk.due_date)}</span>` : ''}
          </div>
          <select data-task-status data-task-id="${tk.id}">
            ${columns.map(c => `<option value="${c}" ${c === tk.status ? 'selected' : ''}>${t('project.col_' + c)}</option>`).join('')}
          </select>
          <div class="item-actions" style="margin-top:6px;">
            <a class="icon-btn" href="task.html?id=${tk.id}">👁 ${t('project.view_workflow')}</a>
            <button class="icon-btn" data-edit-task="${tk.id}">${t('common.edit')}</button>
            <button class="icon-btn" data-delete-task="${tk.id}">${t('common.delete')}</button>
          </div>
        </div>
      `;
    });
    html += `</div>`;
  });
  html += `</div>`;

  if (currentUser){
    const editingTask = editingTaskId ? tasks.find(tk => tk.id === editingTaskId) : null;
    const assigneesHTML = approvedCollabs.length
      ? approvedCollabs.map(c => {
          const checked = editingTask && (editingTask.task_assignees || []).some(a => a.user_id === c.user_id);
          return `<label><input type="checkbox" name="assignee" value="${c.user_id}" ${checked ? 'checked' : ''}> ${escapeHTML(c.profiles?.display_name || '?')}</label>`;
        }).join('')
      : `<span class="credits-note">${t('project.no_collaborators')}</span>`;
    html += `
      <details class="add-inline" ${editingTaskId ? 'open' : ''} style="margin-top:16px;">
        <summary>${editingTaskId ? t('common.edit') : t('project.add_task')}</summary>
        <form id="taskForm" class="auth-form" data-editing="${editingTaskId || ''}">
          <label>${t('project.task_title')}<input type="text" required name="title" maxlength="80" value="${editingTask ? escapeHTML(editingTask.title) : ''}"></label>
          <label>${t('project.task_desc')}<textarea name="description" rows="2" maxlength="300">${editingTask ? escapeHTML(editingTask.description || '') : ''}</textarea></label>
          <label>${t('project.task_due')}<input type="date" name="due_date" value="${editingTask && editingTask.due_date ? editingTask.due_date : ''}"></label>
          <label>${t('project.task_wbs_label')}
            <select name="wbs_item_id">
              <option value="">${t('project.task_wbs_none')}</option>
              ${[...wbsLabels].map(([id, label]) => `<option value="${id}" ${editingTask && editingTask.wbs_item_id === id ? 'selected' : ''}>${escapeHTML(label)}</option>`).join('')}
            </select>
          </label>
          <label>${t('project.task_assignees')}<div class="assignee-checks">${assigneesHTML}</div></label>
          <button class="btn btn-ghost btn-small" type="submit">${editingTaskId ? t('common.save') : t('common.add')}</button>
          <p class="form-msg" id="taskMsg"></p>
        </form>
      </details>
    `;
  }
  return html;
}

function setTeamMsg(text, isError){
  const el = document.getElementById('teamMsg');
  if (!el) return;
  el.textContent = text;
  el.className = 'form-msg' + (isError ? ' error' : '');
}

function wireEvents(){
  content.querySelectorAll('.tab-group-bar button').forEach(btn => btn.addEventListener('click', () => {
    const group = btn.dataset.group;
    if (group === activeGroup) return;
    activeGroup = group;
    activeTab = lastTabInGroup[group] || TAB_GROUPS[group][0];
    lastTabInGroup[activeGroup] = activeTab;
    render();
    maybeAutoFitActiveTab();
  }));

  content.querySelectorAll('.tab-bar button').forEach(btn => btn.addEventListener('click', () => {
    activeTab = btn.dataset.tab;
    lastTabInGroup[activeGroup] = activeTab;
    content.querySelectorAll('.tab-bar button').forEach(b => b.classList.toggle('active', b === btn));
    content.querySelectorAll('.tab-panel').forEach(p => { p.hidden = p.dataset.panel !== activeTab; });
    maybeAutoFitActiveTab();
  }));

  content.querySelectorAll('[data-jump-tab]').forEach(btn => btn.addEventListener('click', () => {
    jumpToTab(btn.dataset.jumpTab);
    maybeAutoFitActiveTab();
  }));

  const requestBtn = document.getElementById('requestJoinBtn');
  if (requestBtn) requestBtn.addEventListener('click', async () => {
    requestBtn.disabled = true;
    const { error } = await supabaseClient.from('project_collaborators').insert({ project_id: projectId, user_id: currentUser.id, status: 'pending', cv_url: myCvUrl });
    if (error){ setTeamMsg(error.message, true); requestBtn.disabled = false; return; }
    loadProject();
  });

  const leaveBtn = document.getElementById('leaveBtn');
  if (leaveBtn) leaveBtn.addEventListener('click', async () => {
    await supabaseClient.from('project_collaborators').delete().eq('project_id', projectId).eq('user_id', currentUser.id);
    loadProject();
  });

  const reRequestBtn = document.getElementById('reRequestBtn');
  if (reRequestBtn) reRequestBtn.addEventListener('click', async () => {
    await supabaseClient.from('project_collaborators').delete().eq('project_id', projectId).eq('user_id', currentUser.id);
    const { error } = await supabaseClient.from('project_collaborators').insert({ project_id: projectId, user_id: currentUser.id, status: 'pending', cv_url: myCvUrl });
    if (error){ setTeamMsg(error.message, true); return; }
    loadProject();
  });

  content.querySelectorAll('[data-approve]').forEach(btn => btn.addEventListener('click', async () => {
    await supabaseClient.from('project_collaborators').update({ status: 'approved' }).eq('id', btn.dataset.approve);
    loadProject();
  }));
  content.querySelectorAll('[data-deny]').forEach(btn => btn.addEventListener('click', async () => {
    await supabaseClient.from('project_collaborators').update({ status: 'denied' }).eq('id', btn.dataset.deny);
    loadProject();
  }));

  const stageSelect = document.getElementById('stageSelect');
  if (stageSelect) stageSelect.addEventListener('change', async () => {
    stageSelect.disabled = true;
    await supabaseClient.from('projects').update({ stage: stageSelect.value }).eq('id', projectId);
    loadProject();
  });

  const mediaForm = document.getElementById('mediaForm');
  if (mediaForm) mediaForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const msg = document.getElementById('mediaMsg');
    const submitBtn = e.target.querySelector('button[type="submit"]');
    msg.textContent = ''; msg.className = 'form-msg';
    const fd = new FormData(e.target);
    const ytLink = (fd.get('youtube_link') || '').trim();
    const file = e.target.querySelector('input[name="image_file"]').files[0];
    const removeImage = fd.get('remove_image') === 'on';
    if (ytLink && !YOUTUBE_LINK_PATTERN.test(ytLink)){ msg.textContent = t('project.youtube_err'); msg.className = 'form-msg error'; return; }

    let imageUrl = project.image_url || null;
    if (removeImage) imageUrl = null;

    if (file && file.size > 0){
      if (!file.type.startsWith('image/')){ msg.textContent = t('learnmore.file_not_image'); msg.className = 'form-msg error'; return; }
      if (file.size > MAX_IMAGE_BYTES){ msg.textContent = t('learnmore.file_too_large'); msg.className = 'form-msg error'; return; }
      submitBtn.disabled = true;
      msg.textContent = t('learnmore.uploading');
      try {
        imageUrl = await uploadCoverImage(file);
      } catch (err) {
        msg.textContent = err.message || String(err);
        msg.className = 'form-msg error';
        submitBtn.disabled = false;
        return;
      }
    }

    const { error } = await supabaseClient.from('projects').update({
      image_url: imageUrl, youtube_link: ytLink || null,
      skills: fd.getAll('skills'), visibility: fd.get('visibility') || 'public'
    }).eq('id', projectId);
    submitBtn.disabled = false;
    if (error){ msg.textContent = error.message; msg.className = 'form-msg error'; return; }
    loadProject();
  });

  // --- Goals ---
  content.querySelectorAll('.goal-edit-row').forEach(form => form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const goalId = form.dataset.goalId;
    const progress = Math.max(0, Math.min(100, Number(form.querySelector('input[name="progress"]').value) || 0));
    await supabaseClient.from('project_goals').update({ progress }).eq('id', goalId);
    loadProject();
  }));
  const goalForm = document.getElementById('goalForm');
  if (goalForm) goalForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const msg = document.getElementById('goalMsg');
    const fd = new FormData(e.target);
    const editingId = e.target.dataset.editing;
    const payload = { title: fd.get('title'), description: fd.get('description') || null };
    let error;
    if (editingId){
      ({ error } = await supabaseClient.from('project_goals').update(payload).eq('id', editingId));
    } else {
      ({ error } = await supabaseClient.from('project_goals').insert({ project_id: projectId, ...payload }));
    }
    if (error){ msg.textContent = error.message; msg.className = 'form-msg error'; return; }
    editingGoalId = null;
    loadProject();
  });
  content.querySelectorAll('[data-edit-goal]').forEach(btn => btn.addEventListener('click', () => { editingGoalId = btn.dataset.editGoal; render(); }));
  content.querySelectorAll('[data-delete-goal]').forEach(btn => btn.addEventListener('click', async () => {
    await supabaseClient.from('project_goals').delete().eq('id', btn.dataset.deleteGoal);
    loadProject();
  }));

  // --- Requirements ---
  content.querySelectorAll('[data-req-id]').forEach(sel => sel.addEventListener('change', async () => {
    await supabaseClient.from('project_requirements').update({ status: sel.value }).eq('id', sel.dataset.reqId);
    loadProject();
  }));
  const reqForm = document.getElementById('reqForm');
  if (reqForm) reqForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const msg = document.getElementById('reqMsg');
    const fd = new FormData(e.target);
    const editingId = e.target.dataset.editing;
    const payload = { title: fd.get('title'), description: fd.get('description') || null };
    let error;
    if (editingId){
      ({ error } = await supabaseClient.from('project_requirements').update(payload).eq('id', editingId));
    } else {
      ({ error } = await supabaseClient.from('project_requirements').insert({ project_id: projectId, ...payload }));
    }
    if (error){ msg.textContent = error.message; msg.className = 'form-msg error'; return; }
    editingReqId = null;
    loadProject();
  });
  content.querySelectorAll('[data-edit-req]').forEach(btn => btn.addEventListener('click', () => { editingReqId = btn.dataset.editReq; render(); }));
  content.querySelectorAll('[data-delete-req]').forEach(btn => btn.addEventListener('click', async () => {
    await supabaseClient.from('project_requirements').delete().eq('id', btn.dataset.deleteReq);
    loadProject();
  }));

  // --- Tasks ---
  content.querySelectorAll('[data-task-status]').forEach(sel => sel.addEventListener('change', async () => {
    await supabaseClient.from('project_tasks').update({ status: sel.value }).eq('id', sel.dataset.taskId);
    loadProject();
  }));
  const taskForm = document.getElementById('taskForm');
  if (taskForm) taskForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const msg = document.getElementById('taskMsg');
    const fd = new FormData(e.target);
    const editingId = e.target.dataset.editing;
    const checkedAssignees = [...e.target.querySelectorAll('input[name="assignee"]:checked')].map(cb => cb.value);
    const payload = { title: fd.get('title'), description: fd.get('description') || null, due_date: fd.get('due_date') || null, wbs_item_id: fd.get('wbs_item_id') || null };
    let taskId = editingId || null;
    let error;
    if (editingId){
      ({ error } = await supabaseClient.from('project_tasks').update(payload).eq('id', editingId));
      if (!error) await supabaseClient.from('task_assignees').delete().eq('task_id', editingId);
    } else {
      const userName = currentUser.user_metadata?.display_name || currentUser.email.split('@')[0];
      const { data, error: insErr } = await supabaseClient.from('project_tasks').insert({ project_id: projectId, ...payload, created_by: currentUser.id, created_by_name: userName }).select().single();
      error = insErr;
      if (data) taskId = data.id;
    }
    if (error){ msg.textContent = error.message; msg.className = 'form-msg error'; return; }
    if (taskId && checkedAssignees.length){
      await supabaseClient.from('task_assignees').insert(checkedAssignees.map(uid => ({ task_id: taskId, user_id: uid })));
    }
    editingTaskId = null;
    loadProject();
  });
  content.querySelectorAll('[data-edit-task]').forEach(btn => btn.addEventListener('click', () => { editingTaskId = btn.dataset.editTask; render(); }));
  content.querySelectorAll('[data-delete-task]').forEach(btn => btn.addEventListener('click', async () => {
    await supabaseClient.from('project_tasks').delete().eq('id', btn.dataset.deleteTask);
    loadProject();
  }));

  // --- Team feed ---
  const feedPostForm = document.getElementById('feedPostForm');
  if (feedPostForm) feedPostForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const msg = document.getElementById('feedPostMsg');
    const submitBtn = e.target.querySelector('button[type="submit"]');
    msg.textContent = ''; msg.className = 'form-msg';
    const fd = new FormData(e.target);
    const text = (fd.get('text') || '').trim();
    const ytLink = (fd.get('youtube_link') || '').trim();
    const file = e.target.querySelector('input[name="image_file"]').files[0];
    const removeImage = fd.get('remove_image') === 'on';
    const editingId = e.target.dataset.editing;
    const existingPost = editingId ? feedPosts.find(p => p.id === editingId) : null;

    if (ytLink && !YOUTUBE_LINK_PATTERN.test(ytLink)){ msg.textContent = t('project.youtube_err'); msg.className = 'form-msg error'; return; }

    let imageUrl = existingPost ? existingPost.image_url : null;
    if (removeImage) imageUrl = null;

    if (file && file.size > 0){
      if (!file.type.startsWith('image/')){ msg.textContent = t('learnmore.file_not_image'); msg.className = 'form-msg error'; return; }
      if (file.size > MAX_IMAGE_BYTES){ msg.textContent = t('learnmore.file_too_large'); msg.className = 'form-msg error'; return; }
      submitBtn.disabled = true;
      msg.textContent = t('learnmore.uploading');
      try {
        imageUrl = await uploadFeedImage(file);
      } catch (err) {
        msg.textContent = err.message || String(err);
        msg.className = 'form-msg error';
        submitBtn.disabled = false;
        return;
      }
    }

    if (!text && !imageUrl && !ytLink){
      msg.textContent = t('learnmore.post_needs_content');
      msg.className = 'form-msg error';
      submitBtn.disabled = false;
      return;
    }

    let error, data;
    if (editingId){
      ({ error } = await supabaseClient.from('project_feed_posts').update({ text: text || null, image_url: imageUrl, youtube_link: ytLink || null }).eq('id', editingId));
    } else {
      const userName = currentUser.user_metadata?.display_name || currentUser.email.split('@')[0];
      ({ data, error } = await supabaseClient.from('project_feed_posts').insert({
        project_id: projectId, user_id: currentUser.id, user_name: userName,
        text: text || null, image_url: imageUrl, youtube_link: ytLink || null
      }).select().single());
    }
    submitBtn.disabled = false;
    if (error){ msg.textContent = error.message; msg.className = 'form-msg error'; return; }
    if (data?.flagged) alert(t('moderation.flagged_notice'));
    editingFeedPostId = null;
    loadProject();
  });

  content.querySelectorAll('[data-edit-feedpost]').forEach(btn => btn.addEventListener('click', () => {
    editingFeedPostId = btn.dataset.editFeedpost;
    render();
  }));
  content.querySelectorAll('[data-delete-feedpost]').forEach(btn => btn.addEventListener('click', async () => {
    await supabaseClient.from('project_feed_posts').delete().eq('id', btn.dataset.deleteFeedpost);
    loadProject();
  }));
  const loadMoreFeedBtn = document.getElementById('loadMoreFeedBtn');
  if (loadMoreFeedBtn) loadMoreFeedBtn.addEventListener('click', async () => {
    loadMoreFeedBtn.disabled = true;
    await loadFeedPosts(true);
    render();
  });

  // --- Polls ---
  const pollForm = document.getElementById('pollForm');
  if (pollForm) pollForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const msg = document.getElementById('pollMsg');
    msg.textContent = ''; msg.className = 'form-msg';
    const fd = new FormData(e.target);
    const question = (fd.get('question') || '').trim();
    const options = (fd.get('options') || '').split('\n').map(s => s.trim()).filter(Boolean);
    if (options.length < 2){
      msg.textContent = t('project.poll_min_options_err');
      msg.className = 'form-msg error';
      return;
    }
    const userName = currentUser.user_metadata?.display_name || currentUser.email.split('@')[0];
    const { error } = await supabaseClient.from('project_polls').insert({ project_id: projectId, question, options, created_by: currentUser.id, created_by_name: userName });

    loadProject();
  });

  content.querySelectorAll('.poll-option-row input[type="radio"]').forEach(radio => radio.addEventListener('change', async (e) => {
    if (!currentUser) return;
    const pollId = e.target.dataset.pollId;
    const optionIndex = Number(e.target.value);
    const { data: existing } = await supabaseClient.from('poll_votes').select('id').eq('poll_id', pollId).eq('user_id', currentUser.id).maybeSingle();
    if (existing){
      await supabaseClient.from('poll_votes').update({ option_index: optionIndex }).eq('id', existing.id);
    } else {
      await supabaseClient.from('poll_votes').insert({ poll_id: pollId, user_id: currentUser.id, option_index: optionIndex });
    }
    loadProject();
  }));

  content.querySelectorAll('[data-delete-poll]').forEach(btn => btn.addEventListener('click', async () => {
    await supabaseClient.from('project_polls').delete().eq('id', btn.dataset.deletePoll);
    loadProject();
  }));

  // --- Events ---
  const eventForm = document.getElementById('eventForm');
  if (eventForm) eventForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const msg = document.getElementById('eventMsg');
    msg.textContent = ''; msg.className = 'form-msg';
    const fd = new FormData(e.target);
    const title = (fd.get('title') || '').trim();
    const eventAtLocal = fd.get('event_at');
    const description = (fd.get('description') || '').trim();

    const payload = { title, description: description || null, event_at: eventAtLocal ? new Date(eventAtLocal).toISOString() : null };
    let error;
    if (editingId){
      ({ error } = await supabaseClient.from('project_events').update(payload).eq('id', editingId));
    } else {
      const userName = currentUser.user_metadata?.display_name || currentUser.email.split('@')[0];
      ({ error } = await supabaseClient.from('project_events').insert({ project_id: projectId, ...payload, created_by: currentUser.id, created_by_name: userName }));
    }
    if (error){ msg.textContent = error.message; msg.className = 'form-msg error'; return; }
    editingEventId = null;
    loadProject();
  });

  content.querySelectorAll('[data-edit-event]').forEach(btn => btn.addEventListener('click', () => {
    editingEventId = btn.dataset.editEvent;
    render();
  }));
  content.querySelectorAll('[data-delete-event]').forEach(btn => btn.addEventListener('click', async () => {
    await supabaseClient.from('project_events').delete().eq('id', btn.dataset.deleteEvent);
    loadProject();
  }));
  content.querySelectorAll('[data-rsvp-event]').forEach(btn => btn.addEventListener('click', async () => {
    if (!currentUser){ window.location.href = 'login.html'; return; }
    const eventId = btn.dataset.rsvpEvent;
    const status = btn.dataset.rsvpStatus;
    const { data: existing } = await supabaseClient.from('event_rsvps').select('id').eq('event_id', eventId).eq('user_id', currentUser.id).maybeSingle();
    if (existing){
      await supabaseClient.from('event_rsvps').update({ status }).eq('id', existing.id);
    } else {
      await supabaseClient.from('event_rsvps').insert({ event_id: eventId, user_id: currentUser.id, status });
    }
    loadProject();
  }));

  // --- Costs ---
  const costForm = document.getElementById('costForm');
  if (costForm) costForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const msg = document.getElementById('costMsg');
    msg.textContent = ''; msg.className = 'form-msg';
    const fd = new FormData(e.target);
    const description = (fd.get('description') || '').trim();
    const amount = Number(fd.get('amount'));
    const costDate = fd.get('cost_date') || null;
    const category = (fd.get('category') || '').trim() || null;
    const editingId = e.target.dataset.editing;
    let error;
    if (editingId){
      ({ error } = await supabaseClient.from('project_costs').update({ description, amount, cost_date: costDate, category }).eq('id', editingId));
    } else {
      const userName = currentUser.user_metadata?.display_name || currentUser.email.split('@')[0];
      ({ error } = await supabaseClient.from('project_costs').insert({
        project_id: projectId, description, amount, cost_date: costDate, category,
        added_by: currentUser.id, added_by_name: userName
      }));
    }
    if (error){ msg.textContent = error.message; msg.className = 'form-msg error'; return; }
    editingCostId = null;
    loadProject();
  });
  content.querySelectorAll('[data-edit-cost]').forEach(btn => btn.addEventListener('click', () => {
    editingCostId = btn.dataset.editCost;
    render();
  }));
  content.querySelectorAll('[data-delete-cost]').forEach(btn => btn.addEventListener('click', async () => {
    await supabaseClient.from('project_costs').delete().eq('id', btn.dataset.deleteCost);
    loadProject();
  }));

  // --- Stakeholders ---
  const stakeholderForm = document.getElementById('stakeholderForm');
  if (stakeholderForm) stakeholderForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const msg = document.getElementById('stakeholderMsg');
    msg.textContent = ''; msg.className = 'form-msg';
    const fd = new FormData(e.target);
    const payload = {
      name: (fd.get('name') || '').trim(),
      role: (fd.get('role') || '').trim() || null,
      power: Number(fd.get('power')),
      interest: Number(fd.get('interest')),
      notes: (fd.get('notes') || '').trim() || null
    };
    const editingId = e.target.dataset.editing;
    let error;
    if (editingId){
      ({ error } = await supabaseClient.from('project_stakeholders').update(payload).eq('id', editingId));
    } else {
      ({ error } = await supabaseClient.from('project_stakeholders').insert({ project_id: projectId, ...payload, created_by: currentUser.id }));
    }
    if (error){ msg.textContent = error.message; msg.className = 'form-msg error'; return; }
    editingStakeholderId = null;
    loadProject();
  });
  content.querySelectorAll('[data-edit-stakeholder]').forEach(btn => btn.addEventListener('click', () => {
    editingStakeholderId = btn.dataset.editStakeholder;
    render();
  }));
  content.querySelectorAll('[data-delete-stakeholder]').forEach(btn => btn.addEventListener('click', async () => {
    await supabaseClient.from('project_stakeholders').delete().eq('id', btn.dataset.deleteStakeholder);
    loadProject();
  }));

  // --- Risks ---
  const riskForm = document.getElementById('riskForm');
  if (riskForm) riskForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const msg = document.getElementById('riskMsg');
    msg.textContent = ''; msg.className = 'form-msg';
    const fd = new FormData(e.target);
    const isMitigated = fd.get('is_mitigated') === 'on';
    const residualProb = fd.get('residual_probability_pct');
    const residualImpact = fd.get('residual_impact_cost');
    const payload = {
      title: (fd.get('title') || '').trim(),
      description: (fd.get('description') || '').trim() || null,
      likelihood: Number(fd.get('likelihood')),
      severity: Number(fd.get('severity')),
      probability_pct: Number(fd.get('probability_pct')),
      impact_cost: Number(fd.get('impact_cost')),
      impact_unit: fd.get('impact_unit') === 'time' ? 'time' : 'cost',
      is_mitigated: isMitigated,
      // Unchecking "Mitigate this risk" clears the after-mitigation fields
      // rather than just hiding them, so a stale residual estimate can't
      // linger and silently resurface if the risk is marked mitigated again.
      mitigation_strategy: isMitigated ? ((fd.get('mitigation_strategy') || '').trim() || null) : null,
      residual_probability_pct: isMitigated && residualProb !== '' ? Number(residualProb) : null,
      residual_impact_cost: isMitigated && residualImpact !== '' ? Number(residualImpact) : null
    };
    const editingId = e.target.dataset.editing;
    let error;
    if (editingId){
      ({ error } = await supabaseClient.from('project_risks').update(payload).eq('id', editingId));
    } else {
      const userName = currentUser.user_metadata?.display_name || currentUser.email.split('@')[0];
      ({ error } = await supabaseClient.from('project_risks').insert({ project_id: projectId, ...payload, created_by: currentUser.id, created_by_name: userName }));
    }
    if (error){ msg.textContent = error.message; msg.className = 'form-msg error'; return; }
    editingRiskId = null;
    loadProject();
  });
  content.querySelectorAll('[data-edit-risk]').forEach(btn => btn.addEventListener('click', () => {
    editingRiskId = btn.dataset.editRisk;
    render();
  }));
  content.querySelectorAll('[data-delete-risk]').forEach(btn => btn.addEventListener('click', async () => {
    await supabaseClient.from('project_risks').delete().eq('id', btn.dataset.deleteRisk);
    loadProject();
  }));
  const riskMitigateCheckbox = document.getElementById('riskMitigateCheckbox');
  if (riskMitigateCheckbox) riskMitigateCheckbox.addEventListener('change', (e) => {
    document.getElementById('riskMitigationFields').hidden = !e.target.checked;
  });

  content.querySelectorAll('.mitigation-add-row').forEach(form => form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const description = (fd.get('description') || '').trim();
    if (!description) return;
    const cost = fd.get('cost');
    const userName = currentUser.user_metadata?.display_name || currentUser.email.split('@')[0];
    await supabaseClient.from('project_risk_mitigations').insert({
      project_id: projectId, risk_id: e.target.dataset.riskId, description,
      cost: cost === '' ? null : Number(cost), created_by: currentUser.id, created_by_name: userName
    });
    loadProject();
  }));
  content.querySelectorAll('[data-delete-mitigation]').forEach(btn => btn.addEventListener('click', async () => {
    await supabaseClient.from('project_risk_mitigations').delete().eq('id', btn.dataset.deleteMitigation);
    loadProject();
  }));

  const activityForm = document.getElementById('activityForm');
  if (activityForm) activityForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const msg = document.getElementById('activityMsg');
    msg.textContent = ''; msg.className = 'form-msg';
    const fd = new FormData(e.target);
    const title = (fd.get('title') || '').trim();
    const startDate = fd.get('start_date');
    const endDate = fd.get('end_date');
    const wbsItemId = fd.get('wbs_item_id') || null;
    if (endDate < startDate){ msg.textContent = t('project.activity_date_err'); msg.className = 'form-msg error'; return; }
    const editingId = e.target.dataset.editing;
    let error;
    if (editingId){
      ({ error } = await supabaseClient.from('project_activities').update({ title, start_date: startDate, end_date: endDate, wbs_item_id: wbsItemId }).eq('id', editingId));
    } else {
      ({ error } = await supabaseClient.from('project_activities').insert({ project_id: projectId, title, start_date: startDate, end_date: endDate, wbs_item_id: wbsItemId }));
    }
    if (error){ msg.textContent = error.message; msg.className = 'form-msg error'; return; }
    editingActivityId = null;
    await recalcAndSaveSchedule();
    loadProject();
  });
  content.querySelectorAll('[data-edit-activity]').forEach(btn => btn.addEventListener('click', () => {
    editingActivityId = btn.dataset.editActivity;
    render();
  }));
  content.querySelectorAll('[data-delete-activity]').forEach(btn => btn.addEventListener('click', async () => {
    await supabaseClient.from('project_activities').delete().eq('id', btn.dataset.deleteActivity);
    loadProject();
  }));

  const linkForm = document.getElementById('linkForm');
  if (linkForm) linkForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const msg = document.getElementById('linkMsg');
    msg.textContent = ''; msg.className = 'form-msg';
    const fd = new FormData(e.target);
    const predecessorId = fd.get('predecessor_id');
    const successorId = fd.get('successor_id');
    const linkType = fd.get('link_type');
    if (predecessorId === successorId){ msg.textContent = t('project.link_same_err'); msg.className = 'form-msg error'; return; }
    const { error } = await supabaseClient.from('project_activity_links').insert({
      project_id: projectId, predecessor_id: predecessorId, successor_id: successorId, link_type: linkType
    });
    if (error){ msg.textContent = error.message; msg.className = 'form-msg error'; return; }
    await recalcAndSaveSchedule();
    loadProject();
  });
  content.querySelectorAll('[data-delete-link]').forEach(btn => btn.addEventListener('click', async () => {
    await supabaseClient.from('project_activity_links').delete().eq('id', btn.dataset.deleteLink);
    loadProject();
  }));

  const wbsForm = document.getElementById('wbsForm');
  if (wbsForm) wbsForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const msg = document.getElementById('wbsMsg');
    msg.textContent = ''; msg.className = 'form-msg';
    const fd = new FormData(e.target);
    const title = (fd.get('title') || '').trim();
    const description = (fd.get('description') || '').trim();
    const parentId = fd.get('parent_id') || null;
    const editingId = e.target.dataset.editing;
    const existing = editingId ? (project.project_wbs_items || []).find(i => i.id === editingId) : null;
    let error;
    if (editingId){
      // Only re-append at the end of the sibling group if the parent actually changed —
      // otherwise editing the title would silently bump the item to last place.
      const parentChanged = existing && (existing.parent_id || null) !== (parentId || null);
      const payload = { title, description: description || null, parent_id: parentId };
      if (parentChanged) payload.sort_order = nextWbsSortOrder(parentId, editingId);
      ({ error } = await supabaseClient.from('project_wbs_items').update(payload).eq('id', editingId));
    } else {
      ({ error } = await supabaseClient.from('project_wbs_items').insert({
        project_id: projectId, title, description: description || null, parent_id: parentId,
        sort_order: nextWbsSortOrder(parentId, null)
      }));
    }
    if (error){ msg.textContent = error.message; msg.className = 'form-msg error'; return; }
    editingWbsId = null;
    loadProject();
  });
  content.querySelectorAll('[data-edit-wbs]').forEach(btn => btn.addEventListener('click', () => {
    editingWbsId = btn.dataset.editWbs;
    render();
  }));
  content.querySelectorAll('[data-delete-wbs]').forEach(btn => btn.addEventListener('click', async () => {
    if (!confirm(t('project.wbs_delete_confirm'))) return;
    await supabaseClient.from('project_wbs_items').delete().eq('id', btn.dataset.deleteWbs);
    loadProject();
  }));
  content.querySelectorAll('[data-move-wbs-up]').forEach(btn => btn.addEventListener('click', () => moveWbsItem(btn.dataset.moveWbsUp, 'up')));
  content.querySelectorAll('[data-move-wbs-down]').forEach(btn => btn.addEventListener('click', () => moveWbsItem(btn.dataset.moveWbsDown, 'down')));

  content.querySelectorAll('[data-zoom-in]').forEach(btn => btn.addEventListener('click', () => {
    const z = ZOOM_STATE[btn.dataset.zoomIn];
    z.set(clampZoom(z.get() * ZOOM_FACTOR));
    render();
  }));
  content.querySelectorAll('[data-zoom-out]').forEach(btn => btn.addEventListener('click', () => {
    const z = ZOOM_STATE[btn.dataset.zoomOut];
    z.set(clampZoom(z.get() / ZOOM_FACTOR));
    render();
  }));
  content.querySelectorAll('[data-zoom-reset]').forEach(btn => btn.addEventListener('click', () => {
    ZOOM_STATE[btn.dataset.zoomReset].set(1);
    render();
  }));
  content.querySelectorAll('[data-export-png]').forEach(btn => btn.addEventListener('click', () => {
    if (btn.dataset.exportPng === 'gantt') exportGanttPng();
    else exportWbsPng();
  }));
  content.querySelectorAll('[data-export-svg]').forEach(btn => btn.addEventListener('click', () => {
    const prefix = btn.dataset.exportSvg;
    if (prefix === 'gantt') exportGanttSvg();
    else if (prefix === 'wbs') exportWbsSvg();
    else exportDiagramSvg(prefix);
  }));

  // --- Team tab ---
  content.querySelectorAll('[data-remove-collab]').forEach(btn => btn.addEventListener('click', async () => {
    if (!confirm(t('project.remove_collaborator_confirm'))) return;
    await supabaseClient.from('project_collaborators').delete().eq('id', btn.dataset.removeCollab);
    loadProject();
  }));

  // --- Links tab ---
  const linkForm2 = document.getElementById('linkForm2');
  if (linkForm2) linkForm2.addEventListener('submit', async (e) => {
    e.preventDefault();
    const msg = document.getElementById('linkMsg2');
    msg.textContent = ''; msg.className = 'form-msg';
    const fd = new FormData(e.target);
    const payload = {
      label: (fd.get('label') || '').trim(),
      url: (fd.get('url') || '').trim(),
      link_type: fd.get('link_type') || 'other'
    };
    const editingId = e.target.dataset.editing;
    let error;
    if (editingId){
      ({ error } = await supabaseClient.from('project_links').update(payload).eq('id', editingId));
    } else {
      ({ error } = await supabaseClient.from('project_links').insert({ project_id: projectId, ...payload }));
    }
    if (error){ msg.textContent = error.message; msg.className = 'form-msg error'; return; }
    editingLinkId = null;
    loadProject();
  });
  content.querySelectorAll('[data-edit-link]').forEach(btn => btn.addEventListener('click', () => {
    editingLinkId = btn.dataset.editLink;
    render();
  }));
  content.querySelectorAll('[data-delete-link2]').forEach(btn => btn.addEventListener('click', async () => {
    await supabaseClient.from('project_links').delete().eq('id', btn.dataset.deleteLink2);
    loadProject();
  }));

  // --- AI tab ---
  const aiForm = document.getElementById('aiForm');
  if (aiForm){
    const aiTextarea = document.getElementById('aiInput');
    const aiSendBtn = document.getElementById('aiSendBtn');

    autoGrowTextarea(aiTextarea);

    aiTextarea.addEventListener('input', () => {
      aiSendBtn.disabled = aiTextarea.value.trim().length === 0;
      autoGrowTextarea(aiTextarea);
    });

    aiTextarea.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey){
        e.preventDefault();
        if (!aiSendBtn.disabled) aiForm.requestSubmit();
      }
    });

    aiForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('aiMsg');
      const message = aiTextarea.value.trim();
      if (!message) return;
      msg.textContent = ''; msg.className = 'form-msg';
      aiSendBtn.disabled = true; aiTextarea.disabled = true;
      const { error } = await supabaseClient.functions.invoke('gemini-chat', { body: { project_id: projectId, message } });
      aiTextarea.disabled = false;
      if (error){
        let errMsg = error.message;
        try { const body = await error.context.json(); if (body?.error) errMsg = body.error; } catch (e2) {}
        msg.textContent = errMsg; msg.className = 'form-msg error';
        aiSendBtn.disabled = false;
        aiTextarea.focus();
        return;
      }
      aiTextarea.value = '';
      autoGrowTextarea(aiTextarea);
      loadProject();
    });
  }
  const aiLog = document.getElementById('aiLog');
  if (aiLog) aiLog.scrollTop = aiLog.scrollHeight;

  const aiClearBtn = document.getElementById('aiClearBtn');
  if (aiClearBtn) aiClearBtn.addEventListener('click', async () => {
    if (!confirm(t('project.ai_clear_confirm'))) return;
    await supabaseClient.from('project_ai_messages').delete().eq('project_id', projectId).eq('user_id', currentUser.id);
    loadProject();
  });

  // --- Admin controls ---
  const adminDeleteBtn = document.getElementById('adminDeleteProjectBtn');
  if (adminDeleteBtn) adminDeleteBtn.addEventListener('click', async () => {
    if (!confirm(t('project.admin_delete_confirm'))) return;
    if (!confirm(t('project.admin_delete_confirm2'))) return;
    adminDeleteBtn.disabled = true;
    const { error } = await supabaseClient.from('projects').delete().eq('id', projectId);
    if (error){ alert(error.message); adminDeleteBtn.disabled = false; return; }
    window.location.href = 'projects.html';
  });

  // --- Systems Engineering diagrams ---
  wireDiagramToolbars();
  wireDiagramCanvasInteractions('usecases');
  wireDiagramCanvasInteractions('architecture');
}

async function init(){
  if (!supabaseClient){
    content.innerHTML = `<p class="form-msg error">${t('project.not_connected')}</p>`;
    return;
  }
  const { data: { session } } = await supabaseClient.auth.getSession();
  currentUser = session?.user || null;
  renderNav();
  await loadProject();
  supabaseClient.auth.onAuthStateChange(async (_event, session) => {
    currentUser = session?.user || null;
    renderNav();
    await loadProject();
  });
}
init();
</script>

</body>
</html>
