let seViewsStale = false;
let diagramDrag = null; // { type, nodeId, dx, dy, checkpointed } while a shape is being dragged
window.addEventListener('mouseup', () => {
  const finished = diagramDrag;
  diagramDrag = null;
  // After reordering messages, redraw so their numbers follow the new order.
  if (finished && finished.edgeId && finished.checkpointed) refreshDiagramCanvas(finished.type);
});

// ---- Use case details: a short specification stored on the shape itself (node.detail), saved with the diagram ----
const UC_DETAIL_FIELDS = [['desc', 'uc.desc', 2], ['pre', 'uc.pre', 2], ['steps', 'uc.steps', 6], ['alts', 'uc.alts', 3], ['post', 'uc.post', 2]];
const ucHasDetail = (node) => !!node.detail && UC_DETAIL_FIELDS.some(([k]) => String(node.detail[k] || '').trim());
// Main-flow lines, without any "1." / "-" bullets the author typed.
const ucSteps = (node) => String((node.detail && node.detail.steps) || '').split('\n')
  .map(l => l.replace(/^\s*(?:\d+[.)]|[-*•])\s*/, '').trim()).filter(Boolean);
let ucNotice = '';

function refreshUseCaseDetails(){
  const box = document.getElementById('ucDetails');
  if (!box) return;
  const sel = diagramSelected.usecases;
  const node = sel && sel.kind === 'node' ? diagramNodeById('usecases', sel.id) : null;
  if (!node || node.kind !== 'usecase'){
    box.innerHTML = `<h3>${t('uc.heading')}</h3><p class="credits-note">${t('uc.hint')}</p>`;
    return;
  }
  const isOwner = currentUser && project.owner_id === currentUser.id;
  box.innerHTML = `
    <h3>${t('uc.heading')}: ${escapeHTML(node.label)}</h3>
    <div class="uc-grid">${UC_DETAIL_FIELDS.map(([k, key, rows]) => `
      <label class="${k === 'steps' ? 'wide' : ''}">${t(key)}<textarea data-uc-field="${k}" rows="${rows}" maxlength="1500">${escapeHTML((node.detail && node.detail[k]) || '')}</textarea></label>`).join('')}
    </div>
    <div class="uc-actions">
      <button class="btn btn-ghost btn-small" type="button" data-uc-ai>✨ ${t('seai.draft')}</button>
      ${isOwner ? `<button class="btn btn-ghost btn-small" type="button" data-uc-make-reqs>${t('uc.make_reqs')}</button>` : ''}
      <span class="form-msg ${ucNotice ? 'ok' : ''}" id="ucMsg" role="status">${escapeHTML(ucNotice)}</span>
    </div>`;
  ucNotice = '';
  box.querySelectorAll('[data-uc-field]').forEach(ta => {
    ta.addEventListener('focus', () => diagramCheckpoint('usecases'));
    ta.addEventListener('input', () => {
      node.detail = node.detail || {};
      node.detail[ta.dataset.ucField] = ta.value;
      diagramDirty.usecases = true;
      updateDiagramDirtyNote('usecases');
      refreshDiagramCanvas('usecases', true); // redraws the "has details" mark; skipInspector keeps this textarea focused
    });
  });
  const aiBtn = box.querySelector('[data-uc-ai]');
  if (aiBtn) aiBtn.addEventListener('click', () => ucDraftWithAi(node, aiBtn));
  const makeBtn = box.querySelector('[data-uc-make-reqs]');
  if (makeBtn) makeBtn.addEventListener('click', () => ucCreateRequirements(node, makeBtn));
}

// Fills the details form from an AI draft (undoable). Asks first if there is already text to lose.
async function ucDraftWithAi(node, btn){
  const msg = document.getElementById('ucMsg');
  if (ucHasDetail(node) && !confirm(t('seai.replace'))) return;
  btn.disabled = true;
  msg.textContent = '✨ ' + t('seai.working'); msg.className = 'form-msg';
  try {
    const d = await seAssistCall('draft_use_case', { name: node.label, description: (node.detail && node.detail.desc) || '' });
    diagramCheckpoint('usecases');
    node.detail = {
      desc: d.description, pre: d.preconditions, steps: d.steps.map((x, i) => (i + 1) + '. ' + x).join('\n'),
      alts: d.alternates.join('\n'), post: d.postconditions
    };
    diagramDirty.usecases = true;
    updateDiagramDirtyNote('usecases');
    ucNotice = t('seai.draft_done');
    refreshDiagramCanvas('usecases'); // redraws the shape's details mark and the form
  } catch (err) {
    msg.textContent = err.message; msg.className = 'form-msg error';
    btn.disabled = false;
  }
}

// One requirement per main-flow step, each linked back to the use case.
async function ucCreateRequirements(node, btn){
  const msg = document.getElementById('ucMsg');
  const steps = ucSteps(node).slice(0, 20);
  if (!steps.length){ msg.textContent = t('uc.no_steps'); msg.className = 'form-msg error'; return; }
  if (!confirm(t('uc.make_confirm').replace('{n}', steps.length))) return;
  btn.disabled = true;
  for (let i = 0; i < steps.length; i++){
    const { error } = await supabaseClient.from('project_requirements').insert({
      project_id: projectId, title: steps[i].slice(0, 80),
      description: `${t('uc.from')} "${node.label}", ${t('uc.step')} ${i + 1}`.slice(0, 300),
      links: [{ t: 'usecases', id: node.id }]
    });
    if (error){ msg.textContent = error.message; msg.className = 'form-msg error'; btn.disabled = false; return; }
  }
  ucNotice = t('uc.created') + (diagramDirty.usecases ? ' ' + t('uc.created_unsaved') : '');
  await loadProject();
}

function diagramKindOptions(type, selectedKind){
  return DIAGRAM_EDGE_KINDS_BY_TYPE[type].map(k => `<option value="${k}" ${k === selectedKind ? 'selected' : ''}>${t('project.edge_' + k)}</option>`).join('');
}

// Everything around the canvas that depends on the selection / history:
// the connection inspector (type, label, reverse) and the undo/redo buttons.
// Pass skipInspector while typing in the label field so it keeps focus.
function refreshDiagramChrome(type, skipInspector){
  const h = diagramHistory[type];
  const undoBtn = content.querySelector(`[data-diagram-undo][data-diagram-type="${type}"]`);
  const redoBtn = content.querySelector(`[data-diagram-redo][data-diagram-type="${type}"]`);
  if (undoBtn) undoBtn.disabled = h.undo.length === 0;
  if (redoBtn) redoBtn.disabled = h.redo.length === 0;
  if (skipInspector) return;
  if (type === 'usecases') refreshUseCaseDetails();
  const box = document.getElementById('diagramInspector-' + type);
  if (!box) return;
  const sel = diagramSelected[type];
  const edge = sel && sel.kind === 'edge' ? diagramState[type].edges.find(e => e.id === sel.id) : null;
  // Always visible (with a hint) so selecting a line never shifts the canvas under the pointer mid-gesture.
  box.classList.toggle('is-idle', !edge);
  if (!edge){ box.hidden = false; box.innerHTML = '<span class="credits-note">' + t('project.diagram_inspector_hint') + '</span>'; return; }
  const from = diagramNodeById(type, edge.from), to = diagramNodeById(type, edge.to);
  const kind = diagramEdgeKind(edge);
  box.hidden = false;
  box.innerHTML = `
    <span class="diagram-inspector-title">${escapeHTML(diagramNodeName(from))} → ${escapeHTML(diagramNodeName(to))}</span>
    <label>${t('project.edge_type')}<select data-edge-kind>${diagramKindOptions(type, kind)}</select></label>
    <label>${t('project.edge_label')}<input type="text" data-edge-label maxlength="40" value="${escapeHTML(edge.label || '')}" placeholder="${escapeHTML(DIAGRAM_EDGE_KINDS[kind].auto || t('project.edge_label_ph'))}"></label>
    <button class="btn btn-ghost btn-small" data-edge-reverse type="button">⇄ ${t('project.edge_reverse')}</button>
    ${type === 'sequence' ? `<button class="btn btn-ghost btn-small" data-edge-up type="button" aria-label="${t('project.edge_move_up')}" title="${t('project.edge_move_up')}">▲</button><button class="btn btn-ghost btn-small" data-edge-down type="button" aria-label="${t('project.edge_move_down')}" title="${t('project.edge_move_down')}">▼</button>` : ''}
  `;
  if (type === 'sequence'){
    const shift = (dy) => () => {
      diagramCheckpoint(type);
      edge.y = Math.max(90, Math.min(diagramCanvasH(type) - 30, (edge.y == null ? 110 : edge.y) + dy));
      markDirty();
      refreshDiagramCanvas(type);
    };
    box.querySelector('[data-edge-up]').addEventListener('click', shift(-30));
    box.querySelector('[data-edge-down]').addEventListener('click', shift(30));
  }
  const markDirty = () => { diagramDirty[type] = true; updateDiagramDirtyNote(type); };
  box.querySelector('[data-edge-kind]').addEventListener('change', (e) => {
    diagramCheckpoint(type);
    edge.kind = e.target.value;
    markDirty();
    refreshDiagramCanvas(type);
  });
  const labelInput = box.querySelector('[data-edge-label]');
  labelInput.addEventListener('focus', () => diagramCheckpoint(type));
  labelInput.addEventListener('input', () => {
    edge.label = labelInput.value.trim() ? labelInput.value : undefined;
    markDirty();
    refreshDiagramCanvas(type, true);
  });
  box.querySelector('[data-edge-reverse]').addEventListener('click', () => {
    diagramCheckpoint(type);
    [edge.from, edge.to] = [edge.to, edge.from];
    markDirty();
    refreshDiagramCanvas(type);
  });
}

function refreshDiagramCanvas(type, skipInspector){
  seViewsStale = true;
  const wrap = document.getElementById('diagramScroll-' + type);
  if (!wrap) return;
  wrap.innerHTML = buildDiagramSvgHTML(type);
  wireDiagramCanvasInteractions(type);
  refreshDiagramChrome(type, skipInspector);
}

function updateDiagramDirtyNote(type){
  const note = document.getElementById('diagramDirtyNote-' + type);
  if (note) note.textContent = diagramDirty[type] ? t('project.diagram_unsaved') : '';
}

// Shared by the dblclick-on-shape shortcut and the toolbar Rename button —
// the button exists because double-click renaming is unreliable on touch
// devices, where there's no native double-tap gesture to hook into.
function renameDiagramNode(type, nodeId){
  const node = diagramNodeById(type, nodeId);
  if (!node) return;
  const next = prompt(t('project.diagram_rename_prompt'), node.label);
  let desc = null;
  if (DIAGRAM_DESC_KINDS.has(node.kind) && next !== null) desc = prompt(t('project.diagram_desc_prompt'), node.sublabel || '');
  const labelChanged = next !== null && next.trim() && next.trim() !== node.label;
  const descChanged = desc !== null && desc.trim() !== (node.sublabel || '');
  if (labelChanged || descChanged) diagramCheckpoint(type);
  if (labelChanged){ node.label = next.trim(); diagramDirty[type] = true; }
  if (descChanged){ node.sublabel = desc.trim(); diagramDirty[type] = true; }
  updateDiagramDirtyNote(type);
  refreshDiagramCanvas(type);
}

function wireDiagramCanvasInteractions(type){
  const svg = document.getElementById('diagramSvg-' + type);
  if (!svg) return;
  const state = diagramState[type];

  function markDirty(){ diagramDirty[type] = true; updateDiagramDirtyNote(type); }

  function toSvgPoint(evt){
    const pt = svg.createSVGPoint();
    pt.x = evt.clientX; pt.y = evt.clientY;
    return pt.matrixTransform(svg.getScreenCTM().inverse());
  }

  function moveConnectedEdges(nodeId){
    if (type === 'sequence'){
      const n = diagramNodeById(type, nodeId), life = svg.querySelector('[data-lifeline-for="' + nodeId + '"]');
      if (n && life){ const c = diagramNodeCenter(n); life.setAttribute('x1', c.cx); life.setAttribute('x2', c.cx); }
    }
    state.edges.forEach(edge => {
      if (edge.from !== nodeId && edge.to !== nodeId) return;
      const geo = diagramEdgeGeometry(type, edge);
      if (!geo) return;
      svg.querySelectorAll('[data-edge-id="' + edge.id + '"]').forEach(line => {
        line.setAttribute('x1', geo.p1.x); line.setAttribute('y1', geo.p1.y);
        line.setAttribute('x2', geo.p2.x); line.setAttribute('y2', geo.p2.y);
      });
      const label = svg.querySelector('[data-edge-label-for="' + edge.id + '"]');
      if (label){ label.setAttribute('x', geo.mid.x); label.setAttribute('y', geo.mid.y - 5); }
    });
  }

  svg.querySelectorAll('.diagram-node').forEach(g => {
    const nodeId = g.dataset.nodeId;
    g.addEventListener('mousedown', (e) => {
      e.preventDefault();
      if (diagramMode[type] === 'connecting'){
        if (diagramConnectFrom[type] && diagramConnectFrom[type] !== nodeId){
          diagramCheckpoint(type);
          const edge = { id: 'e' + Math.random().toString(36).slice(2,9), from: diagramConnectFrom[type], to: nodeId, kind: diagramLinkKind[type] };
          if (type === 'sequence') edge.y = Math.min(diagramCanvasH('sequence') - 40, Math.max(70, ...state.edges.map(e => e.y == null ? 110 : e.y)) + 50);
          state.edges.push(edge);
          diagramSelected[type] = { kind: 'edge', id: edge.id }; // so its label can be typed straight away
          markDirty();
        }
        diagramMode[type] = 'idle';
        diagramConnectFrom[type] = null;
        refreshDiagramCanvas(type);
        return;
      }
      diagramSelected[type] = { kind: 'node', id: nodeId };
      const p = toSvgPoint(e);
      const node = diagramNodeById(type, nodeId);
      // Kept outside this closure: the refresh below swaps in a new SVG (and a new closure) mid-gesture.
      diagramDrag = { type, nodeId, dx: p.x - node.x, dy: p.y - node.y, checkpointed: false };
      refreshDiagramCanvas(type);
    });
    g.addEventListener('dblclick', () => renameDiagramNode(type, nodeId));
  });

  svg.querySelectorAll('.diagram-edge, .diagram-edge-hit').forEach(line => {
    line.addEventListener('click', () => {
      diagramSelected[type] = { kind: 'edge', id: line.dataset.edgeId };
      refreshDiagramCanvas(type);
    });
  });

  if (type === 'sequence'){
    // Messages can be dragged up and down to reorder them.
    svg.querySelectorAll('.diagram-edge, .diagram-edge-hit').forEach(line => line.addEventListener('mousedown', (e) => {
      e.preventDefault();
      const edge = state.edges.find(x => x.id === line.dataset.edgeId);
      if (!edge) return;
      diagramSelected[type] = { kind: 'edge', id: edge.id };
      diagramDrag = { type, edgeId: edge.id, dy: toSvgPoint(e).y - (edge.y == null ? 110 : edge.y), checkpointed: false };
      refreshDiagramCanvas(type);
    }));
  }

  svg.addEventListener('mousemove', (e) => {
    const drag = diagramDrag;
    if (!drag || drag.type !== type) return;
    if (drag.edgeId){
      const edge = state.edges.find(x => x.id === drag.edgeId);
      if (!edge) return;
      const ny = Math.max(90, Math.min(diagramCanvasH(type) - 30, Math.round(toSvgPoint(e).y - drag.dy)));
      if (ny === edge.y) return;
      if (!drag.checkpointed){ diagramCheckpoint(type); drag.checkpointed = true; refreshDiagramChrome(type, true); }
      edge.y = ny; markDirty();
      const geo = diagramEdgeGeometry(type, edge);
      svg.querySelectorAll('[data-edge-id="' + edge.id + '"]').forEach(line => { line.setAttribute('y1', geo.p1.y); line.setAttribute('y2', geo.p2.y); });
      const label = svg.querySelector('[data-edge-label-for="' + edge.id + '"]');
      if (label) label.setAttribute('y', geo.mid.y - 5);
      return;
    }
    const p = toSvgPoint(e);
    const node = diagramNodeById(type, drag.nodeId);
    if (!node) return;
    const nx = Math.max(0, Math.min(DIAGRAM_CANVAS_W - DIAGRAM_SHAPE_SIZE[node.kind].w, p.x - drag.dx));
    const ny = type === 'sequence' ? node.y : Math.max(0, Math.min(diagramCanvasH(type) - DIAGRAM_SHAPE_SIZE[node.kind].h, p.y - drag.dy)); // participants only slide sideways
    if (nx === node.x && ny === node.y) return;
    if (!drag.checkpointed){ diagramCheckpoint(type); drag.checkpointed = true; refreshDiagramChrome(type, true); }
    node.x = nx; node.y = ny;
    markDirty();
    const g = svg.querySelector('.diagram-node[data-node-id="' + drag.nodeId + '"]');
    if (g) g.setAttribute('transform', 'translate(' + node.x + ',' + node.y + ')');
    moveConnectedEdges(drag.nodeId);
  });

  svg.addEventListener('mousedown', (e) => {
    if (e.target === svg) { diagramSelected[type] = null; refreshDiagramCanvas(type); }
  });
}

function wireDiagramToolbars(){
  content.querySelectorAll('[data-diagram-add]').forEach(btn => btn.addEventListener('click', () => {
    const type = btn.dataset.diagramType, kind = btn.dataset.diagramAdd;
    const state = diagramState[type];
    const palette = DIAGRAM_PALETTES[type].find(p => p.kind === kind);
    const count = state.nodes.length;
    diagramCheckpoint(type);
    const pos = type === 'sequence' ? { x: 30 + count * 180, y: 20 } : { x: 30 + (count % 5) * 200, y: 30 + Math.floor(count / 5) * 150 };
    state.nodes.push({
      id: 'n' + Math.random().toString(36).slice(2,9), kind,
      x: Math.min(pos.x, DIAGRAM_CANVAS_W - DIAGRAM_SHAPE_SIZE[kind].w), y: pos.y,
      label: palette.defaultLabel()
    });
    diagramDirty[type] = true;
    updateDiagramDirtyNote(type);
    refreshDiagramCanvas(type);
  }));

  content.querySelectorAll('[data-diagram-connect]').forEach(btn => btn.addEventListener('click', () => {
    const type = btn.dataset.diagramType;
    if (!diagramSelected[type] || diagramSelected[type].kind !== 'node'){
      alert(t('project.diagram_connect_hint'));
      return;
    }
    diagramMode[type] = 'connecting';
    diagramConnectFrom[type] = diagramSelected[type].id;
  }));

  content.querySelectorAll('[data-diagram-linktype]').forEach(sel => sel.addEventListener('change', () => {
    diagramLinkKind[sel.dataset.diagramType] = sel.value;
  }));
  content.querySelectorAll('[data-diagram-undo]').forEach(btn => btn.addEventListener('click', () => diagramUndo(btn.dataset.diagramType)));
  content.querySelectorAll('[data-diagram-redo]').forEach(btn => btn.addEventListener('click', () => diagramRedo(btn.dataset.diagramType)));
  DIAGRAM_TYPES.forEach(type => refreshDiagramChrome(type));
  if (!window.__diagramKeysBound){
    window.__diagramKeysBound = true;
    document.addEventListener('keydown', (e) => {
      if (!DIAGRAM_TYPES.includes(activeTab)) return;
      if (!(e.ctrlKey || e.metaKey) || e.altKey) return;
      const tag = (e.target && e.target.tagName || '').toLowerCase();
      if (tag === 'input' || tag === 'textarea' || tag === 'select' || (e.target && e.target.isContentEditable)) return;
      const key = e.key.toLowerCase();
      if (key === 'z' && !e.shiftKey){ e.preventDefault(); diagramUndo(activeTab); }
      else if (key === 'y' || (key === 'z' && e.shiftKey)){ e.preventDefault(); diagramRedo(activeTab); }
    });
  }

  content.querySelectorAll('[data-diagram-rename]').forEach(btn => btn.addEventListener('click', () => {
    const type = btn.dataset.diagramType;
    const sel = diagramSelected[type];
    if (!sel || sel.kind !== 'node'){
      alert(t('project.diagram_rename_hint'));
      return;
    }
    renameDiagramNode(type, sel.id);
  }));

  content.querySelectorAll('[data-diagram-delete]').forEach(btn => btn.addEventListener('click', () => {
    const type = btn.dataset.diagramType;
    const sel = diagramSelected[type];
    if (!sel) return;
    const state = diagramState[type];
    diagramCheckpoint(type);
    if (sel.kind === 'node'){
      state.nodes = state.nodes.filter(n => n.id !== sel.id);
      state.edges = state.edges.filter(e => e.from !== sel.id && e.to !== sel.id);
    } else {
      state.edges = state.edges.filter(e => e.id !== sel.id);
    }
    diagramSelected[type] = null;
    diagramDirty[type] = true;
    updateDiagramDirtyNote(type);
    refreshDiagramCanvas(type);
  }));

  content.querySelectorAll('[data-diagram-save]').forEach(btn => btn.addEventListener('click', async () => {
    const type = btn.dataset.diagramType;
    btn.disabled = true;
    const { error } = await supabaseClient.from('project_diagrams').upsert({
      project_id: projectId, type, data: { ...diagramState[type], v: 2 }, updated_by: currentUser.id
    }, { onConflict: 'project_id,type' });
    btn.disabled = false;
    if (error){ alert(error.message); return; }
    diagramDirty[type] = false;
    updateDiagramDirtyNote(type);
  }));
}

async function recalcAndSaveSchedule(){
  const [{ data: activities }, { data: links }] = await Promise.all([
    supabaseClient.from('project_activities').select('*').eq('project_id', projectId),
    supabaseClient.from('project_activity_links').select('*').eq('project_id', projectId)
  ]);
  if (!activities || !links || links.length === 0) return;

  const byId = new Map(activities.map(a => [a.id, { start: ganttParseDate(a.start_date), end: ganttParseDate(a.end_date) }]));
  let changed = true, iterations = 0;
  while (changed && iterations < 100){
    changed = false;
    iterations++;
    for (const link of links){
      const pred = byId.get(link.predecessor_id);
      const succ = byId.get(link.successor_id);
      if (!pred || !succ) continue;
      const duration = succ.end - succ.start;
      if (link.link_type === 'FS' && succ.start < pred.end){
        succ.start = pred.end; succ.end = succ.start + duration; changed = true;
      } else if (link.link_type === 'SS' && succ.start < pred.start){
        succ.start = pred.start; succ.end = succ.start + duration; changed = true;
      } else if (link.link_type === 'FF' && succ.end < pred.end){
        succ.end = pred.end; succ.start = succ.end - duration; changed = true;
      }
    }
  }

  const updates = activities
    .map(a => ({ id: a.id, computed: byId.get(a.id), original: a }))
    .filter(({ computed, original }) => ganttFmtDate(computed.start) !== original.start_date || ganttFmtDate(computed.end) !== original.end_date);

  for (const u of updates){
    await supabaseClient.from('project_activities').update({
      start_date: ganttFmtDate(u.computed.start),
      end_date: ganttFmtDate(u.computed.end)
    }).eq('id', u.id);
  }
}

// ---------------------------------------------------------------------------
// TRACEABILITY: requirements link to use-case nodes and architecture-block
// nodes of the saved/working diagrams. Links live on the requirement
// (project_requirements.links = [{t:'usecases'|'architecture', id:<node id>}]);
// everything below is derived from that plus the diagram nodes, so the
// matrix, gap list and coverage figures update as soon as either changes.
// A link whose node has since been deleted from its diagram is ignored.
// ---------------------------------------------------------------------------
const SE_NODE_KIND = { usecases: 'usecase', architecture: 'block' };
const SE_STATUSES = ['created', 'implemented', 'verified', 'validated'];

function seTargets(type){
  return ensureDiagramState(type).nodes.filter(n => n.kind === SE_NODE_KIND[type]);
}
function seReqLinkIds(req, type){
  const live = new Set(seTargets(type).map(n => n.id));
  return (req.links || []).filter(l => l.t === type && live.has(l.id)).map(l => l.id);
}
function seCurrentLinks(req){
  return [
    ...seReqLinkIds(req, 'usecases').map(id => ({ t: 'usecases', id })),
    ...seReqLinkIds(req, 'architecture').map(id => ({ t: 'architecture', id }))
  ];
}
function seAnalyze(){
  const reqs = (project.project_requirements || []).slice().sort((a, b) => a.req_number - b.req_number);
  const useCases = seTargets('usecases'), blocks = seTargets('architecture');
  const usedUc = new Set(), usedBl = new Set();
  const rows = reqs.map(req => {
    const uc = new Set(seReqLinkIds(req, 'usecases')), bl = new Set(seReqLinkIds(req, 'architecture'));
    uc.forEach(id => usedUc.add(id)); bl.forEach(id => usedBl.add(id));
    return { req, uc, bl };
  });
  const byStatus = {};
  SE_STATUSES.forEach(s => { byStatus[s] = reqs.filter(r => r.status === s).length; });
  return {
    reqs, rows, useCases, blocks, byStatus, total: reqs.length,
    allocated: rows.filter(r => r.bl.size > 0).length,
    traced: rows.filter(r => r.uc.size > 0).length,
    verified: byStatus.verified + byStatus.validated,
    withEvidence: reqs.filter(r => (seLatestVerification(r.id) || {}).result === 'pass').length,
    failedLatest: reqs.filter(r => (seLatestVerification(r.id) || {}).result === 'fail'),
    verifiedNoEvidence: reqs.filter(r => (r.status === 'verified' || r.status === 'validated') && !seVerifications(r.id).some(v => v.result === 'pass')),
    reqNoBlock: rows.filter(r => r.bl.size === 0).map(r => r.req),
    reqNoUseCase: rows.filter(r => r.uc.size === 0).map(r => r.req),
    blockNoReq: blocks.filter(b => !usedBl.has(b.id)),
    useCaseNoReq: useCases.filter(u => !usedUc.has(u.id))
  };
}
const sePct = (n, total) => total ? Math.round((n / total) * 100) : 0;
const SE_VER_METHODS = ['test', 'inspection', 'analysis', 'demonstration'];
const SE_VER_RESULTS = ['pass', 'fail', 'pending'];
// Records come back newest first; the first one for a requirement is its latest.
function seVerifications(reqId){ return (project.verifications || []).filter(v => v.requirement_id === reqId); }
function seLatestVerification(reqId){ return seVerifications(reqId)[0] || null; }
const seReqCode = (r) => 'REQ-' + String(r.req_number).padStart(3, '0');

function seCoverageCards(a){
  const card = (n, label) => `<div class="stat-card"><div class="stat-value">${sePct(n, a.total)}%</div><div class="stat-label">${label} · ${n}/${a.total}</div></div>`;
  return `<div class="stat-grid" style="margin-bottom:14px;">
      <div class="stat-card"><div class="stat-value">${a.total}</div><div class="stat-label">${t('cov.total')}</div></div>

    <div class="se-status-bar" role="img" aria-label="${SE_STATUSES.map(s => `${t('project.status.' + s)}: ${a.byStatus[s]}`).join(', ')}">

}

// ---------------------------------------------------------------------------
// PDF REPORT: a print-ready document (requirements, use case specs, every diagram,
// the traceability matrix and verification records) opened in a new tab. The
// browser's print dialog saves it as a PDF, which keeps the diagrams as real
// vector graphics and the text selectable. No PDF library needed.
// ---------------------------------------------------------------------------
function diagramContentBox(type){
  const st = ensureDiagramState(type);
  if (!st.nodes.length) return null;
  let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity;
  st.nodes.forEach(n => {
    const sz = DIAGRAM_SHAPE_SIZE[n.kind];
    x1 = Math.min(x1, n.x); y1 = Math.min(y1, n.y);
    x2 = Math.max(x2, n.x + sz.w); y2 = Math.max(y2, n.y + sz.h + (n.kind === 'decision' ? 24 : 0));
  });
  if (type === 'sequence') y2 = Math.max(y2, Math.max(100, ...st.edges.map(e => e.y == null ? 110 : e.y)) + 60);
  const m = 30;
  x1 = Math.max(0, x1 - m); y1 = Math.max(0, y1 - m);
  x2 = Math.min(DIAGRAM_CANVAS_W, x2 + m); y2 = Math.min(diagramCanvasH(type), y2 + m);
  return { x: x1, y: y1, w: x2 - x1, h: y2 - y1 };
}

// The live diagram as a standalone-sized SVG, cropped to its content and scaled to the page width.
function diagramSvgForReport(type){
  const box = diagramContentBox(type);
  if (!box) return '';
  const prevSel = diagramSelected[type];
  diagramSelected[type] = null;
  let svg = buildDiagramSvgHTML(type, 1);
  diagramSelected[type] = prevSel;
  return svg
    .replace(/viewBox="[^"]*"/, `viewBox="${box.x} ${box.y} ${box.w} ${box.h}"`)
    .replace(/ width="[\d.]+" height="[\d.]+"/, ' style="width:100%;height:auto;max-height:150mm"');
}

function buildSeReportHtml(){
  const a = seAnalyze();
  const esc = escapeHTML;
  const today = new Date().toLocaleDateString(currentLang, { dateStyle: 'long' });
  const author = currentUser ? (currentUser.user_metadata?.display_name || currentUser.email) : '';
  const dash = '<span class="empty">—</span>';
  const names = (type, ids) => seTargets(type).filter(n => ids.has(n.id)).map(n => esc(n.label)).join(', ') || dash;
  const verText = (v) => v ? `<span class="${v.result}">${t('ver.result_' + v.result)}</span> · ${t('ver.method_' + v.method)} · ${esc(v.performed_on)}` : dash;

  let body = `<div class="noprint"><button type="button" onclick="window.print()">${t('rpt.print')}</button><span>${t('rpt.print_hint')}</span></div>
    <h1>${esc(project.title)}</h1>
    <p class="sub">${t('rpt.title')}</p>
    <p class="meta">${t('rpt.generated')} ${esc(today)}${author ? ` ${t('rpt.by')} ${esc(author)}` : ''} · Together</p>
    ${project.pitch ? `<p>${esc(project.pitch)}</p>` : ''}`;

  // Summary
  const card = (label, value) => `<div class="card"><b>${value}</b>${label}</div>`;
  body += `<h2>${t('rpt.summary')}</h2><div class="cards">
    ${card(t('cov.total'), a.total)}
    ${card(t('cov.allocated'), sePct(a.allocated, a.total) + '%')}
    ${card(t('cov.traced'), sePct(a.traced, a.total) + '%')}
    ${card(t('cov.verified'), sePct(a.verified, a.total) + '%')}
    ${card(t('cov.evidence'), sePct(a.withEvidence, a.total) + '%')}
  </div><p class="meta">${SE_STATUSES.map(st => `${t('project.status.' + st)}: ${a.byStatus[st]}`).join(' · ')}</p>`;

  // Requirements
  body += `<h2>${t('rpt.requirements')}</h2>`;
  if (!a.rows.length) body += `<p class="empty">${t('rpt.no_requirements')}</p>`;
  else body += `<table><thead><tr><th>${t('rpt.col_code')}</th><th>${t('rpt.col_requirement')}</th><th>${t('rpt.col_status')}</th><th>${t('rpt.col_usecases')}</th><th>${t('rpt.col_blocks')}</th><th>${t('rpt.col_verification')}</th></tr></thead><tbody>${
    a.rows.map(row => `<tr><td class="code">${seReqCode(row.req)}</td>
      <td><strong>${esc(row.req.title)}</strong>${row.req.description ? `<span class="desc">${esc(row.req.description)}</span>` : ''}</td>
      <td>${t('project.status.' + row.req.status)}</td><td>${names('usecases', row.uc)}</td><td>${names('architecture', row.bl)}</td>
      <td>${verText(seLatestVerification(row.req.id))}</td></tr>`).join('')}</tbody></table>`;

  // Use case specifications
  const specs = a.useCases.filter(ucHasDetail);
  if (specs.length){
    body += `<h2>${t('rpt.usecase_specs')}</h2>` + specs.map(n => {
      const d = n.detail || {};
      const lines = (txt) => String(txt || '').split('\n').map(l => l.replace(/^\s*(?:\d+[.)]|[-*•])\s*/, '').trim()).filter(Boolean);
      const field = (label, v) => String(v || '').trim() ? `<p><strong>${label}:</strong> ${esc(v)}</p>` : '';
      const steps = lines(d.steps), alts = lines(d.alts);
      return `<div class="uc"><h3>${esc(n.label)}</h3>${field(t('uc.desc'), d.desc)}${field(t('uc.pre'), d.pre)}
        ${steps.length ? `<p><strong>${t('rpt.steps')}:</strong></p><ol>${steps.map(x => `<li>${esc(x)}</li>`).join('')}</ol>` : ''}
        ${alts.length ? `<p><strong>${t('rpt.alts')}:</strong></p><ul>${alts.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}
        ${field(t('uc.post'), d.post)}</div>`;

  const drawn = DIAGRAM_TYPES.filter(ty => diagramContentBox(ty));
  if (drawn.length){
    body += `<h2>${t('rpt.diagrams')}</h2>` + drawn.map(ty => `<div class="diagram"><h3>${t('project.tab_' + ty)}</h3>${diagramSvgForReport(ty)}</div>`).join('');
  }

  // Traceability matrix
  const cols = [...a.useCases.map(n => ({ type: 'usecases', n })), ...a.blocks.map(n => ({ type: 'architecture', n }))];
  if (a.rows.length && cols.length){

  const records = project.verifications || [];

    const reqById = new Map(a.reqs.map(r => [r.id, r]));

        const r = reqById.get(v.requirement_id);
        return `<tr><td class="code">${r ? seReqCode(r) : '?'}</td><td>${t('ver.method_' + v.method)}</td><td><span class="${v.result}">${t('ver.result_' + v.result)}</span></td>
          <td>${esc(v.performed_on)}</td><td>${esc(v.created_by_name || '')}</td><td>${esc(v.notes || '')}</td><td>${v.evidence_url && /^https?:\/\//i.test(v.evidence_url) ? esc(v.evidence_url) : ''}</td></tr>`;
      }).join('')}</tbody></table>`;
  }

  return `<!doctype html><html lang="${esc(currentLang)}"><head><meta charset="utf-8"><title>${esc(project.title)} - ${t('rpt.title')}</title>
    <style>${REPORT_CSS}${DIAGRAM_EXPORT_CSS}</style></head><body>${body}</body></html>`;
}

function renderTraceabilityPanel(isOwner){
  const a = seAnalyze();
  let html = '';
  if (a.total === 0) return `<p class="credits-note">${t('trace.empty_reqs')}</p>`;

  html += `<div class="se-ai-bar"><span class="spacer"></span><button class="btn btn-ghost btn-small" type="button" data-se-pdf>⤓ ${t('rpt.button')}</button></div>`;
  html += `<div class="section-block" style="margin-top:0;"><h2>${t('trace.coverage_heading')}</h2>${seCoverageCards(a)}</div>`;

  const gapList = (title, items, labelOf) => items.length
    ? `<div class="se-gap"><h4>${title} <span class="chip chip-warn">${items.length}</span></h4><div class="card-row">${items.map(i => `<span class="chip">${escapeHTML(labelOf(i))}</span>`).join('')}</div></div>` : '';
  const gaps = gapList(t('trace.gap_req_no_block'), a.reqNoBlock, r => `${seReqCode(r)} ${r.title}`)
    + gapList(t('trace.gap_req_no_usecase'), a.reqNoUseCase, r => `${seReqCode(r)} ${r.title}`)
    + gapList(t('trace.gap_verified_no_evidence'), a.verifiedNoEvidence, r => `${seReqCode(r)} ${r.title}`)
    + gapList(t('trace.gap_failed'), a.failedLatest, r => `${seReqCode(r)} ${r.title}`)
    + gapList(t('trace.gap_block_no_req'), a.blockNoReq, n => n.label)
    + gapList(t('trace.gap_usecase_no_req'), a.useCaseNoReq, n => n.label);
  html += `<div class="section-block"><h2>${t('trace.gaps_heading')}</h2>${gaps || `<p class="credits-note">${t('trace.no_gaps')}</p>`}</div>`;

  const cols = [
    ...a.useCases.map(n => ({ type: 'usecases', node: n })),
    ...a.blocks.map(n => ({ type: 'architecture', node: n }))
  ];
  html += `<div class="section-block"><h2>${t('trace.heading')}</h2><p class="credits-note" style="margin-bottom:10px;">${t('trace.sub')}</p>`;
  if (cols.length === 0){
    html += `<p class="credits-note">${t('req.links_none_usecases')}<br>${t('req.links_none_blocks')}</p>`;
  } else {
    html += `<div class="trace-wrap"><table class="trace-table"><thead><tr><th class="trace-corner" rowspan="2"></th>`;
    if (a.useCases.length) html += `<th class="trace-group uc" colspan="${a.useCases.length}">${t('trace.col_usecases')}</th>`;
    if (a.blocks.length) html += `<th class="trace-group bl" colspan="${a.blocks.length}">${t('trace.col_blocks')}</th>`;
    html += `</tr><tr>${cols.map(c => `<th class="trace-col ${c.type === 'usecases' ? 'uc' : 'bl'}" title="${escapeHTML(c.node.label)}"><span>${escapeHTML(c.node.label)}</span></th>`).join('')}</tr></thead><tbody>`;
    a.rows.forEach(row => {
      html += `<tr><th class="trace-row" title="${escapeHTML(row.req.title)}"><span class="req-code">${seReqCode(row.req)}</span> ${escapeHTML(row.req.title)}</th>`;
      cols.forEach(c => {
        const on = (c.type === 'usecases' ? row.uc : row.bl).has(c.node.id);
        const attrs = isOwner ? ` data-trace-toggle="${row.req.id}|${c.type}|${c.node.id}" role="button" tabindex="0" aria-pressed="${on}" aria-label="${escapeHTML(seReqCode(row.req) + ' / ' + c.node.label)}"` : '';
        html += `<td class="trace-cell ${c.type === 'usecases' ? 'uc' : 'bl'}${on ? ' on' : ''}${isOwner ? ' editable' : ''}"${attrs}>${on ? '●' : ''}</td>`;
      });
      html += `</tr>`;
    });
    html += `</tbody></table></div>`;
  }
  html += `</div>`;
  return html;
}

// AI HELP for the systems engineering tabs. The se-assist Edge Function only ever
// returns proposals; nothing changes until the user clicks Add / Apply.
// ---------------------------------------------------------------------------
let seAi = { scope: null, task: null, status: 'idle', result: null, error: '', reqId: null };

async function seAssistCall(task, payload){
  const { data, error } = await supabaseClient.functions.invoke('se-assist', { body: { project_id: projectId, task, lang: currentLang, payload } });
  if (error){
    let message = error.message;
    try { const body = await error.context.json(); if (body && body.error) message = body.error; } catch (e) {}
    throw new Error(message);
  }
  if (!data || !data.result) throw new Error(t('seai.bad_reply'));
  return data.result;
}

async function seAiRun(scope, task, payload, reqId){
  seAi = { scope, task, status: 'loading', result: null, error: '', reqId: reqId || null };
  render();
  try {
    seAi.result = await seAssistCall(task, payload);
    seAi.status = 'done';
  } catch (err) {
    seAi.status = 'error'; seAi.error = err.message;
  }
  render();
  const panel = document.getElementById('seAiPanel');
  if (panel) panel.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

// Adds the proposed blocks (reusing same-named existing ones) and connections to the architecture diagram as an undoable, unsaved change.
function seAiApplyArchitecture(){
  const r = seAi.result;
  const state = ensureDiagramState('architecture');
  diagramCheckpoint('architecture');
  const idByName = new Map(state.nodes.filter(n => n.kind === 'block').map(n => [n.label.toLowerCase(), n.id]));
  const startY = state.nodes.length ? Math.min(diagramCanvasH('architecture') - 120, Math.max(...state.nodes.map(n => n.y)) + 150) : 40;
  let placed = 0;
  r.blocks.forEach(b => {
    if (idByName.has(b.name.toLowerCase())) return;
    const id = 'n' + Math.random().toString(36).slice(2, 9);
    state.nodes.push({ id, kind: 'block', x: 30 + (placed % 4) * 280, y: startY + Math.floor(placed / 4) * 150, label: b.name, sublabel: b.description });
    idByName.set(b.name.toLowerCase(), id);
    placed++;
  });
  r.connections.forEach(c => {
    const from = idByName.get(c.from.toLowerCase()), to = idByName.get(c.to.toLowerCase());
    if (!from || !to || from === to) return;
    const kind = DIAGRAM_EDGE_KINDS_BY_TYPE.architecture.includes(c.kind) ? c.kind : 'flow';
    if (state.edges.some(e => e.from === from && e.to === to && e.kind === kind)) return;
    state.edges.push({ id: 'e' + Math.random().toString(36).slice(2, 9), from, to, kind, ...(c.label ? { label: c.label } : {}) });
  });
  diagramDirty.architecture = true;
  seViewsStale = true;
  seAi = { scope: 'architecture', task: null, status: 'applied', result: null, error: '', reqId: null, note: t('seai.diagram_added') };
  render();
}

function renderReqLinkChips(req){
  const names = (type) => {

  };
  const uc = names('usecases'), bl = names('architecture');
  const chips = (list, icon, warnKey) => list.length
    ? list.map(l => `<span class="chip">${icon} ${escapeHTML(l)}</span>`).join('')
    : `<span class="chip chip-warn">${t(warnKey)}</span>`;
  return `<div class="req-links card-row">${chips(uc, '🎭', 'req.warn_no_usecase')}${chips(bl, '▦', 'req.warn_no_block')}</div>`;
}

function wireEvents(){
  content.querySelectorAll('.tab-group-bar button').forEach(btn => btn.addEventListener('click', () => {
    const group = btn.dataset.group;
    if (group === activeGroup) return;
    activeGroup = group;
    activeTab = lastTabInGroup[group] || TAB_GROUPS[group][0];
    lastTabInGroup[activeGroup] = activeTab;
    render();
    maybeAutoFitActiveTab();
  }));

  content.querySelectorAll('.tab-bar button').forEach(btn => btn.addEventListener('click', () => {
    activeTab = btn.dataset.tab;
    lastTabInGroup[activeGroup] = activeTab;
    // Views that list diagram nodes (requirement links, matrix) must pick up diagram edits made since the last render.
    if (seViewsStale && (activeTab === 'requirements' || activeTab === 'traceability')){
      seViewsStale = false;
      render();
      return;
    }
    content.querySelectorAll('.tab-bar button').forEach(b => b.classList.toggle('active', b === btn));
    content.querySelectorAll('.tab-panel').forEach(p => { p.hidden = p.dataset.panel !== activeTab; });
    maybeAutoFitActiveTab();
  }));

  content.querySelectorAll('[data-jump-tab]').forEach(btn => btn.addEventListener('click', () => {
    jumpToTab(btn.dataset.jumpTab);
    maybeAutoFitActiveTab();
  }));

  const requestBtn = document.getElementById('requestJoinBtn');

  }));

  // --- Risks ---
  const riskForm = document.getElementById('riskForm');
  if (riskForm) riskForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const msg = document.getElementById('riskMsg');
    msg.textContent = ''; msg.className = 'form-msg';
    const fd = new FormData(e.target);
    const isMitigated = fd.get('is_mitigated') === 'on';
    const residualProb = fd.get('residual_probability_pct');
    const residualImpact = fd.get('residual_impact_cost');
    const payload = {
      title: (fd.get('title') || '').trim(),
      description: (fd.get('description') || '').trim() || null,
      likelihood: Number(fd.get('likelihood')),
      severity: Number(fd.get('severity')),
      probability_pct: Number(fd.get('probability_pct')),
      impact_cost: Number(fd.get('impact_cost')),
      impact_unit: fd.get('impact_unit') === 'time' ? 'time' : 'cost',
      is_mitigated: isMitigated,
      // Unchecking "Mitigate this risk" clears the after-mitigation fields
      // rather than just hiding them, so a stale residual estimate can't
      // linger and silently resurface if the risk is marked mitigated again.
      mitigation_strategy: isMitigated ? ((fd.get('mitigation_strategy') || '').trim() || null) : null,
      residual_probability_pct: isMitigated && residualProb !== '' ? Number(residualProb) : null,
      residual_impact_cost: isMitigated && residualImpact !== '' ? Number(residualImpact) : null
    };
    const editingId = e.target.dataset.editing;
    let error;
    if (editingId){
      ({ error } = await supabaseClient.from('project_risks').update(payload).eq('id', editingId));
    } else {
      const userName = currentUser.user_metadata?.display_name || currentUser.email.split('@')[0];
      ({ error } = await supabaseClient.from('project_risks').insert({ project_id: projectId, ...payload, created_by: currentUser.id, created_by_name: userName }));
    }
    if (error){ msg.textContent = error.message; msg.className = 'form-msg error'; return; }
    editingRiskId = null;
    loadProject();
  });
  content.querySelectorAll('[data-edit-risk]').forEach(btn => btn.addEventListener('click', () => {
    editingRiskId = btn.dataset.editRisk;
    render();
  }));
  content.querySelectorAll('[data-delete-risk]').forEach(btn => btn.addEventListener('click', async () => {
    await supabaseClient.from('project_risks').delete().eq('id', btn.dataset.deleteRisk);
    loadProject();
  }));
  const riskMitigateCheckbox = document.getElementById('riskMitigateCheckbox');
  if (riskMitigateCheckbox) riskMitigateCheckbox.addEventListener('change', (e) => {
    document.getElementById('riskMitigationFields').hidden = !e.target.checked;
  });

  content.querySelectorAll('.mitigation-add-row').forEach(form => form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const description = (fd.get('description') || '').trim();
    if (!description) return;
    const cost = fd.get('cost');
    const userName = currentUser.user_metadata?.display_name || currentUser.email.split('@')[0];
    await supabaseClient.from('project_risk_mitigations').insert({
      project_id: projectId, risk_id: e.target.dataset.riskId, description,
      cost: cost === '' ? null : Number(cost), created_by: currentUser.id, created_by_name: userName
    });
    loadProject();
  }));
  content.querySelectorAll('[data-delete-mitigation]').forEach(btn => btn.addEventListener('click', async () => {
    await supabaseClient.from('project_risk_mitigations').delete().eq('id', btn.dataset.deleteMitigation);
    loadProject();
  }));

  const activityForm = document.getElementById('activityForm');
  if (activityForm) activityForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const msg = document.getElementById('activityMsg');
    msg.textContent = ''; msg.className = 'form-msg';
    const fd = new FormData(e.target);
    const title = (fd.get('title') || '').trim();
    const startDate = fd.get('start_date');
    const endDate = fd.get('end_date');
    const wbsItemId = fd.get('wbs_item_id') || null;
    if (endDate < startDate){ msg.textContent = t('project.activity_date_err'); msg.className = 'form-msg error'; return; }
    const editingId = e.target.dataset.editing;
    let error;
    if (editingId){
      ({ error } = await supabaseClient.from('project_activities').update({ title, start_date: startDate, end_date: endDate, wbs_item_id: wbsItemId }).eq('id', editingId));
    } else {
      ({ error } = await supabaseClient.from('project_activities').insert({ project_id: projectId, title, start_date: startDate, end_date: endDate, wbs_item_id: wbsItemId }));
    }
    if (error){ msg.textContent = error.message; msg.className = 'form-msg error'; return; }
    editingActivityId = null;
    await recalcAndSaveSchedule();
    loadProject();
  });
  content.querySelectorAll('[data-edit-activity]').forEach(btn => btn.addEventListener('click', () => {
    editingActivityId = btn.dataset.editActivity;
    render();
  }));
  content.querySelectorAll('[data-delete-activity]').forEach(btn => btn.addEventListener('click', async () => {
    await supabaseClient.from('project_activities').delete().eq('id', btn.dataset.deleteActivity);
    loadProject();
  }));

  const linkForm = document.getElementById('linkForm');
  if (linkForm) linkForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const msg = document.getElementById('linkMsg');
    msg.textContent = ''; msg.className = 'form-msg';
    const fd = new FormData(e.target);
    const predecessorId = fd.get('predecessor_id');
    const successorId = fd.get('successor_id');
    const linkType = fd.get('link_type');
    if (predecessorId === successorId){ msg.textContent = t('project.link_same_err'); msg.className = 'form-msg error'; return; }
    const { error } = await supabaseClient.from('project_activity_links').insert({
      project_id: projectId, predecessor_id: predecessorId, successor_id: successorId, link_type: linkType
    });
    if (error){ msg.textContent = error.message; msg.className = 'form-msg error'; return; }
    await recalcAndSaveSchedule();
    loadProject();
  });
  content.querySelectorAll('[data-delete-link]').forEach(btn => btn.addEventListener('click', async () => {
    await supabaseClient.from('project_activity_links').delete().eq('id', btn.dataset.deleteLink);
    loadProject();
  }));

  const wbsForm = document.getElementById('wbsForm');
  if (wbsForm) wbsForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const msg = document.getElementById('wbsMsg');
    msg.textContent = ''; msg.className = 'form-msg';
    const fd = new FormData(e.target);
    const title = (fd.get('title') || '').trim();
    const description = (fd.get('description') || '').trim();
    const parentId = fd.get('parent_id') || null;
    const editingId = e.target.dataset.editing;
    const existing = editingId ? (project.project_wbs_items || []).find(i => i.id === editingId) : null;
    let error;
    if (editingId){
      // Only re-append at the end of the sibling group if the parent actually changed —
      // otherwise editing the title would silently bump the item to last place.
      const parentChanged = existing && (existing.parent_id || null) !== (parentId || null);
      const payload = { title, description: description || null, parent_id: parentId };
      if (parentChanged) payload.sort_order = nextWbsSortOrder(parentId, editingId);
      ({ error } = await supabaseClient.from('project_wbs_items').update(payload).eq('id', editingId));
    } else {
      ({ error } = await supabaseClient.from('project_wbs_items').insert({
        project_id: projectId, title, description: description || null, parent_id: parentId,
        sort_order: nextWbsSortOrder(parentId, null)
      }));
    }
    if (error){ msg.textContent = error.message; msg.className = 'form-msg error'; return; }
    editingWbsId = null;
    loadProject();
  });
  content.querySelectorAll('[data-edit-wbs]').forEach(btn => btn.addEventListener('click', () => {
    editingWbsId = btn.dataset.editWbs;
    render();
  }));
  content.querySelectorAll('[data-delete-wbs]').forEach(btn => btn.addEventListener('click', async () => {
    if (!confirm(t('project.wbs_delete_confirm'))) return;
    await supabaseClient.from('project_wbs_items').delete().eq('id', btn.dataset.deleteWbs);
    loadProject();
  }));
  content.querySelectorAll('[data-move-wbs-up]').forEach(btn => btn.addEventListener('click', () => moveWbsItem(btn.dataset.moveWbsUp, 'up')));
  content.querySelectorAll('[data-move-wbs-down]').forEach(btn => btn.addEventListener('click', () => moveWbsItem(btn.dataset.moveWbsDown, 'down')));

  content.querySelectorAll('[data-zoom-in]').forEach(btn => btn.addEventListener('click', () => {
    const z = ZOOM_STATE[btn.dataset.zoomIn];
    z.set(clampZoom(z.get() * ZOOM_FACTOR));
    render();
  }));
  content.querySelectorAll('[data-zoom-out]').forEach(btn => btn.addEventListener('click', () => {
    const z = ZOOM_STATE[btn.dataset.zoomOut];
    z.set(clampZoom(z.get() / ZOOM_FACTOR));
    render();
  }));
  content.querySelectorAll('[data-zoom-reset]').forEach(btn => btn.addEventListener('click', () => {
    ZOOM_STATE[btn.dataset.zoomReset].set(1);
    render();
  }));
  content.querySelectorAll('[data-export-png]').forEach(btn => btn.addEventListener('click', () => {
    if (btn.dataset.exportPng === 'gantt') exportGanttPng();
    else exportWbsPng();
  }));
  content.querySelectorAll('[data-export-svg]').forEach(btn => btn.addEventListener('click', () => {
    const prefix = btn.dataset.exportSvg;
    if (prefix === 'gantt') exportGanttSvg();
    else if (prefix === 'wbs') exportWbsSvg();
    else exportDiagramSvg(prefix);
  }));

  // --- Team tab ---
  content.querySelectorAll('[data-remove-collab]').forEach(btn => btn.addEventListener('click', async () => {
    if (!confirm(t('project.remove_collaborator_confirm'))) return;
    await supabaseClient.from('project_collaborators').delete().eq('id', btn.dataset.removeCollab);
    loadProject();
  }));

  // --- Links tab ---
  const linkForm2 = document.getElementById('linkForm2');
  if (linkForm2) linkForm2.addEventListener('submit', async (e) => {
    e.preventDefault();
    const msg = document.getElementById('linkMsg2');
    msg.textContent = ''; msg.className = 'form-msg';
    const fd = new FormData(e.target);
    const payload = {
      label: (fd.get('label') || '').trim(),
      url: (fd.get('url') || '').trim(),
      link_type: fd.get('link_type') || 'other'
    };
    const editingId = e.target.dataset.editing;
    let error;
    if (editingId){
      ({ error } = await supabaseClient.from('project_links').update(payload).eq('id', editingId));
    } else {
      ({ error } = await supabaseClient.from('project_links').insert({ project_id: projectId, ...payload }));
    }
    if (error){ msg.textContent = error.message; msg.className = 'form-msg error'; return; }
    editingLinkId = null;
    loadProject();
  });
  content.querySelectorAll('[data-edit-link]').forEach(btn => btn.addEventListener('click', () => {
    editingLinkId = btn.dataset.editLink;
    render();
  }));
  content.querySelectorAll('[data-delete-link2]').forEach(btn => btn.addEventListener('click', async () => {
    await supabaseClient.from('project_links').delete().eq('id', btn.dataset.deleteLink2);
    loadProject();
  }));

  // --- AI tab ---
  const aiForm = document.getElementById('aiForm');
  if (aiForm){
    const aiTextarea = document.getElementById('aiInput');
    const aiSendBtn = document.getElementById('aiSendBtn');

    autoGrowTextarea(aiTextarea);

    aiTextarea.addEventListener('input', () => {
      aiSendBtn.disabled = aiTextarea.value.trim().length === 0;
      autoGrowTextarea(aiTextarea);
    });

    aiTextarea.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey){
        e.preventDefault();
        if (!aiSendBtn.disabled) aiForm.requestSubmit();
      }
    });

    aiForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('aiMsg');
      const message = aiTextarea.value.trim();
      if (!message) return;
      msg.textContent = ''; msg.className = 'form-msg';
      aiSendBtn.disabled = true; aiTextarea.disabled = true;
      const { error } = await supabaseClient.functions.invoke('gemini-chat', { body: { project_id: projectId, message } });
      aiTextarea.disabled = false;
      if (error){
        let errMsg = error.message;
        try { const body = await error.context.json(); if (body?.error) errMsg = body.error; } catch (e2) {}
        msg.textContent = errMsg; msg.className = 'form-msg error';
        aiSendBtn.disabled = false;
        aiTextarea.focus();
        return;
      }
      aiTextarea.value = '';
      autoGrowTextarea(aiTextarea);
      loadProject();
    });
  }
  const aiLog = document.getElementById('aiLog');
  if (aiLog) aiLog.scrollTop = aiLog.scrollHeight;

  const aiClearBtn = document.getElementById('aiClearBtn');
  if (aiClearBtn) aiClearBtn.addEventListener('click', async () => {
    if (!confirm(t('project.ai_clear_confirm'))) return;
    await supabaseClient.from('project_ai_messages').delete().eq('project_id', projectId).eq('user_id', currentUser.id);
    loadProject();
  });

  // --- Admin controls ---
  const adminDeleteBtn = document.getElementById('adminDeleteProjectBtn');
  if (adminDeleteBtn) adminDeleteBtn.addEventListener('click', async () => {
    if (!confirm(t('project.admin_delete_confirm'))) return;
    if (!confirm(t('project.admin_delete_confirm2'))) return;
    adminDeleteBtn.disabled = true;
    const { error } = await supabaseClient.from('projects').delete().eq('id', projectId);
    if (error){ alert(error.message); adminDeleteBtn.disabled = false; return; }
    window.location.href = 'projects.html';
  });

  // --- Systems Engineering diagrams ---
  wireDiagramToolbars();
  DIAGRAM_TYPES.forEach(ty => wireDiagramCanvasInteractions(ty));
}

async function init(){
  if (!supabaseClient){
    content.innerHTML = `<p class="form-msg error">${t('project.not_connected')}</p>`;
    return;
  }
  const { data: { session } } = await supabaseClient.auth.getSession();
  currentUser = session?.user || null;
  renderNav();
  await loadProject();
  supabaseClient.auth.onAuthStateChange(async (_event, session) => {
    currentUser = session?.user || null;
    renderNav();
    await loadProject();
  });
}
init();
</script>

</body>
</html>
