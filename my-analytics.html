<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My analytics — Together</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="config-banner" id="configBanner" hidden>
  <div class="wrap">
    <span><strong>Demo mode:</strong> <span data-i18n="banner.demo_projects">connect a free Supabase project to view real projects.</span></span>
    <button id="dismissBanner" aria-label="Dismiss">&times;</button>
  </div>
</div>

<header class="nav">
  <div class="nav-inner">
    <a class="brand" href="index.html"><img src="assets/logo.jpg" alt="Together"/></a>
    <nav class="nav-links"><a href="feed.html" data-i18n="nav.feed">Feed</a></nav>
    <div class="nav-auth" id="navAuth">
      <a class="btn btn-ghost" href="login.html" data-i18n="nav.login">Log in</a>
      <a class="btn btn-primary" href="signup.html" data-i18n="nav.signup">Sign up</a>
    </div>
    <span id="notifSlot"></span>
    <span id="langSlot"></span>
  </div>
</header>

<main>
  <div class="wrap" style="padding-top:52px;padding-bottom:60px;">
    <a class="auth-back" href="dashboard.html" data-i18n="myanalytics.back_to_dashboard">← Back to dashboard</a>
    <div id="pageContent"><div class="loading-state"><span class="spinner" aria-hidden="true"></span><span data-i18n="common.loading">Loading…</span></div></div>
  </div>
</main>

<footer>
  <div class="wrap footer-inner">
    <div class="footer-brand"><img src="assets/logo.jpg" alt="Together"/></div>
    <p class="fine">© <span id="year"></span> Together. <span data-i18n="footer.tagline">Join efforts, not feeds.</span></p>
    <a class="contact" href="terms.html" data-i18n="footer.terms">Terms of Use</a>
    <a class="contact" href="mailto:aolbr_mail@yahoo.com.br" data-i18n="footer.contact">Contact →</a>
  </div>
</footer>

<script src="config.js"></script>
<script src="i18n.js"></script>
<script>
document.getElementById('year').textContent = new Date().getFullYear();
showConfigBannerIfNeeded();
document.getElementById('langSlot').innerHTML = langSwitcherHTML();
wireLangSwitcher();
applyStaticTranslations();

function onLangChange(){
  renderNav();
  if (stats) render();
}

const navAuth = document.getElementById('navAuth');
const content = document.getElementById('pageContent');

let currentUser = null;
let stats = null;

function renderNav(){
  if (currentUser){
    const name = currentUser.user_metadata?.display_name || currentUser.email.split('@')[0];
    navAuth.innerHTML = `
      <a class="btn btn-ghost btn-small" href="dashboard.html">${t('nav.dashboard')}</a>
      <span class="user-chip"><span class="avatar">${initials(name)}</span>${escapeHTML(name)}</span>
      <a class="btn btn-ghost btn-small" href="feed.html">${t('nav.feed')}</a>
    `;
    initNotifications(currentUser);
  } else {
    navAuth.innerHTML = `
      <a class="btn btn-ghost" href="login.html">${t('nav.login')}</a>
      <a class="btn btn-primary" href="signup.html">${t('nav.signup')}</a>
    `;
    teardownNotifications();
  }
}

function renderLoggedOut(){
  content.innerHTML = `
    <h1>${t('myanalytics.heading')}</h1>
    <p class="auth-sub" style="margin-top:8px;">${t('myanalytics.login_prompt')}</p>
    <div class="hero-ctas" style="margin-top:16px;">
      <a class="btn btn-primary" href="login.html">${t('nav.login')}</a>
    </div>
  `;
}

async function loadAnalytics(){
  const uid = currentUser.id;

  const [{ data: ownedProjects }, { data: collabRows }, { data: profileRow }] = await Promise.all([
    supabaseClient.from('projects').select('id').eq('owner_id', uid),
    supabaseClient.from('project_collaborators').select('project_id').eq('user_id', uid).eq('status', 'approved'),
    supabaseClient.from('profiles').select('created_at, is_premium').eq('id', uid).single()
  ]);

  const ownedIds = (ownedProjects || []).map(p => p.id);
  const joinedIds = (collabRows || []).map(r => r.project_id).filter(id => !ownedIds.includes(id));

  const [
    { data: assignedRows },
    { count: feedPostCount },
    { count: chatMsgCount },
    { count: pollVoteCount },
    { count: rsvpGoingCount },
    { count: publicPostCount }
  ] = await Promise.all([
    supabaseClient.from('task_assignees').select('project_tasks(id, status, due_date)').eq('user_id', uid),
    supabaseClient.from('project_feed_posts').select('id', { count: 'exact', head: true }).eq('user_id', uid),
    supabaseClient.from('project_chat_messages').select('id', { count: 'exact', head: true }).eq('user_id', uid),
    supabaseClient.from('poll_votes').select('id', { count: 'exact', head: true }).eq('user_id', uid),
    supabaseClient.from('event_rsvps').select('id', { count: 'exact', head: true }).eq('user_id', uid).eq('status', 'going'),
    ownedIds.length ? supabaseClient.from('project_posts').select('id', { count: 'exact', head: true }).in('project_id', ownedIds) : Promise.resolve({ count: 0 })
  ]);

  const tasks = (assignedRows || []).map(r => r.project_tasks).filter(Boolean);
  const tasksRunning = tasks.filter(tk => tk.status === 'created' || tk.status === 'working').length;
  const completedTasks = tasks.filter(tk => tk.status === 'finished' || tk.status === 'approved');

  let tasksOnTime = 0, tasksWithDueDate = 0;
  const completedIdsWithDue = completedTasks.filter(tk => tk.due_date).map(tk => tk.id);
  if (completedIdsWithDue.length){
    const { data: historyRows } = await supabaseClient
      .from('task_status_history')
      .select('task_id, status, changed_at')
      .in('task_id', completedIdsWithDue)
      .eq('status', 'finished')
      .order('changed_at', { ascending: true });
    const firstFinishedAt = {};
    (historyRows || []).forEach(h => { if (!firstFinishedAt[h.task_id]) firstFinishedAt[h.task_id] = h.changed_at; });
    completedTasks.forEach(tk => {
      if (!tk.due_date) return;
      const finishedAt = firstFinishedAt[tk.id];
      if (!finishedAt) return;
      tasksWithDueDate++;
      if (finishedAt.slice(0, 10) <= tk.due_date) tasksOnTime++;
    });
  }

  stats = {
    totalProjects: ownedIds.length + joinedIds.length,
    ownedCount: ownedIds.length,
    joinedCount: joinedIds.length,
    tasksRunning,
    tasksCompleted: completedTasks.length,
    tasksOnTime, tasksWithDueDate,
    totalPosts: (feedPostCount || 0) + (publicPostCount || 0),
    chatMessages: chatMsgCount || 0,
    pollVotes: pollVoteCount || 0,
    eventsGoing: rsvpGoingCount || 0,
    memberSince: profileRow?.created_at || null,
    isPremium: !!profileRow?.is_premium
  };
  render();
}

function render(){
  const s = stats;
  const onTimeLabel = s.tasksWithDueDate > 0
    ? `${s.tasksOnTime}/${s.tasksWithDueDate} (${Math.round(100 * s.tasksOnTime / s.tasksWithDueDate)}%)`
    : '—';
  const memberSince = s.memberSince ? new Date(s.memberSince).toLocaleDateString(currentLang, { year: 'numeric', month: 'long' }) : '—';

  const html = `
    <h1>${t('myanalytics.heading')}</h1>
    <p class="auth-sub" style="margin-top:6px;">${t('myanalytics.sub')}</p>

    <div class="section-block" style="margin-top:28px;">
      <div class="stat-grid">
        <div class="stat-card"><div class="stat-value">${s.totalProjects}</div><div class="stat-label">${t('myanalytics.stat_total_projects')}</div></div>
        <div class="stat-card"><div class="stat-value">${s.ownedCount}</div><div class="stat-label">${t('myanalytics.stat_owned')}</div></div>
        <div class="stat-card"><div class="stat-value">${s.joinedCount}</div><div class="stat-label">${t('myanalytics.stat_joined')}</div></div>
        <div class="stat-card"><div class="stat-value">${s.tasksRunning}</div><div class="stat-label">${t('myanalytics.stat_tasks_running')}</div></div>
        <div class="stat-card"><div class="stat-value">${s.tasksCompleted}</div><div class="stat-label">${t('myanalytics.stat_tasks_completed')}</div></div>
        <div class="stat-card"><div class="stat-value">${onTimeLabel}</div><div class="stat-label">${t('myanalytics.stat_tasks_on_time')}</div></div>
        <div class="stat-card"><div class="stat-value">${s.totalPosts}</div><div class="stat-label">${t('myanalytics.stat_total_posts')}</div></div>
        <div class="stat-card"><div class="stat-value">${s.chatMessages}</div><div class="stat-label">${t('myanalytics.stat_chat_messages')}</div></div>
        <div class="stat-card"><div class="stat-value">${s.pollVotes}</div><div class="stat-label">${t('myanalytics.stat_poll_votes')}</div></div>
        <div class="stat-card"><div class="stat-value">${s.eventsGoing}</div><div class="stat-label">${t('myanalytics.stat_events_going')}</div></div>
      </div>
      <p class="credits-note" style="margin-top:12px;">${t('myanalytics.tasks_on_time_note')}</p>
    </div>

    <div class="section-block">
      <div class="card-row">
        <span class="chip">${t('myanalytics.member_since')} ${escapeHTML(memberSince)}</span>
        ${s.isPremium ? `<span class="chip type-profit">${t('myanalytics.premium_badge')}</span>` : ''}
      </div>
    </div>
  `;
  content.innerHTML = html;
}

async function init(){
  if (!supabaseClient){
    renderLoggedOut();
    return;
  }
  const { data: { session } } = await supabaseClient.auth.getSession();
  currentUser = session?.user || null;
  renderNav();
  if (!currentUser){
    renderLoggedOut();
    return;
  }
  await loadAnalytics();
  supabaseClient.auth.onAuthStateChange(async (_event, session) => {
    currentUser = session?.user || null;
    renderNav();
    if (!currentUser){ renderLoggedOut(); return; }
    await loadAnalytics();
  });
}
init();
</script>

</body>
</html>
