<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Go Premium — Together</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="config-banner" id="configBanner" hidden>
  <div class="wrap">
    <span><strong>Demo mode:</strong> <span data-i18n="banner.demo_accounts">connect a free Supabase project to turn on accounts.</span></span>
    <button id="dismissBanner" aria-label="Dismiss">&times;</button>
  </div>
</div>

<header class="nav">
  <div class="nav-inner">
    <a class="brand" href="index.html"><img src="assets/logo.jpg" alt="Together"/></a>
    <nav class="nav-links"><a href="feed.html" data-i18n="nav.feed">Feed</a></nav>
    <div class="nav-auth" id="navAuth"></div>
    <span id="notifSlot"></span>
    <span id="langSlot"></span>
  </div>
</header>

<main class="auth-page">
  <div class="auth-card premium-card" id="premiumCard">
    <a class="auth-back" href="feed.html" data-i18n="common.back_to_feed">← Back to feed</a>
    <div class="loading-state"><span class="spinner" aria-hidden="true"></span><span data-i18n="common.loading">Loading…</span></div>
  </div>
</main>

<footer>
  <div class="wrap footer-inner">
    <div class="footer-brand"><img src="assets/logo.jpg" alt="Together"/></div>
    <p class="fine">© <span id="year"></span> Together. <span data-i18n="footer.tagline">Join efforts, not feeds.</span></p>
    <a class="contact" href="terms.html" data-i18n="footer.terms">Terms of Use</a>
    <a class="contact" href="mailto:aolbr_mail@yahoo.com.br" data-i18n="footer.contact">Contact →</a>
  </div>
</footer>

<script src="config.js"></script>
<script src="i18n.js"></script>
<script>
document.getElementById('year').textContent = new Date().getFullYear();
showConfigBannerIfNeeded();
document.getElementById('langSlot').innerHTML = langSwitcherHTML();
wireLangSwitcher();

const card = document.getElementById('premiumCard');
const navAuth = document.getElementById('navAuth');
let lastUser = null;

function onLangChange(){
  applyStaticTranslations();
  renderNav(lastUser);
  // re-render whichever state is currently showing, using the same data already loaded
  if (currentProfile !== undefined) renderForState();
}

let currentProfile;

function renderNav(user){
  lastUser = user;
  if (user){
    const name = user.user_metadata?.display_name || user.email.split('@')[0];
    navAuth.innerHTML = `
      <span class="user-chip"><span class="avatar">${initials(name)}</span>${escapeHTML(name)}</span>
      <a class="btn btn-ghost btn-small" href="feed.html">${t('nav.feed')}</a>
    `;
    initNotifications(user);
  } else {
    navAuth.innerHTML = `
      <a class="btn btn-ghost" href="login.html">${t('nav.login')}</a>
      <a class="btn btn-primary" href="signup.html">${t('nav.signup')}</a>
    `;
    teardownNotifications();
  }
}

function renderLoggedOut(){
  card.innerHTML = `
    <a class="auth-back" href="feed.html">${t('common.back_to_feed')}</a>
    <h1>${t('premium.heading')}</h1>
    <p class="auth-sub">${t('premium.sub_login_first')}</p>
    <div class="hero-ctas" style="margin-top:6px;">
      <a class="btn btn-primary" href="login.html">${t('nav.login')}</a>
      <a class="btn btn-ghost" href="signup.html">${t('nav.signup')}</a>
    </div>
  `;
}

function renderAlreadyPremium(){
  card.innerHTML = `
    <a class="auth-back" href="feed.html">${t('common.back_to_feed')}</a>
    <div class="premium-already">
      <h2 style="font-size:20px;margin-bottom:6px;">${t('premium.already_title')}</h2>
      <p style="color:var(--ink-soft);font-size:14.5px;">${t('premium.already_sub')}</p>
    </div>
    <div class="hero-ctas" style="margin-top:20px;">
      <a class="btn btn-primary" href="feed.html">${t('premium.go_to_feed')}</a>
    </div>
  `;
}

function renderPendingApproval(){
  card.innerHTML = `
    <a class="auth-back" href="feed.html">${t('common.back_to_feed')}</a>
    <div class="premium-already">
      <h2 style="font-size:20px;margin-bottom:6px;">⏳ ${t('premium.pending_title')}</h2>
      <p style="color:var(--ink-soft);font-size:14.5px;">${t('premium.pending_sub')}</p>
    </div>
    <div class="hero-ctas" style="margin-top:20px;">
      <a class="btn btn-ghost" href="feed.html">${t('premium.go_to_feed')}</a>
    </div>
  `;
}

function renderPaymentForm(user){
  card.innerHTML = `
    <a class="auth-back" href="feed.html">${t('common.back_to_feed')}</a>
    <h1>${t('premium.heading')}</h1>
    <p class="auth-sub">${t('premium.sub')}</p>
    ${currentProfile && currentProfile.premium_status === 'denied' ? `<p class="form-msg error" style="margin-bottom:10px;">${t('premium.denied_note')}</p>` : ''}
    ${checkoutCancelled ? `<p class="form-msg" style="margin-bottom:10px;">${t('premium.cancelled')}</p>` : ''}
    <div class="premium-price">$2 <small>${t('premium.price_note')}</small></div>
    <ul class="premium-features">
      <li>${t('premium.li1')}</li>
      <li>${t('premium.li2')}</li>
      <li>${t('premium.li3')}</li>
      <li>${t('premium.li4')}</li>
    </ul>
    <button class="btn btn-primary" id="stripeCheckoutBtn" type="button">💳 ${t('premium.subscribe_cta')}</button>
    <p class="form-msg" id="checkoutMsg"></p>
    <p class="premium-note">${t('premium.stripe_disclosure')}</p>
  `;
  wireStripeCheckout(user);
}

function wireStripeCheckout(user){
  const btn = document.getElementById('stripeCheckoutBtn');
  if (!btn) return;
  btn.addEventListener('click', async () => {
    const msg = document.getElementById('checkoutMsg');
    btn.disabled = true;
    msg.textContent = t('premium.redirecting');
    msg.className = 'form-msg';
    const { data, error } = await supabaseClient.functions.invoke('create-checkout-session', { body: {} });
    if (error){
      let errMsg = error.message;
      try { const body = await error.context.json(); if (body?.error) errMsg = body.error; } catch (e2) {}
      msg.textContent = errMsg;
      msg.className = 'form-msg error';
      btn.disabled = false;
      return;
    }
    if (data?.url){
      window.location.href = data.url;
    } else {
      msg.textContent = t('premium.err_generic');
      msg.className = 'form-msg error';
      btn.disabled = false;
    }
  });
}

let currentState = 'loading';
let stateArgs = null;
const checkoutResult = new URLSearchParams(window.location.search).get('checkout');
const checkoutCancelled = checkoutResult === 'cancel';
function renderForState(){
  if (currentState === 'loggedOut') renderLoggedOut();
  else if (currentState === 'alreadyPremium') renderAlreadyPremium();
  else if (currentState === 'pendingApproval') renderPendingApproval();
  else if (currentState === 'paymentForm') renderPaymentForm(stateArgs);
}

async function init(){
  if (!supabaseClient){
    currentState = 'loggedOut';
    renderLoggedOut();
    return;
  }
  const { data: { session } } = await supabaseClient.auth.getSession();
  const user = session?.user || null;
  renderNav(user);
  if (!user){
    currentState = 'loggedOut';
    renderLoggedOut();
    return;
  }
  let { data: profile, error } = await supabaseClient.from('profiles').select('is_premium, premium_status').eq('id', user.id).single();
  if (error){
    card.innerHTML = `<a class="auth-back" href="feed.html">${t('common.back_to_feed')}</a><p class="form-msg error">${t('project.load_error')} ${escapeHTML(error.message)}</p>`;
    return;
  }
  if (checkoutResult){
    // Drop the ?checkout= param so a refresh doesn't replay this state.
    window.history.replaceState({}, '', window.location.pathname + window.location.search.replace(/[?&]checkout=[^&]*/, '').replace(/^&/, '?'));
  }
  if (checkoutResult === 'success' && !profile.is_premium){
    // Stripe's webhook usually lands within a second or two of the redirect —
    // give it a beat, then re-check once before falling back to the normal state.
    card.innerHTML = `<div class="loading-state"><span class="spinner" aria-hidden="true"></span><span>${t('premium.activating')}</span></div>`;
    await new Promise(resolve => setTimeout(resolve, 2000));
    ({ data: profile, error } = await supabaseClient.from('profiles').select('is_premium, premium_status').eq('id', user.id).single());
    if (error){
      card.innerHTML = `<a class="auth-back" href="feed.html">${t('common.back_to_feed')}</a><p class="form-msg error">${t('project.load_error')} ${escapeHTML(error.message)}</p>`;
      return;
    }
  }
  currentProfile = profile;
  if (profile && profile.is_premium){
    currentState = 'alreadyPremium';
    renderAlreadyPremium();
    return;
  }
  if (profile && profile.premium_status === 'pending'){
    currentState = 'pendingApproval';
    renderPendingApproval();
    return;
  }
  currentState = 'paymentForm';
  stateArgs = user;
  renderPaymentForm(user);
}
init();
</script>

</body>
</html>
